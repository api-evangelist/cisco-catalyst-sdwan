aid: cisco-catalyst-sdwan
name: Cisco Catalyst SD-WAN
description: 'Cisco Catalyst SD-WAN, built on the Viptela platform Cisco acquired in 2017, is Cisco''s wide-area
  network overlay: centralized policy, application-aware routing, and secure transport across MPLS, broadband and
  LTE. The SD-WAN Manager (formerly vManage) exposes a large REST API documented on Cisco DevNet, with a Terraform
  provider, Ansible content and a community MCP server built against it. The contract is served by each customer''s
  own SD-WAN Manager instance, so there is no central anonymously fetchable specification.'
url: https://raw.githubusercontent.com/api-evangelist/cisco-catalyst-sdwan/refs/heads/main/apis.yml
