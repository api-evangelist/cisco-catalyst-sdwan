method: searched
source: https://github.com/CiscoDevNet/catalyst-sdwan-mcp-community
status: published
deployment:
  mode: local-stdio
  endpoint: null
  install: git clone https://github.com/CiscoDevNet/catalyst-sdwan-mcp-community && npm install && npm
    run build && node build/index.js
  package: https://github.com/CiscoDevNet/catalyst-sdwan-mcp-community
  auth: api-key
  auth_note: No auth at the MCP transport (stdio). The server itself needs VMANAGE_HOST, VMANAGE_USERNAME
    and VMANAGE_PASSWORD in the environment and exchanges them for a JWT access token plus XSRF token
    against the customer's own SD-WAN Manager.
  verified: searched
  note: 'There is NO hosted/remote MCP endpoint for Catalyst SD-WAN and there cannot be a shared one:
    every SD-WAN Manager is a customer-operated controller, so an MCP server must run next to it. Both
    published servers are stdio, container-run, build-from-source. Neither is on npm or PyPI.'
servers:
- name: catalyst-sdwan-mcp
  repo: https://github.com/CiscoDevNet/catalyst-sdwan-mcp-community
  org: CiscoDevNet
  official: false
  labelled: community
  license: MIT
  runtime: Node.js 18+
  transport: stdio
  package_name: catalyst-sdwan-mcp
  package_version: 1.0.0
  npm: false
  container: Dockerfile + docker-compose published in the repository
  tool_count: 45
  tool_count_readme: 39
  tool_count_note: The README advertises 39 tools; the switch in src/server.ts implements 45.
  auth_modes:
  - JWT (VMANAGE_USE_JWT=true, default; requires vManage 20.18.1+)
  - session JSESSIONID fallback
  env:
  - VMANAGE_HOST
  - VMANAGE_USERNAME
  - VMANAGE_PASSWORD
  - VMANAGE_PORT (default 443)
  - VMANAGE_USE_JWT
  ships_skills: true
  skills_note: Ships one Agent Skill (skills/get_sdwan_devices.md) and one MCP resource (resources/cisco_sdwan_api.md).
  last_push: '2026-03-23'
