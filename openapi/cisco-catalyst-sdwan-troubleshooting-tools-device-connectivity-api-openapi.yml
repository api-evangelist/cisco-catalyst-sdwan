paths:
  /device/tools/admintech:
    post:
      tags:
      - Troubleshooting Tools - Device Connectivity
      description: Generate admin tech logs
      operationId: createAdminTech
      requestBody:
        description: Admin tech generation request
        content:
          application/json:
            schema:
              type: object
              properties:
                custom-commands:
                  type: array
                  description: custom commands
                  example:
                  - show version
                  - show platform
                  items:
                    type: string
                    description: command
                    example: show versio
                device-type:
                  type: string
                  example: vmanage
                deviceIP:
                  type: string
                  example: 10.3.0.1
                exclude-cores:
                  type: boolean
                  example: true
                exclude-logs:
                  type: boolean
                  example: true
                exclude-tech:
                  type: boolean
                  example: false
                tech-filter:
                  type: array
                  items:
                    type: string
              $$ref: '#/components/schemas/AdminTechCreateReq'
            examples:
              Generate Admin tech log:
                description: Generate Admin tech log
                value:
                  deviceIP: 10.3.0.1
                  device-type: vmanage
                  exclude-cores: true
                  exclude-tech: false
                  exclude-logs: false
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Tools-write,dca
