                  example: '1'
                ttl:
                  type: string
                  example: '1'
                vpn:
                  type: string
                  example: '0'
              $$ref: '#/components/schemas/NPingRequest'
            examples:
              Ping parameter:
                description: Ping parameter
                value:
                  host: 10.1.12.16
                  probeType: icmp
                  source: 10.1.12.15
                  interfaceIP: 10.1.12.15
                  vpn: '0'
        required: true
      responses:
        '200':
