                    example: 1.221
                  packetsReceived:
                    type: number
                    example: 5
                  packetsTransmitted:
                    type: number
                    example: 5
                  rawOutput:
                    type: array
                    items:
                      type: string
                $$ref: '#/components/schemas/NPingResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Tools-read
