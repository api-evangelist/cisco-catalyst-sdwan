          type: string
      requestBody:
        description: Ping parameter
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: string
                  example: '5'
                destPort:
                  type: string
                  example: '22'
                df:
                  type: string
                  example: 'true'
                host:
                  type: string
                  example: 3::2
                interfaceIP:
                  type: string
                  example: 3::1
                mtu:
                  type: string
                  example: '128'
                probeType:
                  type: string
                  example: tcp
                rapid:
                  type: string
                  example: 'true'
                size:
                  type: string
                  example: '128'
                source:
                  type: string
                  example: 3::1
                sourcePort:
                  type: string
                  example: '22'
                tos:
