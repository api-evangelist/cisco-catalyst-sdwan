  /troubleshooting/control/{uuid}:
    get:
      tags:
      - Troubleshooting Tools - Device Connectivity
      description: Troubleshoot control connections
      operationId: getControlConnections
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          pattern: ^[a-zA-Z0-9\/\\-]*$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  actualControlConnectionsToVsmart:
                    type: integer
                    format: int32
                    example: 0
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        actual-connections:
                          type: integer
                          format: int32
                          example: 2
                        color:
                          type: string
                          example: LTE
                        control:
                          type: array
                          items:
                            type: object
                            properties:
                              host-name:
                                type: string
                                example: vm9
                              is-preferred:
                                type: boolean
                                example: true
                              local-status:
                                type: string
                                enum:
                                - green
                                - red
                              local-status-info:
