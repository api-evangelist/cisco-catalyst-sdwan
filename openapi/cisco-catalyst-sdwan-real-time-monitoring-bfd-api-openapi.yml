  /device/bfd/sites/summary:
    get:
      tags:
      - Real-Time Monitoring - BFD
      description: Get BFD site summary
      operationId: getBFDSitesSummary
      parameters:
      - name: isCached
        in: query
        description: Flag for caching
        schema:
          type: boolean
          default: false
      - name: vpnId
        in: query
        description: Filter VPN
        required: true
        schema:
          type: array
          items:
            type: object
            properties:
              vpn:
                type: string
            description: This is the valid list of VPN-IDs
            $$ref: '#/components/schemas/VPNID'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                BFD site summary:
                  description: BFD site summary
                  value:
                    data:
                    - count: 6
                      detailsURL: ''
                      status: error
                      statusList:
                      - name: Full WAN Connectivity
                        status: up
                        message: 6 Full WAN Connectivity
                        detailsURL: /dataservice/device/bfd/sites/detail?state=siteup
                        count: 6
                      - name: Partial WAN Connectivity
                        status: warning
                        message: 0 Partial WAN Connectivity
                        detailsURL: /dataservice/device/bfd/sites/detail?state=sitepartial
                        count: 0
                      - name: No WAN Connectivity
                        status: down
                        message: 0 No WAN Connectivity
                        detailsURL: /dataservice/device/bfd/sites/detail?state=sitedown
                        count: 0
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
