  /device/sslproxy/status:
    get:
      tags:
      - Real-Time Monitoring - Sslproxy
      description: Get ssl proxy status from device
      operationId: getSslProxyStatus
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Ssl proxy status:
                  description: Ssl proxy status
                  value:
                    data:
                    - failure-mode: failure-mode-action-close
                      minimum-tls-version: tls-ver-1
                      vdevice-name: 169.254.10.12
                      cert-lifetime-in-days: '730'
                      unsup-cipher-suite: unsup-mode-action-drop
                      expired-cert: cert-valid-action-decrypt
                      untrusted-cert: cert-valid-action-decrypt
                      ca-tp-label: PROXY-SIGNING-CA
                      unknown-status: cert-valid-action-drop
                      rsa-key-mod: '2048'
                      clear-mode: 'false'
                      vdevice-host-name: vm5
                      ec-key-type: ec-key-p256
                      cert-revocation: cert-rev-none
                      vdevice-dataKey: 169.254.10.12
                      ca-cert-bundle: /bootflash/vmanage-admin/sslProxyDefaultCAbundle.pem
                      lastupdated: 1645776060286
                      unsup-protocol-version: unsup-mode-action-drop
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
