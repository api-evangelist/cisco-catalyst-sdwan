paths:
  /device/csp/resources/cpu-info/allocation:
    get:
      tags:
      - Real-Time Monitoring - NetworkHub Resources
      description: Get NetworkHub CPU allocation info from device
      operationId: getAllocationInfo
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                NetworkHub CPU allocation info:
                  description: NetworkHub CPU allocation info
                  value:
                    data:
                    - vdevice-name: 172.16.255.11
                      vdevice-host-name: vm1
                      total-sockets: '1'
                      cores-per-socket: '8'
                      total-logical-cpus: '16'
                      logical-cpus-used-by-system: '2'
                      logical-cpus-used-by-vnfs: '4'
                      logical-cpus-used-dedicated: '12'
                      logical-cpus-used-sharable: '2'
                      lastupdated: 1661501479353
                      vdevice-dataKey: 172.16.255.11
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: System-read,System-write
  /device/csp/resources/cpu-info/cpus:
    get:
      tags:
      - Real-Time Monitoring - NetworkHub Resources
      description: Get NetworkHub CPU info from device
      operationId: getCPUInfo
      parameters:
