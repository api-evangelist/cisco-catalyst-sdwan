        in: query
        description: deviceId - Device IP
        required: true
        schema:
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                NetworkHub CPU info:
                  description: NetworkHub CPU info
                  value:
                    data:
                    - vdevice-name: 172.16.255.11
                      vdevice-host-name: vm1
                      cpu-id: '7'
                      socket-id: '0'
                      vdevice-dataKey: 172.16.255.11
                      core-id: '7'
                      system-use: false
                      name: ROUTER3
                      vcpus: '4'
                      low-latency: true
                      vcpu-id: '0'
                      lastupdated: 1661501479353
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: System-read,System-write
  /device/csp/resources/cpu-info/vnfs:
