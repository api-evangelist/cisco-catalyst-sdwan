paths:
  /device/cellularEiolte/network:
    get:
      tags:
      - Real-Time Monitoring - Cellular EIOLTE Network Service
      description: Get cellular network  info from device
      operationId: getEiolteNetworkInfo
      parameters:
      - name: deviceId
        in: query
        description: Device Ip address, example:172.16.255.111
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                cellular network info:
                  description: cellular network info
                  value:
                  - Network-Selection-Mode: Automatic
                    MNC: 1
                    vdevice-name: 172.16.255.111
                    cellular-interface-name: Cellular 1/0
                    MCC: 1
                    vdevice-host-name: CellularGateway
                    MTU: 1500
                    System-Time: Thu Mar 24 3:6:0 2022
                    PS-State: Attached
                    Roaming-Status: Home
                    RRC-Connection-State: RRC Connected
                    vdevice-dataKey: 172.16.255.111-1-
                    Network: Test PLMN 1-1
                    EMM-State: Registered
                    TAC: 1
                    Cell-ID: 27447297
                    modem-index: '1'
                    lastupdated: 1649250149676
                    Current-Service: Packet switched
                    Current-Service-status: Normal
                    EMM-Sub-State: Normal-Service
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Policy-read,System-read
