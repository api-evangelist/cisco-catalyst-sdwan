  /event/severity/summary:
    get:
      tags:
      - Monitoring - Events
      description: Get event severity histogram
      operationId: getSeverityHistogram
      parameters:
      - name: deviceId
        in: query
        description: Device system ip
        required: true
        schema:
          type: array
          items:
            type: string
      - name: query
        in: query
        description: Query
        allowEmptyValue: true
        schema:
          type: string
        examples:
          Empty:
            description: Empty
          Get events filter by hours:
            description: Get events filter by hours
            value:
              query:
                condition: AND
                rules:
                - field: entry_time
                  operator: last_n_hours
                  type: date
                  value:
                  - '10'
              size: 100
            $$ref: '#/components/examples/ComViptelaVmanageServerEventRequestFilterByHours'
          Get events filter between dates:
            description: Get events filter between dates
            value:
              query:
                condition: AND
                rules:
                - field: entry_time
                  type: date
                  value:
                  - 2024-04-30T19:30:00 UTC
                  - 2024-05-30T17:30:00 UTC
                  operator: between
              size: 100
            $$ref: '#/components/examples/ComViptelaVmanageServerEventRequestFilterBetweenDates'
          Get events filter by type:
            description: Get events filter by type
            value:
              query:
                condition: AND
                rules:
                - field: entry_time
                  operator: last_n_hours
                  type: date
                  value:
                  - '10'
                - field: eventname
                  operator: in
                  type: string
                  value:
                  - memory-usage
              size: 100
            $$ref: '#/components/examples/ComViptelaVmanageServerEventRequestFilterByType'
          Get events filter by system ip:
            description: Get events filter by system ip
            value:
              query:
                condition: AND
                rules:
                - field: entry_time
                  operator: last_n_hours
                  type: date
                  value:
                  - '10'
                - field: system_ip
                  operator: in
                  type: string
                  value:
                  - 1.1.1.1
              size: 100
            $$ref: '#/components/examples/ComViptelaVmanageServerEventRequestFilterBySystemIp'
          Get events filter by severity:
            description: Get events filter by severity
            value:
              query:
                condition: AND
                rules:
                - field: entry_time
                  operator: last_n_hours
                  type: date
                  value:
                  - '10'
                - field: severity_level
                  operator: in
                  type: string
                  value:
                  - critical
              size: 100
            $$ref: '#/components/examples/ComViptelaVmanageServerEventRequestFilterBySeverity'
          Get events filter by site-id:
            description: Get events filter by site-id
            value:
              query:
                condition: AND
                rules:
                - field: entry_time
                  operator: last_n_hours
                  type: date
                  value:
                  - '10'
                - field: site_id
                  operator: in
                  type: string
                  value:
                  - '400'
                  - '500'
              size: 100
            $$ref: '#/components/examples/ComViptelaVmanageServerEventRequestFilterBySites'
      - name: site-id
        in: query
        description: Specify the site-id to filter the events
        schema:
          pattern: ^[0-9]+$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                $$ref: '#/components/schemas/SeveritySummary'
