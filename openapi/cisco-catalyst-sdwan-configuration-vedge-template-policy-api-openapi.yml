  /template/policy/vedge:
    post:
      tags:
      - Configuration - vEdge Template Policy
      description: Create template
      operationId: createVEdgeTemplate
      requestBody:
        description: Template policy
        content:
          application/json:
            schema:
              type: object
            examples:
              Template policy:
                description: Template policy
                value:
                  policyDescription: Demo
                  policyType: feature
                  policyName: demo-policy
                  policyDefinition:
                    assembly:
                    - definitionId: b628d664-d4ec-428f-831c-aff2b688c54c
                      type: vedgeRoute
                    - definitionId: e4b25c74-f594-49db-b78b-61bbb41464ba
                      type: acl
                    settings:
                      appVisibility: true
                      logFrequency: 60
                  isPolicyActivated: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Policy Id:
                  description: Policy Id
                  value:
                    policyId: f8efb9ed-7524-41ff-aa12-1b6635087ce1
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
