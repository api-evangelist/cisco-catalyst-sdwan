servers:
- url: /dataservice
tags:
- name: Monitoring - Status
paths:
  /statistics/settings/disable/devicelist/{indexName}:
    get:
      tags:
      - Monitoring - Status
      description: Get list of disabled devices for a statistics index
      operationId: getDisabledDeviceList
      parameters:
      - name: indexName
        in: path
        description: Index name
        required: true
        schema:
          pattern: ^[a-zA-Z-_]+$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Disabled device list:
                  description: Disabled device list
                  value:
                  - 172.16.255.14
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Settings-read
    put:
      tags:
      - Monitoring - Status
      description: Update list of disabled devices for a statistics index
      operationId: updateStatisticsDeviceList
      parameters:
      - name: indexName
        in: path
        description: Index name
        required: true
        schema:
          pattern: ^[a-zA-Z-_]+$
          type: string
      requestBody:
        description: Disabled device
        content:
          application/json:
            schema:
              type: object
            examples:
              Disabled device:
                description: Disabled device
                value:
                - 172.16.255.14
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Update status:
                  description: Update status
                  value:
                    response: true
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Settings-write
  /statistics/settings/status:
    put:
      tags:
      - Monitoring - Status
      description: Update statistics settings
      operationId: updateStatisticsSettings
      requestBody:
        description: Stats setting
        content:
          application/json:
            schema:
              type: object
            examples:
              Stats setting:
                description: Stats setting
                value:
                - indexName: interfacestatistics
                  status: enable
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Settings-write,dca
    get:
      tags:
      - Monitoring - Status
      description: Get statistics settings
      operationId: getStatisticsSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Statistics settings:
                  description: Statistics settings
                  value:
                  - indexName: approutestatsstatistics
                    status: enable
                    displayName: Approute
                  - indexName: interfacestatistics
                    status: enable
                    displayName: Interface
                  - indexName: wlanclientinfostatistics
                    status: enable
                    displayName: Wlan Client Info
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Settings-read,dca
  /statistics/settings/status/device:
    get:
      tags:
      - Monitoring - Status
      description: Get list of enabled device for statistics index
      operationId: getEnabledIndexForDevice
      parameters:
      - name: deviceId
        in: query
        description: Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Enabled device:
                  description: Enabled device
                  value:
                  - interfacestatistics
                  - eioltestatistics
                  - sulstatistics
                  - qosstatistics
                  - devicesystemstatusstatistics
                  - bridgemacstatistics
                  - dpistatistics
                  - approutestatsstatistics
                  - wlanclientinfostatistics
                  - flowlogstatistics
                  - urlf
                  - fwall
                  - vnfstatistics
                  - umbrella
                  - apphostingstatistics
                  - utddaqioxstatistics
                  - ipsalert
                  - aggregatedappsdpistatistics
                  - bridgeinterfacestatistics
                  - artstatistics
                  - trackerstatistics
                  - cloudxstatistics
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Settings-read
