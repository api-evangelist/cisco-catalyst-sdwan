  /multicloud/interconnect/{interconnect-type}/connectivity/device-links/metro-speed:
    post:
      tags:
      - Multicloud Interconnect - Connectivity
      summary: Get Device-Link metro speed.
      description: API to get metro speed for Device-Link by Device-Link Configuration.
      operationId: getInterconnectDeviceLinkMetroSpeed
      parameters:
      - name: interconnect-type
        in: path
        description: Interconnect Provider Type
        required: true
        schema:
          type: string
          enum:
          - MEGAPORT
          - EQUINIX
      requestBody:
        description: Request Payload for Multicloud Interconnect Device Links
        content:
          application/json:
            schema:
              required:
              - bandwidth
              - deviceLinkName
              - edgeAccountId
              - edgeType
              type: object
              properties:
                bandwidth:
                  type: string
                  description: Device-Link Bandwidth Input.
                  example: '50'
                deviceLinkName:
                  maxLength: 50
                  minLength: 3
                  pattern: ^[\w.-]{3,50}$
                  type: string
                  description: Name of the Interconnect Device-Link.
                  example: my-device-link
                deviceLinkUuid:
                  pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
                  type: string
                  description: Uuid of the Interconnect Device-Link
                  example: 496bddbd-e104-44a7-ba62-7a285f642304
                deviceLinksubnet:
                  type: string
                  description: Subnet pool for Interconnect Gateway interfaces in the Device-Link.
                  example: 20.10.0.0/16
                deviceList:
                  maxItems: 2147483647
                  minItems: 2
                  type: array
                  items:
                    type: object
                    properties:
                      deviceInterfaceId:
                        type: string
                        description: Interface used on the Interconnect Gateway to connect to the Device-Link.
                        example: GigabitEthernet4
                      deviceIntfIpAddress:
                        type: string
                        description: IP assigned to the Interconnect Gateway interface to connect to the Device-Link.
                        example: 20.10.0.2
                      deviceName:
                        pattern: ^[\w.-]{3,50}$
                        type: string
                        description: Name of the Interconnect Gateway in the Device-Link.
                        example: ICGW_1
                      deviceUuid:
                        type: string
                        description: Uuid of Interconnect Gateway in the Device-Link.
                        example: 0dc43131-47c9-4fce-8499-f02e3340c9fb
                      egwLoopBackCidr:
                        type: string
                        description: IP assigned to the loopback interface of the Interconnect Gateway to form SDWAN tunnel.
                        example: 172.31.251.8/30
                    $$ref: '#/components/schemas/InterconnectDeviceLinkDeviceList'
                dlMetroBandwidth:
                  type: string
                  description: Device-Link Bandwidth at a given Metro.
                  example: '150'
                edgeAccountId:
                  maxLength: 255
                  minLength: 1
                  type: string
                edgeAccountName:
                  maxLength: 255
                  minLength: 1
                  pattern: ^[a-zA-Z0-9_\-\s]+$
                  type: string
                edgeType:
                  type: string
                linkBandwidth:
                  type: string
                  description: Device-Link Bandwidth.
                  example: '50'
                resourceState:
                  type: string
                resourceStateMessage:
                  type: string
                resourceStateUpdateTs:
                  type: string
                subnet:
                  pattern: ^(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}\/(?:3[0-2]|[0-2]?[0-9])$
                  type: string
                  description: Subnet pool for Interconnect Gateway interfaces in the Device-Link.
                  example: 20.10.0.0/16
                version:
                  type: string
                  description: Version of the payload.
                  example: '1'
              description: Interconnect Device-Link Object
              $$ref: '#/components/schemas/InterconnectDeviceLink'
            examples:
              Interconnect Equinix Device Link:
                description: Interconnect Equinix Device Link
                value:
                  edgeType: EQUINIX
                  edgeAccountId: ABCD-1234-CDEF
                  edgeAccountName: interconnect-account-name
                  deviceLinkName: my-device-link
                  subnet: 20.10.0.0/16
                  bandwidth: '100'
                  deviceList:
                  - deviceName: ICGW_1
                  - deviceName: ICGW_2
        required: true
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  dlMetroBandwidth:
                    type: integer
                    description: Device-Link metro speed
                    format: int64
                    example: 200
                $$ref: '#/components/schemas/InlineResponse20012'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
