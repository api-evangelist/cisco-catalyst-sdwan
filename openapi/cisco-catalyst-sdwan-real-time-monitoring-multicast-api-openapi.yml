paths:
  /device/multicast/replicator:
    get:
      tags:
      - Real-Time Monitoring - Multicast
      description: Get replicator list from device
      operationId: createReplicatorList
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Replicator list:
                  description: Replicator list
                  value:
                    data:
                    - vdevice-dataKey: 169.254.10.9
                      vdevice-name: 169.254.10.9
                      replicator-status: UP
                      replicator-address: 172.16.254.1
                      lastupdated: 1655109179818
                      vpn-id: '10'
                      vdevice-host-name: vm2
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Routing-read,Routing-write
