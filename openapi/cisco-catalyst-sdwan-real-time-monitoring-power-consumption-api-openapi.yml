paths:
  /device/powerconsumption:
    get:
      tags:
      - Real-Time Monitoring - Power Consumption
      description: Get Power Consumption Information
      operationId: getPowerConsumption
      parameters:
      - name: deviceId
        in: query
        required: true
        schema:
          type: object
          properties:
            deviceIp:
              type: string
          description: This is the valid DeviceIP
          $$ref: '#/components/schemas/DeviceIP'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        component-cname:
                          type: string
                          example: Slot0
                        lastupdated:
                          type: integer
                          format: int64
                          example: 1717400936511
                        platform-property-configurable:
                          type: string
                          example: 'false'
                        platform-property-name:
                          type: string
                          example: cpld-versio
                        value-string:
                          type: string
                          example: '20061845'
                        vdevice-dataKey:
                          type: string
                          example: 172.16.255.15-Slot0-cpld-version
                        vdevice-host-name:
                          type: string
                          example: pm5
                        vdevice-name:
                          type: string
                          example: 172.16.255.15
                      $$ref: '#/components/schemas/RealTimeData'
                $$ref: '#/components/schemas/PowerConsumptionRealTime'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: System-read,System-write
