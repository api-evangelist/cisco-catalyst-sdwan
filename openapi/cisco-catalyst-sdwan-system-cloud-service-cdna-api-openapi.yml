      tags:
      - System - Cloud Service CDNA
      description: Get CDNA Server Details
      operationId: getCdnaServer
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  authToken:
                    type: string
                  cdnaServerIP:
                    type: string
                  cline_id:
                    type: string
                  enrolled:
                    type: boolean
                  lastUpdated:
                    type: string
                  member_id:
                    type: string
