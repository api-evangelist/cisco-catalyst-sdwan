tags:
- name: Multicloud Interconnect - Services
paths:
  /multicloud/interconnect/services:
    get:
      tags:
      - Multicloud Interconnect - Services
      summary: Get Interconnect Services Information.
      description: API to retrieve the Interconnect Services Information from vManage.
      operationId: getInterconnectServices
      parameters:
      - name: interconnect-service-vendor-name
        in: query
        required: true
        schema:
          type: string
      - name: interconnect-type
        in: query
        description: Interconnect provider type
        required: true
        schema:
          type: string
      - name: interconnect-service-type
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: All Interconnect Services
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    flavor:
                      type: string
                      description: Virtual Instance flavor of the service instance
                      example: VM100
                    interfaceCount:
                      type: string
                      description: Number of interfaces for the service
                      example: '10'
                    mgmtIP:
                      type: string
                      description: IP of the management interface of the service
                      example: 100.1.1.1
                    name:
                      type: string
                      description: Name of the service
                      example: My-Firewall
                    serviceRegion:
                      type: string
                      description: Region where the service is deployed
                      example: NY
                    serviceRole:
                      type: string
                      description: HA role of the service
                      example: Primary
                    status:
                      type: string
                      description: Status of the service
                      example: PROMISIONED
                    swVersion:
                      type: string
                      description: Software version running on the service
                      example: 10.1.3
                    uuid:
                      type: string
                      description: provider assigned service Uuid
                  $$ref: '#/components/schemas/InterconnectService'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
