paths:
  /device/eigrp/interface:
    get:
      tags:
      - Real-Time Monitoring - EIGRP
      description: Get EIGRP interface list from device (Real Time)
      operationId: createEIGRPInterface
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                EIGRP interface list:
                  description: EIGRP interface list
                  value:
                    data:
                    - vdevice-name: 169.254.10.13
                      vdevice-host-name: vm6
                      name: GigabitEthernet0
                      passive: GigabitEthernet0/0
                      hello-interval: '5'
                      hold-timer: '15'
                      auth-mode: md5
                      lastupdated: 1654586532070
                      vdevice-dataKey: 169.254.10.13-eigrp-af-ipv4-0.0.0.0
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Routing-read,Routing-write
