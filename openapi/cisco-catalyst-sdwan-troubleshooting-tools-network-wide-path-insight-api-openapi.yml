paths:
  /stream/device/nwpi/exportTrace:
    get:
      tags:
      - Troubleshooting Tools - Network Wide Path Insight
      description: Export NWPI Trace Data
      operationId: exportTrace
      parameters:
      - name: traceId
        in: query
        description: trace id
        required: true
        schema:
          maximum: 262144
          minimum: 1
          type: integer
          format: int32
      - name: timestamp
        in: query
        description: start time
        required: true
        schema:
          maximum: 10000000000000
          minimum: 1
          type: integer
          format: int64
      - name: traceModel
        in: query
        description: traceModel
        schema:
          pattern: ^(SDWAN_MANUAL|SDWAN_AUTO_ON|SD_ROUTING_MANUAL)$
          type: string
        examples:
          Get manual traces:
            description: Get manual traces
            value: SDWAN_MANUAL
          Get auto on traces:
            description: Get auto on traces
            value: SDWAN_AUTO_ON
          Get sd-routing traces:
            description: Get sd-routing traces
            value: SD_ROUTING_MANUAL
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: object
              examples:
                Nwpi Trace Data File:
                  description: Nwpi Trace Data File
                  value: '{binary format response}'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Device Monitoring-read,Device Monitoring-write
  /stream/device/nwpi/importTrace:
    post:
      tags:
      - Troubleshooting Tools - Network Wide Path Insight
      description: Import Trace
      operationId: importTrace
      parameters:
      - name: newTraceName
        in: query
        schema:
          type: string
      - name: mode
        in: query
        description: mode
        schema:
          pattern: ^(SD-WAN|SD Routing)$
          type: string
        examples:
          default:
            description: default
          sdwan platform:
            description: sdwan platform
            value: SD-WAN
          sd-routing platform:
            description: sd-routing platform
            value: SD Routing
      requestBody:
        description: Trace Data File
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              $$ref: '#/components/schemas/ImportTraceRequest'
        required: true
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                  state:
                    type: boolean
                $$ref: '#/components/schemas/ImportTraceResponse'
              examples:
                Success Response:
                  description: Success Response
                  value:
                    state: true
                    msg: Trace imported successfully.
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
