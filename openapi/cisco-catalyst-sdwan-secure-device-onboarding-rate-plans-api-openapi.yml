        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                required:
                - lastPage
                - pageNumber
                - ratePlans
                type: object
                properties:
                  lastPage:
                    type: boolean
                    description: Indicator whether the payload is the last payload.
                    example: true
                  pageNumber:
                    type: integer
                    description: Page Number.
                    format: int32
                    example: 1
                  ratePlans:
                    type: array
                    description: List of rate plans.
                    example: Refer to RatePlan
                    items:
                      required:
