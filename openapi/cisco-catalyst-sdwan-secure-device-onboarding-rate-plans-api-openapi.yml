                          properties:
                            usageLimit:
                              type: integer
                              format: int64
                            usageLimitUnit:
                              type: string
                            useDefaultRating:
                              type: boolean
                              writeOnly: true
                          description: Data usage limit info .
                          example: '"dataUsage":{"useDefaultRating": "false", "usageLimit": "50MB","usageLimitUnit": "MB"}'
                          $$ref: '#/components/schemas/DataUsage'
                        name:
