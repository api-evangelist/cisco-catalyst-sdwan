paths:
  /device/wireless/client:
    get:
      tags:
      - Real-Time Monitoring - Wireless
      description: Get wireless clients from device
      operationId: getWirelessClients
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Wireless client:
                  description: Wireless client
                  value:
                    data:
                    - vdevice-name: 172.16.255.15
                      vdevice-host-name: vm5
                      wlan-id: '1'
                      mac-address: 24:77:03:89:9b:f8
                      ssid: rf4k3ap
                      band: band-24ghz
                      status: '0'
                      ip-address: 192.168.1.1
                      device-type: Android
                      vdevice-dataKey: 172.16.255.15
                      rssi: -51
                      lastupdated: 1660894960587
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Policy-read,Policy-write,System-read,System-write
