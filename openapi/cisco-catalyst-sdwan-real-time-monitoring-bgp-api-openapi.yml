  /device/bgp/neighbors:
    get:
      tags:
      - Real-Time Monitoring - BGP
      description: Get BGP neighbors list (Real Time)
      operationId: createBGPNeighborsList
      parameters:
      - name: vpn-id
        in: query
        description: VPN Id
        schema:
          type: string
          enum:
          - '0'
          - '512'
      - name: peer-addr
        in: query
        description: Peer address
        schema:
          type: string
      - name: as
        in: query
        description: AS number
        schema:
          type: string
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                BGP neighbors list:
                  description: BGP neighbors list
                  value:
                    data:
                    - vdevice-name: 169.254.10.10
                      afi: ipv4-unicast
                      vpn-id: 10
                      vdevice-host-name: vm3
                      peer-addr: 20.20.20.20
                      as: 200
                      vdevice-dataKey: 169.254.10.10-10-20.20.20.20
                      msg-rcvd: 0
