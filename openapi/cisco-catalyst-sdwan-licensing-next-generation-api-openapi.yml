        '500':
          description: Internal Server Error
  /v1/licensing/devices:
    get:
      tags:
      - Licensing - Next Generation
      description: Retrieve list of all devices along with license details if assigned
      operationId: getMSLADevices_LicensingNextGeneration_2103
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        complianceStatus:
                          type: string
                          example: Out Of Compliance
                        configuredSystemIP:
                          type: string
                          example: 172.16.254.3
                        deviceModel:
                          type: string
                          example: vedge-C8530-12X4QC
                        deviceTags:
                          type: array
                          items:
                            type: string
                        hostName:
                          type: string
                          example: pm4
                        hsecCompatible:
                          type: string
                          example: 'Yes'
                        hsecLicenseStatus:
                          type: string
                        hsecStatus:
                          type: string
                          example: '-'
                        inCompliantReason:
                          type: string
                          example: Unassigned
                        licenses:
                          type: array
                          items:
                            type: object
                            properties:
                              billingType:
                                type: string
                                example: prepaid
                              displayName:
                                type: string
                                example: Essential Large
                              endDate:
                                type: string
                                example: 2025 Jun 03
                              licenseCategory:
                                type: string
                                example: Base
                              licenseType:
                                type: string
                                example: TERM
                              no0fAssignedLicenses:
                                type: integer
                                format: int32
                                example: 1
                              saName:
                                type: string
                                example: testaccount1.viptela.com
                              startDate:
                                type: string
                                example: 2023 Jun 03
                              subscriptionId:
                                type: string
                                example: sub00235
                              tag:
                                type: string
                                example: regid.2020-10.com.cisco.DSTACK_T0_P
                              vaName:
                                type: string
                                example: vManage_SDWAN_01
                            $$ref: '#/components/schemas/DevicesDetailsLicenses'
                        noOfTenantsOnBoarded:
                          type: integer
                          format: int32
                          example: 5
                        uuid:
                          type: string
                          example: C8530-2f351fae-e60a-4a5d-b5b9-aeb1306289ff
                      $$ref: '#/components/schemas/DevicesDetailsDevices'
                $$ref: '#/components/schemas/DevicesDetails'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /v1/licensing/edit-licenses/{uuid}:
    get:
      tags:
      - Licensing - Next Generation
      description: Edit licenses associated to a device
      operationId: getLicenseByUuid_LicensingNextGeneration_3403
      parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  appliedFilters:
                    type: object
                    properties:
                      billingType:
                        type: string
                        example: Prepaid
                      licenseClassification:
                        type: string
                        example: Advantage
                    $$ref: '#/components/schemas/AppliedFilters'
                  baseLicenses:
                    type: object
                    properties:
                      licenses:
                        type: array
                        items:
                          type: object
                          properties:
                            available:
                              type: integer
                              format: int32
                              example: 20
                            displayName:
                              type: string
                              example: Advantage Large
                            inUse:
                              type: integer
                              format: int32
                              example: 5
                            isAssigned:
                              type: boolean
                              example: true
                            tag:
                              type: string
                              example: regid.2020-10.com.cisco.DSTACK_T0_P
                          $$ref: '#/components/schemas/EditLicenseResponseLicenses'
                      platformClass:
                        type: string
                        example: C8530
                    $$ref: '#/components/schemas/EditLicenseResponseBaseLicenses'
                  tenantLicenses:
                    type: object
                    properties:
                      licenses:
                        type: array
                        items:
                          type: object
                          properties:
                            available:
                              type: integer
                              format: int32
                              example: 20
                            displayName:
                              type: string
                              example: Advantage Large
                            inUse:
                              type: integer
                              format: int32
                              example: 5
                            isAssigned:
                              type: boolean
                              example: true
                            tag:
                              type: string
                              example: regid.2020-10.com.cisco.DSTACK_T0_P
                          $$ref: '#/components/schemas/EditLicenseResponseLicenses'
                      totalTenantLicRequired:
                        type: integer
                        format: int32
                        example: 10
                    $$ref: '#/components/schemas/EditLicenseResponseTenantLicenses'
                $$ref: '#/components/schemas/EditLicenseResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
