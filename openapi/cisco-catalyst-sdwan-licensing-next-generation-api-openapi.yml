          application/json:
            schema:
              type: object
              properties:
                baseLicenses:
                  type: array
                  items:
                    type: object
                    properties:
                      assignLicenses:
                        type: array
                        items:
                          type: object
                          properties:
                            allocated:
                              type: integer
                              format: int32
                              example: 2
                            billingType:
                              type: string
                              example: Prepaid
                            displayName:
                              type: string
                              example: Advantage Large
                            saName:
                              type: string
                              example: testaccount1.viptela.com
                            subscriptionId:
                              type: string
                              example: sub00235
                            tag:
                              type: string
                              example: regid.2020-10.com.cisco.DSTACK_T0_P
                            vaName:
                              type: string
                              example: vManage_SDWAN_01
                          $$ref: '#/components/schemas/AssignLicensesRequestAssignLicenses'
                      uuids:
                        type: array
                        description: List of device UUIDs
                        items:
                          type: string
                          description: List of device UUIDs
                    $$ref: '#/components/schemas/AssignLicensesRequestBaseLicenses'
                tenantLicenses:
                  type: array
                  items:
                    type: object
                    properties:
