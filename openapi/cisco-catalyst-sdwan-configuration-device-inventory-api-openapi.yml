paths:
  /system/device:
    post:
      tags:
      - Configuration - Device Inventory
      description: 'Create new device<br><br><br>Note: In a multitenant vManage system, this API is only available in the Provider view 123.'
      operationId: createDevice
      requestBody:
        description: Create device request
        content:
          application/json:
            schema:
              type: object
            examples:
              Create device request:
                description: Create device request
                value:
                  deviceIP: 1.1.1.1
                  username: cisco
                  password: cisco
                  personality: vbond
                  generateCSR: true
                  genCsrParams:
                    schedule: true
                    scheduleAt: 1729495932
                    autoRenew: false
                    keyLength: '2048'
                    resetRSA: true
                $$ref: '#/components/examples/ComViptelaVmanageServerDeviceconfigSystemDeviceSystemdeviceapiRequestExampleSystemdevicegencsrparams'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Example Value:
                  description: Example Value
                  value:
                    uuid: 2250234c-5305-41f7-a0fe-b52fcbd92833
                  $$ref: '#/components/examples/ComViptelaVmanageServerDeviceconfigSystemDeviceSystemdeviceapiResponseExampleDeviceaddresponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /system/device/bootstrap/device/{uuid}:
    get:
      tags:
      - Configuration - Device Inventory
      description: Create vEdge device config
      operationId: generateBootstrapConfigForVedge
      parameters:
      - name: uuid
        in: path
        description: Device UUID
        required: true
        schema:
          type: string
        example: ESR-6300-LIC-K9-FAUSTEST126
      - name: configtype
        in: query
        description: configtype
        required: true
        schema:
          type: string
        example: cloudinit
      - name: inclDefRootCert
        in: query
        required: true
        schema:
          type: boolean
          default: true
      - name: version
        in: query
        schema:
          type: string
          default: v1
      - name: wanif
        in: query
        description: wanif
        schema:
          type: string
        example: GigabitEthernet1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  bootstrapConfig:
                    type: string
                    example: '#cloud-config\nvinitparam:\n - uuid : ESR-6300-LIC-K9-FAUSTEST126\n - vbond : 10.0.12.26\n - org : vIPtela Inc Regression\n'
                $$ref: '#/components/schemas/GenerateBootstrapConfigForVedge'
              examples:
                Device bootstrap configuration:
                  description: Device bootstrap configuration
                  value:
                    bootstrapConfig: '#cloud-config\ninitparam:\n - uuid : ESR-6300-LIC-K9-FAUSTEST126\n - vbond : 10.0.12.26\n - org : vIPtela Inc Regression\n'
                  $$ref: '#/components/examples/ComViptelaVmanageServerBootstrapDevicelifecycleapiResponseExampleGetbootstrapdevice'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
