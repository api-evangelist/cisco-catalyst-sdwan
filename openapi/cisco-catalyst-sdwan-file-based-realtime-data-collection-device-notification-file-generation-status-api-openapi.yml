paths:
  /device/file-based/data-collection/file-generation-status:
    post:
      tags:
      - File based RealTime Data Collection - Device notification - File generation status
      description: Device notify when file is ready and vManage has to download them
      operationId: handleFileGenerationStatusResponseFromDevice
      requestBody:
        description: File generation status notification payload
        content:
          application/json:
            schema:
              required:
              - detailedMessage
              - status
              - transactionId
              type: object
              properties:
                checksum:
                  type: string
                  description: MD5 checksum value of the file
                detailedMessage:
                  type: string
                  description: Success or Failure reason in detail
                fileName:
                  type: string
                  description: Full path of the generated file
                status:
                  type: string
                transactionId:
                  type: string
                  description: Transaction Id sent in the file generation RPC
              $$ref: '#/components/schemas/HandleFileGenerationStatusNotificationRequest'
            examples:
              Successful file generation status payload:
                description: Successful file generation status payload
                value:
                  transactionId: 94e2a016-6b21-83d2-b6163c55ccd3%3cd2a8f8-8fce-63a6894ea555
                  status: success
                  fileName: /tmp/json/audit/audit_advertised_2022-09-19_13:54:34.csv
                  checksum: '3534534563454532788799807'
                  detailedMessage: Successfully generated file
                $$ref: '#/components/examples/ComViptelaVmanageServerFilebasedRealtimeDatacollectionDatacollectionapiRequestExampleFilegenerationsuccessreq'
              Failed file generation status payload:
                description: Failed file generation status payload
                value:
                  transactionId: 94e2a016-6b21-83d2-b6163c55ccd3%3cd2a8f8-8fce-63a6894ea555
                  status: failed
                  detailedMessage: File generation failed due to no space left
                $$ref: '#/components/examples/ComViptelaVmanageServerFilebasedRealtimeDatacollectionDatacollectionapiRequestExampleFilegenerationfailurereq'
        required: true
      responses:
        '200':
          description: File generation status accepted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorMessage:
