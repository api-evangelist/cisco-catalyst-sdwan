  /v1/feature-profile/mobility/global/basic/schema:
    get:
      tags:
      - Configuration - Feature Profile (Mobility)
      description: Get a Mobility Global Basic Parcel Schema by Schema Type
      operationId: GetMobilityGlobalBasicParcelSchemaBySchemaType
      parameters:
      - name: schemaType
        in: query
        required: true
        schema:
          type: string
          enum:
          - post
          - put
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
              examples:
                post:
                  value:
                    type: object
                    properties:
                      name:
                        type: string
                        pattern: ^[^&<>! "]+$
                        minLength: 1
                        maxLength: 128
                      description:
                        description: Set the parcel description
                        type: string
                      data:
                        type: object
                        properties:
                          user:
                            description: Create local login account
                            type: array
                            uniqueItems: true
                            minItems: 1
                            maxItems: 1
                            items:
                              type: object
                              properties:
                                name:
                                  properties:
                                    optionType:
                                      type: string
                                      enum:
                                      - global
                                    value:
                                      type: string
                                      enum:
                                      - admin
                                  required:
                                  - optionType
                                  - value
                                  additionalProperties: false
                                password:
                                  properties:
                                    optionType:
                                      type: string
                                      enum:
                                      - global
                                    value:
                                      type: string
                                      description: Password should contain atleast 1 uppercase letter, 1 lowercase letter, 1 special character, 1 number and have minimum length of 8 characters and maximum length of 32 characters
                                      minLength: 8
                                      maxLength: 32
                                      allOf:
                                      - pattern: .*\d{1,}.*
                                      - pattern: .*[A-Z]{1,}.*
                                      - pattern: .*[a-z]{1,}.*
                                      - pattern: .*[!@#$%^&*-+=;:",<.>?~`]{1,}.*
                                  required:
                                  - optionType
                                  - value
                                  additionalProperties: false
                              required:
                              - name
                              - password
                              additionalProperties: false
                        required:
                        - user
                        additionalProperties: false
                    required:
                    - name
                    - data
                    x-metadata:
                      minVManageVersion: 20.15.1
                    additionalProperties: false
