                  enum:
                  - now
                  - later
                protocolPackType:
                  type: string
                  enum:
                  - selected-protocol-pack
                  - default-protocol-pack
                  - built-in-protocol-pack
                protocolPacks:
                  type: array
                  items:
                    type: string
                scheduleTime:
                  type: integer
                  format: int64
              $$ref: '#/components/schemas/ProtocolPackUpgradeRequest'
            examples:
              Selected Devices, selective protocol pack, scheduled now:
                description: Selected Devices, selective protocol pack, scheduled now
                value:
                  deviceSelectionType: selected-devices
                  scheduleTime: 0
                  devices:
                  - 172.16.255.11
                  executionType: now
                  protocolPacks:
                  - pp-adv-cat8k-1712.1a-49-68.0.0.pack
                  protocolPackType: selected-protocol-pack
              Selected Devices, default protocol pack, scheduled now:
                description: Selected Devices, default protocol pack, scheduled now
                value:
                  deviceSelectionType: selected-devices
                  scheduleTime: 0
                  devices:
                  - 172.16.255.11
                  executionType: now
                  protocolPacks: []
                  protocolPackType: default-protocol-pack
              Selected Devices, built-in protocol pack, scheduled now:
                description: Selected Devices, built-in protocol pack, scheduled now
                value:
                  deviceSelectionType: selected-devices
                  scheduleTime: 0
                  devices:
                  - 172.16.255.11
                  executionType: now
                  protocolPacks: []
                  protocolPackType: built-in-protocol-pack
              All Devices, selective protocol pack, scheduled now:
                description: All Devices, selective protocol pack, scheduled now
                value:
                  deviceSelectionType: entire-network
                  scheduleTime: 0
                  devices: []
                  executionType: now
                  protocolPacks:
                  - pp-adv-cat8k-1712.1a-49-68.0.0.pack
                  protocolPackType: selected-protocol-pack
              All Devices, default protocol pack, scheduled now:
                description: All Devices, default protocol pack, scheduled now
                value:
                  deviceSelectionType: entire-network
                  scheduleTime: 0
                  devices: []
                  executionType: now
                  protocolPacks: []
                  protocolPackType: default-protocol-pack
              All Devices, selective protocol pack, scheduled now, with Auto Upgrade Flag Enabled:
                description: All Devices, selective protocol pack, scheduled now, with Auto Upgrade Flag Enabled
                value:
                  deviceSelectionType: entire-network
                  scheduleTime: 0
                  devices: []
                  executionType: now
                  autoUpgradeInCompatibleDevices: true
                  protocolPacks:
                  - pp-adv-cat8k-1712.1a-49-68.0.0.pack
                  protocolPackType: selected-protocol-pack
              All Devices, selective protocol pack, scheduled now, with Auto Upgrade Flag Disabled:
                description: All Devices, selective protocol pack, scheduled now, with Auto Upgrade Flag Disabled
                value:
                  deviceSelectionType: entire-network
                  scheduleTime: 0
                  devices: []
                  executionType: now
                  autoUpgradeInCompatibleDevices: false
                  protocolPacks:
                  - pp-adv-cat8k-1712.1a-49-68.0.0.pack
                  protocolPackType: selected-protocol-pack
              All Devices, built-in protocol pack, scheduled now:
                description: All Devices, built-in protocol pack, scheduled now
                value:
                  deviceSelectionType: entire-network
                  scheduleTime: 0
                  devices: []
                  executionType: now
                  protocolPacks: []
                  protocolPackType: built-in-protocol-pack
              Scheduled Upgrade:
                description: Scheduled Upgrade
                value:
                  deviceSelectionType: entire-network
                  scheduleTime: 1706803770000
                  devices: []
                  executionType: later
                  protocolPacks: []
                  protocolPackType: default-protocol-pack
