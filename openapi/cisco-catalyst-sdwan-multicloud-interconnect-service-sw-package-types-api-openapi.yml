paths:
  /multicloud/interconnect/service-sw-package:
    get:
      tags:
      - Multicloud Interconnect - Service Sw package types
      summary: Get Interconnect Services software package Types Information.
      description: API to retrieve the Interconnect Services Sw Package Types Information from vManage.
      operationId: getInterconnectServiceSwPkg
      parameters:
      - name: interconnect-provider-name
        in: query
        required: true
        schema:
          type: string
      - name: interconnect-account-id
        in: query
        description: Interconnect account id
        required: true
        schema:
          type: string
      - name: interconnect-service-type
        in: query
        required: true
        schema:
          type: string
      - name: interconnect-service-vendor-name
        in: query
        required: true
        schema:
          type: string
      - name: region
        in: query
        schema:
          type: string
      responses:
        '200':
          description: All Interconnect Services types and locations
          content:
            application/json:
              schema:
                type: object
                properties:
                  swPackages:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the service package
                          example: PA-100
                        packageCode:
                          type: string
                          description: provider assigned service package code
                          example: PA100
                        serviceSwVersion:
                          type: array
                          items:
                            type: object
                            properties:
                              imageName:
                                type: string
                                description: Service Software Version Image Name
                                example: PaloAlto-VM-Series-10.1.3-9554
                              version:
                                type: string
                                description: Service Software Version
                                example: 10.1.3
                            $$ref: '#/components/schemas/InterconnectServiceSwVersion'
                      $$ref: '#/components/schemas/InterconnectServiceTypes'
                $$ref: '#/components/schemas/InlineResponse20015'
              examples:
                Service Software packages:
                  description: Service Software packages
                  value:
                    swPackages:
                    - name: PA-100
                      packageCode: PA100
                      serviceSwVersion:
                      - version: 10.1.3
                        imageName: PaloAlto-VM-Series-10.1.3-9554
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
