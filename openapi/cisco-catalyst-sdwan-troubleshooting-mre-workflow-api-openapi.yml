  /troubleshooting/mre/workflow/{workflowType}:
    post:
      tags:
      - Troubleshooting MRE - Workflow
      description: Launch MRE workflow
      operationId: getMreExecutionId
      parameters:
      - name: workflowType
        in: path
        description: Mre workflow type
        required: true
        schema:
          type: string
          enum:
          - tunnelTroubleshoot
      - name: isMre
        in: query
        schema:
          type: boolean
          default: true
      requestBody:
        content:
