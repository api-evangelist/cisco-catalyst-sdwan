              schema:
                type: object
                properties:
                  response:
                    type: object
                    properties:
                      url:
                        type: string
                        example: /api/v1/task/018f3570-9e70-7cf1-aaea-e448f9b6ec66
                      workflowExecutionId:
                        type: string
                        example: 018f3570-9e70-7cf1-aaea-e448f9b6ec66
