                        example: localDevice
                      value:
                        type: string
                        example: 111.111.111.111
                    $$ref: '#/components/schemas/LaunchRequestParameter'
              $$ref: '#/components/schemas/LaunchRequestBody'
        required: true
      responses:
        '200':
