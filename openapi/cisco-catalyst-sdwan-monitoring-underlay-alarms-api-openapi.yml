paths:
  /device/underlay/alarms/{type}:
    get:
      tags:
      - Monitoring - Underlay Alarms
      description: Get Underlay Alarms Overview
      operationId: getUnderlayAlarmsOverview
      parameters:
      - name: type
        in: path
        description: Underlay Alarms filter
        required: true
        schema:
          pattern: alarm|device
          type: string
          enum:
          - alarm
          - device
      - name: last_n_hours
        in: query
        schema:
          maximum: 24
          minimum: 1
          type: integer
          format: int32
          default: 12
      - name: limit
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 30
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        properties:
                          alarms:
                            type: array
                            items:
                              type: object
                              properties:
                                count:
                                  type: integer
                                  format: int64
                                  example: 10
                                ruleName:
                                  type: string
                                  example: interface-state-change
                                ruleNameDisplay:
                                  type: string
                                  example: Interface_State_Change
                                severity:
                                  type: string
                                  example: Critical
                              $$ref: '#/components/schemas/DeviceAlarmData'
                          count:
                            type: integer
                            format: int64
                            example: 50
                          hostName:
                            type: string
                            example: vm4
                          siteId:
                            type: string
                            example: '400'
                          siteName:
                            type: string
                            example: SITE_400
                          systemIp:
                            type: string
                            example: 172.16.255.14
                        $$ref: '#/components/schemas/FilterByDeviceData'
                  $$ref: '#/components/schemas/UnderlayAlarmFilterByDevice'
                - type: object
