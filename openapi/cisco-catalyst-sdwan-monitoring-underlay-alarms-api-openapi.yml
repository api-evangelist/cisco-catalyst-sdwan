                      type: array
                      items:
                        type: object
                        properties:
                          count:
                            type: integer
                            format: int64
                            example: 20
                          devices:
                            type: array
                            description: devices values
                            example:
                            - 172.16.255.15
                            - 172.16.255.16
                            items:
                              type: string
                              description: device
                              example: 172.16.255.15
                          prevDevices:
                            type: array
                            description: previce devices values
                            example:
                            - 172.16.255.15
                            - 172.16.255.16
                            items:
                              type: string
                              description: prev device
                              example: 172.16.255.15
                          ruleName:
                            type: string
                            example: interface-state-change
                          ruleNameDisplay:
