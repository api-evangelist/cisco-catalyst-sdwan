                                  items:
                                    type: object
                                    properties:
                                      advertisedPrefixList:
                                        type: array
                                        description: Advertized prefix list
                                        example:
                                        - 10.10.0.0/24
                                        - 10.20.0.0/24
                                        items:
                                          type: string
                                          description: prefix
                                          example: 10.10.0.0/24
                                      associatedGateway:
                                        type: object
                                        properties:
                                          cloudAccountId:
                                            type: string
                                          cloudGatewayName:
                                            type: string
                                          cloudType:
                                            type: string
                                            enum:
                                            - AWS
                                            - AWS_GOVCLOUD
                                            - AZURE
                                            - AZURE_GOVCLOUD
                                            - GCP
