            application/json:
              schema:
                type: object
                properties:
                  connectivityGateway:
                    type: array
                    items:
                      required:
                      - awsConnectivityGateway
                      - azureConnectivityGateway
                      - cloudAccountId
                      - cloudType
                      - gatewayName
                      - gcpConnectivityGateway
                      - region
