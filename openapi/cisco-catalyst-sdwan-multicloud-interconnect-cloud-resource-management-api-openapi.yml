  /multicloud/interconnect/cloud/{cloud-type}/accounts/{cloud-account-id}/gcr-and-attachments:
    get:
      tags:
      - Multicloud Interconnect - Cloud Resource Management
      summary: Get Google Cloud Router and Attachments.
      description: API to get Google Cloud Router and Attachments.
      operationId: getGoogleCloudRouterAndAttachments
      parameters:
      - name: cloud-type
        in: path
        description: Cloud Provider Type
        required: true
        schema:
          type: string
          enum:
          - AWS
          - AZURE
          - GCP
      - name: cloud-account-id
        in: path
        required: true
        schema:
          type: string
      - name: connectivity-gateway-name
        in: query
        schema:
          type: string
      - name: cloud-gateway-name
        in: query
        schema:
          type: string
      - name: region
        in: query
        schema:
          type: string
      - name: network
        in: query
        schema:
          type: string
      - name: resource-state
        in: query
        schema:
          type: string
      - name: refresh
        in: query
        schema:
          pattern: (true|false)
          type: string
          default: 'false'
      responses:
        '200':
          description: Google Cloud Router and Attachments Response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gcpCloudRouters:
                    type: array
                    items:
                      required:
                      - name
                      - network
                      type: object
                      properties:
                        attachmentDetails:
                          type: array
                          description: List of GCR Attachments
                          items:
                            type: object
                            properties:
                              cloudRouterIpAddress:
                                type: string
                              customerIpAddress:
                                type: string
                              id:
                                type: string
                              mtu:
                                type: string
                                description: MTU of the Interconnect attachment
                                example: '1500'
                              name:
                                pattern: (?:[a-z](?:[-a-z0-9]{0,61}[a-z0-9])?)
                                type: string
                              pairingKey:
                                type: string
                                example: 96fbc59c-8926-40ec-b6cd-4cb3501e4c47/us-west1/1
                              region:
                                type: string
                              secondaryZone:
                                type: string
                                description: Option to create Interconnect attachment in secondary zone
                                example: 'true'
                              state:
                                type: string
                            description: Google cloud Interconnect Attachment Object.
                            $$ref: '#/components/schemas/GcpInterconnectAttachment'
                        cloudRouterAsn:
                          pattern: \d+
                          type: string
                        id:
                          type: string
                        name:
                          pattern: (?:[a-z](?:[-a-z0-9]{0,61}[a-z0-9])?)
                          type: string
                        network:
                          type: string
                        region:
                          type: string
                      description: Google cloud GCR Object.
                      $$ref: '#/components/schemas/GcpCloudRouter'
                $$ref: '#/components/schemas/InlineResponse20010'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /multicloud/interconnect/cloud/{cloud-type}/accounts/{cloud-account-id}/transit-gateways:
    get:
      tags:
      - Multicloud Interconnect - Cloud Resource Management
      summary: Get AWS Transit Gateways.
      description: API to retrieve AWS Transit Gateways.
      operationId: getAwsTransitGateways
      parameters:
      - name: cloud-type
        in: path
        description: Cloud Provider Type
        required: true
        schema:
          type: string
          enum:
          - AWS
      - name: cloud-account-id
        in: path
        required: true
        schema:
          maxLength: 255
          minLength: 1
          type: string
      - name: transit-gateway-name
        in: query
        schema:
          type: string
      - name: region
        in: query
        schema:
          type: string
      - name: tag-name
        in: query
        schema:
          type: string
      - name: refresh
        in: query
        schema:
          pattern: (true|false)
          type: string
          default: 'false'
      responses:
        '200':
          description: Accepted
