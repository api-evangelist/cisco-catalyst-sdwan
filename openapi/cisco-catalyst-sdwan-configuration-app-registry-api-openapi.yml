  /app-registry/app/bulk/endpoint:
    put:
      tags:
      - Configuration - App Registry
      description: Edit App Details for multiple App uuids
      operationId: editAppInBulkByUuid
      requestBody:
        content:
          '*/*':
            schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  valueType:
                    type: string
                    enum:
                    - ARRAY
                    - OBJECT
                    - STRING
                    - NUMBER
                    - 'TRUE'
                    - 'FALSE'
                    - 'NULL'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                required:
                - _rid
                - business_relevance
                - common_family
                - common_family_display
                - common_name
                - common_name_display
                - nbar_family
                - nbar_name
                - qosmos_family
                - qosmos_name
                - traffic_class
                - uuid
                type: object
                properties:
                  _rid:
                    type: string
                    example: 0:PolicyAppListsNode:1675729045113:1700
                  business_relevance:
                    type: string
                    example: business-irrelevant
                  common_family:
                    type: string
                    example: web
                  common_family_display:
                    type: string
                    example: Web
                  common_name:
                    type: string
                    example: zulily
                  common_name_display:
                    type: string
                    example: Zulily
                  nbar_family:
                    type: string
                    example: web
                  nbar_name:
                    type: string
                    example: zulily
                  qosmos_family:
                    type: string
                    example: web
                  qosmos_name:
                    type: string
                    example: zulily
                  traffic_class:
                    type: string
                    example: transactional-data
                  uuid:
                    type: string
                    format: uuid
                    example: 345fa8c9-6115-434b-b1f7-2c1d97f09f91
                $$ref: '#/components/schemas/PayloadItems'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
