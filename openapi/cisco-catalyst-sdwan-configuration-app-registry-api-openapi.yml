      description: Get all available filters for applist
      operationId: getAttributeMappingForApps
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                Status:
                  description: Status
                  value:
                    data:
                    - applicationSource:
                      - hardcoded
                      applicationFamily:
                      - instant-messaging
                      - game
                      businessRelevance:
