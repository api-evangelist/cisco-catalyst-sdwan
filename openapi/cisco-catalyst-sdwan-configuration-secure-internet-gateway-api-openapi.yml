paths:
  /sig/datacenters/{type}/{tunneltype}:
    get:
      tags:
      - Configuration - Secure Internet Gateway
      description: The API to get all sig data center for given provider type
      operationId: getSigDynamicDataCenterList
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
      - name: tunneltype
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  mapping:
                    type: array
                    items:
                      type: object
                      properties:
                        CITY/COUNTRY:
                          type: string
                        FQDN:
                          type: string
                        IP:
                          type: string
                      $$ref: '#/components/schemas/MappingEntries'
                  title:
                    type: string
                $$ref: '#/components/schemas/GetDataCenters'
              example: "{\n   \"title\":\"Zscaler Data center locations\",\n      \"mapping\":[\n         {\n            \"city/country\":\"Auckland, New Zealand\",\n            \"IP\":\"147.161.216.40\"\n            \"FQDN\":\"akl2-vpn.zscalerthree.net\"\n         },\n         {\n            \"city/country\":\"Auckland, New Zealand\",\n            \"IP\":\"147.161.216.41\"\n            \"FQDN\":\"akl2-vpn.zscalerthree.net\"\n         },\n         {\n            \"city/country\":\"Auckland, New Zealand\",\n            \"IP\":\"147.161.216.42\"\n            \"FQDN\":\"akl2-vpn.zscalerthree.net\"\n         },\n         {\n            \"city/country\":\"Amsterdam, The Netherlands\",\n            \"IP\":\"165.225.240.38\"\n            \"FQDN\":\"ams2-vpn.zscalerthree.net\"\n         },\n         {\n            \"city/country\":\"Beijing, China\",\n            \"IP\":\"211.144.19.18\"\n            \"FQDN\":\"bjs1-vpn.zscalerthree.net\"\n         },\n      ]"
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /sig/datacenters/{type}/{tunneltype}/{devicetype}:
    get:
      tags:
      - Configuration - Secure Internet Gateway
      description: Get list of data centers for zscaler or umbrella
      operationId: getSigDataCenterList
      parameters:
      - name: type
        in: path
        description: Provider type
        required: true
        schema:
          type: string
      - name: tunneltype
        in: path
        description: Type of the tunnel ipsec/gre
        required: true
        schema:
          type: string
      - name: devicetype
        in: path
        description: Type of the device vedge/cedge
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Policy:
                  description: Policy
                  value: {}
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Template Deploy-read,Template Deploy-write,Policy Configuration-read,Policy Configuration-write,Policy Deploy-read,Policy Deploy-write
