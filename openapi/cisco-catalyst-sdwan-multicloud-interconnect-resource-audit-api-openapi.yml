paths:
  /multicloud/interconnect/audit:
    get:
      tags:
      - Multicloud Interconnect - Resource Audit
      summary: Get audit report for resources.
      description: API to generate audit report for resources.
      operationId: getAuditReport
      parameters:
      - name: interconnect-type
        in: query
        description: Interconnect provider type
        required: true
        schema:
          type: string
      - name: connection-type
        in: query
        description: Interconnect connectivity type
        schema:
          type: string
      - name: cloud-type
        in: query
        description: Cloud provider type
        schema:
          type: string
      - name: device-links
        in: query
        description: Interconnect Equinix device link enabled
        schema:
          pattern: (true|false)
          type: string
          default: 'false'
      - name: refresh
        in: query
        description: Interconnect Audit Refresh Option
        schema:
          pattern: (true|false)
          type: string
          default: 'true'
      responses:
        '200':
          description: Audit Report Get Response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  auditReport:
                    type: array
                    items:
                      type: object
                      properties:
                        errString:
                          type: string
                        region:
                          type: string
                          example: My-Region-1
                        reportType:
                          type: string
                          example: Edge Gateway
                        resourceName:
                          type: string
                          example: My-Interconnect-Gateway-1
                        status:
                          type: string
                          example: IN_SYNC
                      $$ref: '#/components/schemas/AuditReportAuditReport'
                  auditStatus:
                    type: string
                    example: IN_SYNC
                $$ref: '#/components/schemas/AuditReport'
              examples:
                Interconnect Audit In-Sync:
                  description: Interconnect Audit In-Sync
                  value:
                    auditStatus: IN_SYNC
                    auditReport:
                    - status: IN_SYNC
                      errString: ''
                      reportType: Edge Gateway
                      resourceName: MY-ICGW-1
                      region: 'Equinix SY1, Sydney, NSW, Australia : Sydney'
                Interconnect Audit Out-Of-Sync:
                  description: Interconnect Audit Out-Of-Sync
                  value:
                    auditStatus: OUT_OF_SYNC
                    auditReport:
                    - status: IN_SYNC
                      errString: ''
                      reportType: Edge Gateway
                      resourceName: MY-ICGW-1
                      region: 'Equinix SY1, Sydney, NSW, Australia : Sydney'
                    - status: OUT_OF_SYNC_DRY_RUN
                      errString: BGP Status down
                      reportType: Edge Connection
                      resourceName: test-az-conn-1
                      region: New York Primary - New York - NY - USA
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
