paths:
  /device/cellularEiolte/connections:
    get:
      tags:
      - Real-Time Monitoring - Cellular EIOLTE Connection Service
      description: Get cellular connection info from device
      operationId: getEiolteConnectionInfo
      parameters:
      - name: deviceId
        in: query
        description: Device Ip address, example:172.16.255.111
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                cellular connection info:
                  description: cellular connection info
                  value:
                  - vdevice-name: 172.16.255.111
                    rx-errors: 0
                    cellular-interface-name: Cellular 1/0
                    tx-errors: 0
                    sec-dns-ipv4-addr: 0.0.0.0
                    pri-dns-ipv4-addr: 8.8.8.8
                    tx-ofl: 0
                    connectivity: Attach and Data
                    ipv4-address: 192.168.3.2
                    rx-ofl: 0
                    rx-pkts: 42067
                    apn: internet
                    ipv6-prefix-length: '0'
                    tx-pkts: 36604
                    ipv4-gateway-addr: 192.168.3.1
                    session-status: Connected
                    pri-dns-ipv6-addr: '::'
                    sec-dns-ipv6-addr: '::'
                    vdevice-host-name: CellularGateway
                    tx-drops: 0
                    rx-drops: 0
                    vdevice-dataKey: 172.16.255.111-1-1-
                    profile-id: 1
                    modem-index: '1'
                    tx-bytes: 10145490
                    lastupdated: 1649249750021
                    ipv6-gw-prefix-length: '0'
                    ipv6-gw-prefix: '::'
                    rx-bytes: 8887213
                    ipv6-prefix: '::'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Policy-read,System-read
  /device/cellularEiolte/radio:
    get:
      tags:
      - Real-Time Monitoring - Cellular EIOLTE Connection Service
      description: Get cellular radio info from device
      operationId: getEiolteRadioInfo
      parameters:
      - name: deviceId
        in: query
        description: Device Ip address, example:172.16.255.111
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                cellular radio info:
                  description: cellular radio info
                  value:
                  - Current-ENDC-RSRQ: -11 dB
