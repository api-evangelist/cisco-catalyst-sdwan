      description: Release licenses assigned to the devices
      operationId: releaseLicenses_Msla_1303
      requestBody:
        description: List of devices for unassigning licenses
        content:
          application/json:
            schema:
              type: object
              properties:
                devices:
                  type: array
                  description: List of device UUIDs
                  items:
                    type: string
