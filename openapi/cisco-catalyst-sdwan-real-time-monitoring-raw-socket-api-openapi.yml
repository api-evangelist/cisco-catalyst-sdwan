  /device/rawsocket/tcp-session:
    get:
      tags:
      - Real Time Monitoring - Raw Socket
      summary: Get TCP session
      description: Get TCP session
      operationId: getTcpSession
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                TCP Session:
                  description: TCP Session
                  value:
                    data:
                    - async-line: 0/2/0
                      destination-ip: 192.168.1.1
                      destination-port: 8080
                      tty: '50'
                      vrf: vrf1
                      idle-timeout: 300
                      mode: active
                      local-ip: 10.0.0.1
                      local-port: 12345
                      socket: socket1
                      start-time: '2023-10-05T14:48:00Z'
                      last-active-time: '2023-10-05T15:00:00Z'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
