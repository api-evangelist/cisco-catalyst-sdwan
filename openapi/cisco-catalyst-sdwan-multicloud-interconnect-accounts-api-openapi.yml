        in: query
        description: Interconnect provider type
        schema:
          type: string
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: array
                items:
                  required:
                  - attCredentials
                  - edgeAccountId
                  - edgeAccountName
                  - edgeType
                  - equinixCredentials
                  type: object
                  properties:
                    attCredentials:
                      required:
                      - clientId
                      - clientSecret
                      type: object
                      properties:
                        clientId:
                          type: string
                          description: Client id of the AT&T Account.
                          example: att-abcd-1234
                        clientSecret:
                          type: string
                          description: Client secret of the AT&T Account.
                          example: XXXX-XXXX-XXXX
                      description: AT&T Credential information.
                      $$ref: '#/components/schemas/InterconnectAccountAttCredentials'
                    billingProviderType:
                      type: string
                    credType:
                      type: string
                    description:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[a-zA-Z0-9_\-\s]+$
                      type: string
                    edgeAccountId:
                      maxLength: 255
                      minLength: 1
                      type: string
                    edgeAccountName:
                      maxLength: 255
                      minLength: 1
                      pattern: ^[a-zA-Z0-9_\-\s]+$
                      type: string
                    edgeType:
                      type: string
