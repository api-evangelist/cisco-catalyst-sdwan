paths:
  /multicloud/interconnect/entitlement/licenses:
    get:
      tags:
      - Multicloud Interconnect - Entitlement
      summary: Get Interconnect Licenses
      description: API to retrieve Interconnect licences
      operationId: getInterconnectLicenses
      parameters:
      - name: interconnect-type
        in: query
        description: Interconnect provider type
        required: true
        schema:
          type: string
      - name: interconnect-account-id
        in: query
        required: true
        schema:
          type: string
      - name: refresh
        in: query
        schema:
          pattern: (true|false)
          type: string
          default: 'false'
      - name: product-type
        in: query
        description: Interconnect License Product Type
        schema:
          type: string
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    currentStatus:
                      type: string
                      example: AVAILABLE
                    edgeAccountName:
                      type: string
                      example: mp-license-acc
                    endDate:
                      type: string
                      example: '2025-01-15'
                    prodType:
                      type: string
                      example: AWSHC
                    sku:
                      type: string
                      example: AWS-HC-IIVXC-C
                    skuDaysForExpiry:
                      type: number
                      example: 924
                    skuId:
                      type: string
                    smartAccountId:
                      type: string
                      example: '100259'
                    startDate:
                      type: string
                      example: '2022-01-19'
                    subscriptionReferenceId:
                      type: string
                      example: Sub1077241
                    technicalServiceUid:
                      type: string
                    virtualAccountId:
                      type: string
                      example: '109733'
                    vxcBandwidth:
                      type: string
                      example: '1000'
                    webOrderId:
                      type: string
                      example: '91358156'
                  $$ref: '#/components/schemas/InterconnectLicense'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
