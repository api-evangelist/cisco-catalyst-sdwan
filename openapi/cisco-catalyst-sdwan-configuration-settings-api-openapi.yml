openapi: 3.2.0
info:
  title: Administration and Settings Configuration - Settings API
  description: "Includes API operations for the following:\n  Global parameters for SD-WAN Manager\n  User, group and tenant management\n  Software maintenance\n  Backup and restore\n  Container management"
  contact:
    email: vmanage@cisco.com
  license:
    name: Commercial License
    url: https://www.cisco.com/c/en/us/solutions/enterprise-networks/sd-wan/index.html
  version: 26.1.0+2026-01-06
  x-provenance:
    method: harvested
    authored_by: Cisco Catalyst SD-WAN
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
    first_party: true
    provider_published: true
    source_host: pubhub.devnetcloud.com
    note: 4,138 operations across 2,841 paths, published by Cisco as self-contained per-operation OpenAPI 3.1.0 fragments on the DevNet CDN and consolidated here into 13 documents. Ownership verified from info.contact vmanage@cisco.com and the Cisco license URL rather than from the fetch host.
  x-evidence:
  - type: source
    url: https://pubhub.devnetcloud.com/media/cisco-catalyst-sd-wan-26-1-api-guide/docs/
  - type: source
    url: https://developer.cisco.com/docs/sdwan/
servers:
- url: /dataservice
tags:
- name: Configuration - Settings
paths:
  /settings/banner:
    get:
      tags:
      - Configuration - Settings
      summary: Retrieve banner
      description: Retrieve banner
      operationId: getBanner
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /settings/clientSessionTimeout:
    get:
      tags:
      - Configuration - Settings
      summary: Get client session timeout
      description: Get client session timeout
      operationId: getSessionTimout
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Client Session Timeout Response:
                  description: Client Session Timeout Response
                  value:
                    data:
                    - isEnabled: true
                      timeout: 30
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /settings/configuration/analytics/dca:
    post:
      tags:
      - Configuration - Settings
      summary: Create analytics data file
      description: Create analytics data file
      operationId: createAnalyticsDataFile
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Analytics DCA Success Response:
                  description: Analytics DCA Success Response
                  value:
                    status: success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      deprecated: true
  /settings/configuration/certificate/{type}:
    get:
      tags:
      - Configuration - Settings
      summary: Retrieve certificate configuration value by type
      description: Retrieve certificate configurations value by type
      operationId: getCertConfiguration
      parameters:
      - name: type
        in: path
        description: Type of the certificate configuration
        required: true
        schema:
          type: string
        examples:
          Certificate:
            description: Certificate
            value: certificate
          CSR Properties:
            description: CSR Properties
            value: csrproperties
          CRL Settings:
            description: CRL Settings
            value: crlSetting
          Enterprise Root CA:
            description: Enterprise Root CA
            value: enterpriserootca
          Hardware Root CA:
            description: Hardware Root CA
            value: hardwarerootca
          Enterprise Certificate Settings:
            description: Enterprise Certificate Settings
            value: enterpriseCertificateSettings
          Controller/Edge Certificate Settings:
            description: Controller/Edge Certificate Settings
            value: controllerEdgeCertificateSettings
          Web Server Certificate Settings:
            description: Web Server Certificate Settings
            value: webCertificateSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Certificate Response:
                  description: Certificate Response
                  value:
                    data:
                    - certificateSigning: cisco
                      validityPeriod: 1Y
                      retrieveInterval: '60'
                  $$ref: '#/components/examples/ComViptelaVmanageServerSettingapiResponseExampleGetcertificateresponse'
                CSR Properties Response:
                  description: CSR Properties Response
                  value:
                    data:
                    - domain_name: ABC.cisco.com
                      secondary_org_unit: ''
                      org: ABC
                      location: ABC
                      state: ABC
                      email: ABC@cisco.com
                      country: IN
                      validity: 1Y
                      org_unit: ABC
                      san_dns: ''
                      san_uri: ''
                      controlConnectionUp: true
                  $$ref: '#/components/examples/ComViptelaVmanageServerSettingapiResponseExampleGetcsrpropertiesresponse'
                CRL Settings Response:
