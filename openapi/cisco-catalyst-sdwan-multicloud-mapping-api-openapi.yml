        in: path
        description: Multicloud provider type
        required: true
        schema:
          type: string
      - name: cloudGatewayName
        in: query
        required: true
        schema:
          type: string
      - name: siteUuid
        in: query
        schema:
          pattern: ^[a-zA-Z0-9\-]*$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountName:
                    type: string
                    example: awsTest
                  hostVpcId:
                    type: string
                    example: vpc-0638351a9efaf77e9
                  hostVpcName:
                    type: string
                    description: Returned for AWS/AWS_GOVCLOUD/GCP
                    example: vpc-0638351a9efaf77e9
