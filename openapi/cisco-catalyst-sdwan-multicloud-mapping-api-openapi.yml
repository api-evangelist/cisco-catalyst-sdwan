  /multicloud/map:
    post:
      tags:
      - MultiCloud - Mapping
      description: Enable Mapping for cloudType
      operationId: processMapping
      requestBody:
        description: Payloads for enable mapping
        content:
          application/json:
            schema:
              required:
              - cloudType
              type: object
              properties:
                cloudType:
                  pattern: ^[a-zA-Z_]+$
                  type: string
                connMatrix:
                  maxItems: 2147483647
                  minItems: 1
                  type: array
                  items:
                    required:
                    - conn
                    - destId
                    - destType
                    - srcId
                    - srcType
                    type: object
                    properties:
                      conn:
                        type: string
                      destId:
                        type: string
                      destType:
                        type: string
                      mapped:
                        type: array
                        items:
                          type: object
                          properties:
                            cgwAttachment:
                              type: string
                            cloudType:
                              type: string
                            destId:
                              type: string
                            destRegion:
                              type: string
                            destTag:
                              type: string
                            destType:
                              type: string
                            region:
                              type: string
                            sourceRegion:
                              type: string
                            sourceTag:
                              type: string
                            srcId:
                              type: string
                            srcType:
                              type: string
                            tunnelId:
                              type: string
                          $$ref: '#/components/schemas/PostMapRequestMapped'
                      outstandingMapping:
                        type: array
                        items:
                          type: object
                          properties:
                            cgwAttachment:
                              type: string
                            cloudType:
                              type: string
                            destId:
                              type: string
                            destRegion:
                              type: string
                            destTag:
                              type: string
                            destType:
                              type: string
                            region:
                              type: string
                            sourceRegion:
                              type: string
                            sourceTag:
                              type: string
                            srcId:
                              type: string
                            srcType:
                              type: string
                            tunnelId:
                              type: string
                          $$ref: '#/components/schemas/PostMapRequestMapped'
                      srcId:
                        type: string
                      srcType:
                        type: string
                      tgwRouteTableId:
                        type: string
                      unmapped:
                        type: array
                        items:
                          type: object
                          properties:
                            cgwAttachment:
                              type: string
                            cloudType:
                              type: string
                            destId:
                              type: string
                            destRegion:
                              type: string
                            destTag:
                              type: string
                            destType:
                              type: string
                            region:
                              type: string
                            sourceRegion:
                              type: string
                            sourceTag:
                              type: string
                            srcId:
                              type: string
                            srcType:
                              type: string
                            tunnelId:
                              type: string
                          $$ref: '#/components/schemas/PostMapRequestMapped'
                    $$ref: '#/components/schemas/PostMapRequestConnMatrix'
              $$ref: '#/components/schemas/PostMapRequest'
            examples:
              Post Map:
                description: Post Map
                value:
                  cloudType: GCP
                  connMatrix:
                  - conn: enabled
                    destId: tag1
                    destType: tag
                    srcId: '100'
                    srcType: vpn
                  - conn: enabled
                    destId: vpn
                    destType: tag
                    srcId: '100'
                    srcType: tag
              Post UnMap:
                description: Post UnMap
                value:
                  cloudType: GCP
                  connMatrix:
                  - conn: disabled
                    destId: tag1
                    destType: tag
                    mapped: []
                    outstandingMapping: []
                    srcId: '100'
                    srcType: vpn
                    unmapped:
                    - cloudType: GCP
                      destId: '3889358374498280098'
                      destRegion: global
                      destTag: tag1
                      destType: vpc
                      sourceRegion: us-west1
                      srcId: '100'
                      srcType: vpn
                      tunnelId: C8K-011df81d-760e-47e2-b930-cc8eaaff773d::100
                    - cloudType: GCP
                      destId: '3889358374498280098'
                      destRegion: global
                      destTag: tag1
                      destType: vpc
                      sourceRegion: us-west1
                      srcId: '100'
                      srcType: vpn
                      tunnelId: C8K-6c832624-b47c-491e-bd95-b5b4b86981ec::100
                  - conn: disabled
                    destId: '100'
                    destType: vpn
                    srcId: tag1
                    srcType: tag
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
