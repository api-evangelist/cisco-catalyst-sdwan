                    fair_site:
                      type: integer
                      format: int32
                      example: 1
                    family:
                      type: string
                      example: audio
                    good_site:
                      type: integer
                      format: int32
                      example: 10
                    health:
                      pattern: (good|fair|poor)
                      type: string
                      example: good
                    poor_site:
                      type: integer
                      format: int32
                      example: 1
                  $$ref: '#/components/schemas/ApplicationsSitesItem'
        '400':
          description: Bad Request
      x-roles-required: Application Monitoring-read,Application Monitoring-write
