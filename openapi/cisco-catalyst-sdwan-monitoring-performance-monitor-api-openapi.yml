          - '6'
          - '12'
          - '24'
      - name: health
        in: query
        schema:
          type: string
          enum:
          - GOOD
          - FAIR
          - POOR
      - name: includeUsage
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: search results matching criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  required:
                  - application
                  - family
                  - health
                  - jitter
                  - latency
                  - loss
                  type: object
                  properties:
                    application:
                      type: string
                      example: http
                    family:
                      type: string
                      example: audio
                    health:
                      pattern: (good|fair|poor)
                      type: string
                      example: good
                    jitter:
                      type: number
                      format: double
                      example: 1
                    latency:
                      type: number
                      format: double
                      example: 10
                    loss:
                      type: number
                      format: double
                      example: 1
                  $$ref: '#/components/schemas/ApplicationsSiteItem'
        '400':
          description: Bad Request
      x-roles-required: Application Monitoring-read,Application Monitoring-write
  /statistics/perfmon/applications/sites/health:
    get:
      tags:
      - Monitoring - Performance Monitor
      summary: all sites all applications health data
      description: 'Get applications health for all sites '
      operationId: getApplicationsSitesHealth
      parameters:
      - name: isHeatMap
        in: query
        schema:
          type: boolean
      - name: last_n_hours
        in: query
        schema:
          type: string
          enum:
          - '1'
          - '3'
          - '6'
          - '12'
          - '24'
      - name: health
        in: query
        schema:
          type: string
          enum:
          - GOOD
          - FAIR
          - POOR
      - name: includeUsage
        in: query
        schema:
          type: boolean
          default: false
      - name: useCache
        in: query
        description: Use cache data
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: search results matching criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  required:
                  - application
                  - fair_site
                  - family
                  - good_site
                  - health
                  - poor_site
                  type: object
                  properties:
                    application:
                      type: string
