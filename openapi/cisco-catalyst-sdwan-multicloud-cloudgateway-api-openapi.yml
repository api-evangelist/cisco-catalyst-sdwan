  /multicloud/cloudgateway/nvaSecurityRules/{cloudGatewayName}:
    get:
      tags:
      - MultiCloud - CloudGateway
      description: Get NVA Security Rules
      operationId: getNvaSecurityRules
      parameters:
      - name: cloudGatewayName
        in: path
        description: Multicloud cloud gateway name
        required: true
        schema:
          maxLength: 255
          minLength: 1
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                    example: '112948124124'
                  accountName:
                    type: string
                    example: test_account_name
                  cloudType:
                    type: string
                    example: AZURE
                  expirationTime:
                    type: string
                    example: 6/10/2022 6:12:36 PM UTC
                  nvaId:
                    type: string
                    example: /subscriptions/112948124124/resourceGroups/test-resource-group/providers/Microsoft.Network/networkVirtualAppliances/CiscoSdwanV2-nva-399bdf13-65e9-4177-876b-d125bee704d6
                  resourceGroupName:
                    type: string
                    example: test-resource-group
                  ruleName:
                    type: string
                    example: test_rule
                  securityRulesList:
                    type: object
                    properties:
                      securityRulesList:
                        type: array
                        items:
                          required:
                          - destinationPortRange
                          - protocol
                          - sourceAddressPrefix
                          type: object
                          properties:
                            destinationPortRange:
                              pattern: ^\d+$
                              type: string
                              example: '22'
                            protocol:
                              pattern: ^(TCP|UDP)$
                              type: string
                              example: TCP
                            sourceAddressPrefix:
                              pattern: ^(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}\/(?:3[0-2]|[0-2]?[0-9])$
                              type: string
                              example: 192.168.1.1/32
                          $$ref: '#/components/schemas/NvaRulesListRequestSecurityRulesList'
                    $$ref: '#/components/schemas/NvaRulesListRequest'
                $$ref: '#/components/schemas/NvaRulesResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    put:
      tags:
      - MultiCloud - CloudGateway
      description: Update NVA Security Rules
      operationId: updateNvaSecurityRules
      parameters:
      - name: cloudGatewayName
        in: path
        required: true
        schema:
          pattern: ^[\w.-]{1,128}$
          type: string
      requestBody:
        description: Update NVA security Rules
        content:
          application/json:
            schema:
              type: object
              properties:
                securityRulesList:
                  type: array
                  items:
                    required:
                    - destinationPortRange
                    - protocol
                    - sourceAddressPrefix
                    type: object
                    properties:
                      destinationPortRange:
                        pattern: ^\d+$
                        type: string
                        example: '22'
                      protocol:
                        pattern: ^(TCP|UDP)$
                        type: string
                        example: TCP
                      sourceAddressPrefix:
                        pattern: ^(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}\/(?:3[0-2]|[0-2]?[0-9])$
                        type: string
                        example: 192.168.1.1/32
                    $$ref: '#/components/schemas/NvaRulesListRequestSecurityRulesList'
              $$ref: '#/components/schemas/NvaRulesListRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 6c723f65-9106-4f43-9d2b-a033a39353b3
                description: Task id for polling status
                $$ref: '#/components/schemas/Taskid'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
