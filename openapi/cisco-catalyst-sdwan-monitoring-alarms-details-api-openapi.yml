  /alarms/starttracking/{testName}:
    post:
      tags:
      - Monitoring - Alarms Details
      description: Start tracking events
      operationId: startTracking
      parameters:
      - name: testName
        in: path
        description: Test Name
        required: true
        schema:
          pattern: ^[a-zA-Z0-9\-_]*$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                    example: Successfully dump data in log file
                $$ref: '#/components/schemas/SimpleMessageResponse'
              examples:
                Response:
                  description: Response
                  value:
                    Message: Done
                  $$ref: '#/components/examples/ComViptelaVmanageServerCorrelationEngineResponseStarttracking'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Alarms-read
  /alarms/stats:
    get:
      tags:
      - Monitoring - Alarms Details
      description: Get alarm statistics
      operationId: getStats
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  Correlation DB Manipulator:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        Discarded Events:
                          type: integer
                          format: int32
                          example: 0
                        Processed Events:
                          type: integer
                          format: int32
                          example: 0
                        Total:
                          type: integer
                          format: int32
                          example: 0
                      $$ref: '#/components/schemas/EventStats'
                  Correlation Engine:
                    type: object
                    properties:
                      Added Events:
                        type: integer
                        format: int32
                        example: 89
                    $$ref: '#/components/schemas/AlarmStatsResponseCorrelationEngine'
                  Link Update Correlator:
                    type: object
                    additionalProperties:
                      type: string
                $$ref: '#/components/schemas/AlarmStatsResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Alarms-read
  /alarms/stoptracking/{testName}:
    post:
      tags:
      - Monitoring - Alarms Details
      description: Stop tracking events
      operationId: stopTracking
      parameters:
      - name: testName
        in: path
        description: Test Name
        required: true
        schema:
          pattern: ^[a-zA-Z0-9\-_]*$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  Message:
                    type: string
                    example: Successfully dump data in log file
                $$ref: '#/components/schemas/SimpleMessageResponse'
              examples:
                Response:
                  description: Response
                  value:
                    Message: Done
                  $$ref: '#/components/examples/ComViptelaVmanageServerCorrelationEngineResponseStarttracking'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Alarms-read
  /alarms/topic:
    get:
      tags:
      - Monitoring - Alarms Details
      description: Get topic on which alarms for given device are publishing.
      operationId: getDeviceTopic
      parameters:
      - name: ip
        in: query
        description: Device system IP
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  device-ip:
                    type: string
                    example: 172.16.255.11
                  server-ip:
                    type: string
                    example: 10.0.105.39
                  topic:
                    type: string
                    example: AlarmEvent3
                $$ref: '#/components/schemas/AlarmTopic'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Alarms-read
  /alarms/topn:
    post:
      tags:
      - Monitoring - Alarms Details
      description: Returns top-n alarm count based on given query
      operationId: getTopN
      parameters:
      - name: site-id
        in: query
        description: Specify the site-id to filter the alarms
        schema:
          pattern: ^[0-9]+$
          type: string
      - name: includeTenants
        in: query
        description: Specify whether the tenant alarms need to be visible or not from provider view.
        schema:
          type: boolean
      requestBody:
        description: Input query
        content:
          application/json:
            schema:
              type: object
            examples:
              Topn by system IP:
                description: Topn by system IP
                value:
                  query:
                    field: system_ip
                    condition: AND
                    rules:
                    - value:
                      - '24'
                      field: entry_time
                      type: date
                      operator: last_n_hours
                    - field: active
                      operator: in
                      type: boolean
                      value:
                      - 'true'
                    - field: acknowledged
                      operator: in
                      type: boolean
                      value:
                      - 'false'
                    size: 2
                $$ref: '#/components/examples/ComViptelaVmanageServerCorrelationEngineRequestTopnBySystemip'
              Topn by host name:
                description: Topn by host name
                value:
                  query:
                    field: host-name
                    condition: AND
                    rules:
                    - value:
                      - '24'
                      field: entry_time
                      type: date
                      operator: last_n_hours
                    - field: active
                      operator: in
                      type: boolean
                      value:
                      - 'true'
                    - field: acknowledged
                      operator: in
                      type: boolean
                      value:
                      - 'false'
                    size: 2
                $$ref: '#/components/examples/ComViptelaVmanageServerCorrelationEngineRequestTopnByHostname'
              Topn by type:
                description: Topn by type
                value:
                  query:
                    field: type
                    condition: AND
                    rules:
                    - value:
                      - '24'
                      field: entry_time
                      type: date
                      operator: last_n_hours
                    - field: active
                      operator: in
                      type: boolean
                      value:
                      - 'true'
                    - field: acknowledged
                      operator: in
                      type: boolean
                      value:
                      - 'false'
                    size: 2
                $$ref: '#/components/examples/ComViptelaVmanageServerCorrelationEngineRequestTopnByType'
              Topn by severity:
                description: Topn by severity
                value:
                  query:
                    field: severity
                    condition: AND
                    rules:
                    - value:
                      - '24'
                      field: entry_time
                      type: date
                      operator: last_n_hours
                    - field: active
                      operator: in
                      type: boolean
                      value:
                      - 'true'
                    - field: acknowledged
                      operator: in
                      type: boolean
                      value:
                      - 'false'
                    size: 2
                $$ref: '#/components/examples/ComViptelaVmanageServerCorrelationEngineRequestTopnBySeverity'
              Topn by rule name display:
                description: Topn by rule name display
                value:
                  query:
                    field: rule_name_display
                    condition: AND
                    rules:
                    - value:
                      - '24'
                      field: entry_time
                      type: date
                      operator: last_n_hours
                    - field: active
                      operator: in
                      type: boolean
                      value:
                      - 'true'
                    - field: acknowledged
                      operator: in
                      type: boolean
                      value:
                      - 'false'
                    size: 3
                $$ref: '#/components/examples/ComViptelaVmanageServerCorrelationEngineRequestTopnByRulenamedisplay'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Topn by system IP:
                  description: Topn by system IP
                  value:
                    data:
                    - system_ip: 172.16.255.16
                      count: 38
                      devices:
                      - system_ip: 172.16.255.16
                        host_name: vm6
                        count: 38
                    - system_ip: 172.16.255.22
                      count: 30
                      devices:
                      - system_ip: 172.16.255.22
                        host_name: vm12
                        count: 30
                    - system_ip: 172.16.255.26
                      count: 28
                      devices:
                      - system_ip: 172.16.255.26
                        host_name: vm16
                        count: 28
                  $$ref: '#/components/examples/ComViptelaVmanageServerCorrelationEngineResponseTopnBySystemip'
                Topn by host name:
                  description: Topn by host name
                  value:
                    data:
                    - host-name: vm6
                      count: 38
                      devices:
                      - system_ip: 172.16.255.16
                        host_name: vm6
                        count: 38
                    - host-name: vm12
                      count: 30
                      devices:
                      - system_ip: 172.16.255.22
                        host_name: vm12
                        count: 30
                    - host-name: vm16
                      count: 28
                      devices:
                      - system_ip: 172.16.255.26
                        host_name: vm16
