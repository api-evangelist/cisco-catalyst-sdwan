      operationId: createRebootHistoryList
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Device reboot history:
                  description: Device reboot history
                  value:
                    data:
                    - reboot_date_time-date: 1642651714000
                      lastupdated: 1642656685355
                      vdevice-dataKey: 172.16.255.11-2022-01-20T04:08:34+00:00
                      reboot_date_time: '2022-01-20T04:08:34+00:00'
