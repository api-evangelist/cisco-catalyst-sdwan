  /backup/backupinfo:
    delete:
      tags:
      - Scheduled Backup Restore
      summary: Deletes a local database operation
      description: Delete all or a specific backup file stored in vManage
      operationId: deleteSchduledBackup
      parameters:
      - name: taskId
        in: query
        schema:
          pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          type: string
      - name: backupInfoId
        in: query
        schema:
          pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    required:
                    - code
                    - details
                    - message
                    type: object
                    properties:
                      code:
                        type: string
                        description: Error code associated with the error event
                      details:
