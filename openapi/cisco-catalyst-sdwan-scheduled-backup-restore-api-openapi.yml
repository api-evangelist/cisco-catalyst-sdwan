              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: data list
                    example:
                    - MEGAPORT
                    - EQUINIX
                    - ATT
                    items:
                      type: string
                      description: data
                      example: MEGAPORT
                $$ref: '#/components/schemas/InlineResponse200'
        '400':
