  /device/cellular/counter:
    get:
      tags:
      - Overview - Cellular
      description: Cellular count dashlet
      operationId: cellularCountDashlet
      parameters:
      - name: type
        in: query
        description: type
        schema:
          type: string
          enum:
          - rat
          - product
          - carrier
      - name: lastNHours
        in: query
        description: last N Hours
        schema:
          type: string
          enum:
          - '1'
          - '3'
          - '6'
          - '12'
          - '24'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    active:
                      type: integer
                      format: int32
                      example: 1
                    carrier:
                      type: string
                      example: ATT
                    product:
                      type: string
                      example: NIMs
                    rat:
                      type: string
                      example: 4G
                    standby:
                      type: integer
                      format: int32
                      example: 2
                  $$ref: '#/components/schemas/CellularCount'
              examples:
                count by rat:
                  description: count by rat
                  value:
                  - rat: 4G
                    standby: 0
                    active: 2
                  $$ref: '#/components/examples/ComViptelaVmanageServerDeviceCellularCellularrestfulresourceResponseExampleCellularcountbyrat'
                count by carrier:
                  description: count by carrier
                  value:
                  - carrier: ATT
                    standby: 0
                    active: 1
                  - carrier: Verizon
                    standby: 0
                    active: 1
                  $$ref: '#/components/examples/ComViptelaVmanageServerDeviceCellularCellularrestfulresourceResponseExampleCellularcountbycarrier'
                count by product:
                  description: count by product
                  value:
                  - product: Network Interface Modules (NIMs)
                    standby: 0
                    active: 2
                  $$ref: '#/components/examples/ComViptelaVmanageServerDeviceCellularCellularrestfulresourceResponseExampleCellularcountbyproduct'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Device Monitoring-read,Device Monitoring-write
