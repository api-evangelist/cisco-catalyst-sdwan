servers:
- url: /dataservice
tags:
- name: Cisco Software
paths:
  /v1/cisco-software/eula:
    get:
      tags:
      - Cisco Software
      description: Get User's EULA status from cisco
      operationId: fetchEulaStatus
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  eula_accepted:
                    type: boolean
                    example: true
                  eula_form:
                    type: string
                    example: https://software-test.cisco.com/download/eula
                $$ref: '#/components/schemas/EulaResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /v1/cisco-software/imagemetadata:
    post:
      tags:
      - Cisco Software
      description: Get image metadata from cisco
      operationId: getImageMetadataFromCCO
      parameters:
      - name: imageType
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /v1/cisco-software/user:
    get:
      tags:
      - Cisco Software
      description: Get user
      operationId: getCiscoSoftwareUser
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                    example: srikann@cisco.com
                $$ref: '#/components/schemas/GetUser'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /v1/device-authorize/authentication:
    get:
      tags:
      - Cisco Software
      description: Get authorization url
      operationId: getAuthUrl
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code:
                    type: string
                    example: da92fb0d-d641-4ad4-93aa-9605e769dc7f
                  verification_uri_complete:
                    type: string
                    example: https://id.cisco.com/activate?user_code=GHSJDRMP
                $$ref: '#/components/schemas/AuthorizeResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /v1/device-authorize/token/{deviceCode}:
    post:
      tags:
      - Cisco Software
      description: Get access token from idp
      operationId: getAuthToken
      parameters:
      - name: deviceCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /v1/device-authorize/validtoken:
    get:
      tags:
      - Cisco Software
      description: Get user token validity
      operationId: getTokenValidity
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                    example: true
                $$ref: '#/components/schemas/TokenValidity'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
