paths:
  /device/app-route/sla-class:
    get:
      tags:
      - Real-Time Monitoring - Application-Aware Route
      description: Get SLA class list from device (Real Time)
      operationId: createAppRouteSlaClassList
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                SLA class:
                  description: SLA class
                  value:
                    data:
                    - app-probe-class: None
                      loss: 0
                      fallback-best-tunnel: None
                      jitter: 0
                      vdevice-dataKey: 169.254.10.10-0
                      vdevice-name: 169.254.10.10
                      latency: 0
                      name: __all_tunnels__
                      index: 0
                      lastupdated: 1642576726463
                      vdevice-host-name: vm3
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Policy-read,Policy-write
