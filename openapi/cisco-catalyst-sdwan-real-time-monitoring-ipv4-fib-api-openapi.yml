paths:
  /device/ip/v4fib:
    get:
      tags:
      - Real-Time Monitoring - IPv4 FIB
      description: Get IPv4 FIB list from Manager, Controller, Validator and vEdge device (Real Time)
      operationId: createIPv4FibList
      parameters:
      - name: vpn-id
        in: query
        description: VPN Id
        schema:
          type: string
          enum:
          - '0'
          - '512'
      - name: prefix
        in: query
        description: IP prefix
        schema:
          type: string
      - name: tloc
        in: query
        description: tloc IP
        schema:
          type: string
      - name: color
        in: query
        description: tloc color
        schema:
          type: string
          enum:
          - default
          - mpls
          - metro-ethernet
          - biz-internet
          - public-internet
          - lte
          - 3g
          - red
          - green
          - blue
          - gold
          - silver
          - bronze
          - custom1
          - custom2
          - custom3
          - private1
          - private2
          - private3
          - private4
          - private5
          - private6
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                FIB list:
                  description: FIB list
                  value:
                    data:
                    - path-id: 1
                      vdevice-dataKey: 169.254.10.10-512-10.0.1.0/24
                      vdevice-name: 169.254.10.10
                      prefix: 10.0.1.0/24
                      lastupdated: 1643096072514
                      out-ifname: eth0
                      vpn-id: 512
                      vdevice-host-name: vm3
                    - path-id: 1
                      vdevice-dataKey: 169.254.10.10-512-10.0.1.3/32
                      vdevice-name: 169.254.10.10
                      prefix: 10.0.1.3/32
                      lastupdated: 1643096072514
                      out-ifname: eth0
                      vpn-id: 512
                      vdevice-host-name: vm3
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Routing-read,Routing-write,System-read,System-write
