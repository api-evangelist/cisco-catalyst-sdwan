  /v1/topology-group/{topologyGroupId}/device/deploy:
    post:
      tags:
      - Topology - Topology Group
      description: deploy Topology group to devices
      operationId: deployTopologyGroup
      parameters:
      - name: topologyGroupId
        in: path
        description: Topology Group Id
        required: true
        schema:
          pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deactivateTopology:
                  type: boolean
                  default: false
              required: []
              additionalProperties: false
              $$ref: '#/components/schemas/TopologygroupCommonDeployPostRequest_SchemaPayload'
            examples: {}
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  parentTaskId:
                    type: string
                    minLength: 1
                    $$ref: '#/components/schemas/CommonCommonDefs_nonEmptyStringDef'
                required:
                - parentTaskId
                additionalProperties: false
                $$ref: '#/components/schemas/TopologygroupCommonDeployPostResponse_SchemaPayload'
              examples:
                example_1:
                  value:
                    parentTaskId: deploy-topology-group-73C544A7-5B4d-8f6c-feB4-b4af830b0d2c
                  $$ref: '#/components/examples/TopologygroupCommonDeployPostResponse_example_1'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Topology Group > Device > Activate-write
  /v1/topology-group/{topologyGroupId}/device/{deviceId}/preview:
    post:
      tags:
      - Topology - Topology Group
      description: Get a preview of the configuration for a device
      operationId: getTopologyGroupDeviceConfigurationPreview
      parameters:
      - name: topologyGroupId
        in: path
        description: Topology Group Id
        required: true
        schema:
          type: string
      - name: deviceId
        in: path
        description: Device Id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deactivateTopology:
                  type: boolean
                  description: Preview vSmart configuration with Topology Group config removed
              required: []
              additionalProperties: false
              $$ref: '#/components/schemas/TopologygroupCommonPreviewPostRequest_SchemaPayload'
            examples:
              example_1:
                value:
                  deactivateTopology: true
                $$ref: '#/components/examples/TopologygroupCommonPreviewPostRequest_example_1'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  existingConfig:
                    type: string
                  newConfig:
                    type: string
                  unsupportedParcels:
                    type: array
                    minItems: 0
                    items:
                      type: object
                required:
                - existingConfig
                - newConfig
                additionalProperties: false
                $$ref: '#/components/schemas/TopologygroupCommonPreviewPostResponse_SchemaPayload'
              examples:
                example_1:
                  value:
                    existingConfig: old config
                    newConfig: new config
                  $$ref: '#/components/examples/TopologygroupCommonPreviewPostResponse_example_1'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Topology Group > Device > Activate-read
