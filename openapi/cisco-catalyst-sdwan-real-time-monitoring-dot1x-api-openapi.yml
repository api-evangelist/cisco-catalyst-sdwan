  /device/dot1x/clients:
    get:
      tags:
      - Real-Time Monitoring - DOT1x
      description: Get DOT1x client from device (Real Time)
      operationId: getWLANDOT1xClients
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                DOT1x client:
                  description: DOT1x client
                  value:
                    data:
                    - vdevice-name: 172.16.254.2
                      vdevice-host-name: vm3
                      if-name: ge0/1
                      mac-address: 00:50:b6:0f:1c:84
                      auth-state: Authenticating
                      auth-method: Radius
                      vlan: '12'
                      vpn: '-'
                      eap-method: (PEAP)
                      username: admin
