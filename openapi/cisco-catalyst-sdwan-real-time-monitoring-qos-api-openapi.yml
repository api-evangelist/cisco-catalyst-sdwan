  /device/qos/session/details:
    get:
      tags:
      - Real-Time Monitoring - QoS
      description: Get per-tunnel QoS session detailed info
      operationId: getPerTunnelQosDetailedInfo
      parameters:
      - name: deviceId
        in: query
        required: true
        schema:
          type: string
      - name: local-system-ip
        in: query
        schema:
          type: string
      - name: local-color
        in: query
        schema:
          type: string
      - name: remote-system-ip
        in: query
        schema:
          type: string
      - name: remote-color
        in: query
        schema:
          type: string
      - name: proto
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        classifier-entry-name:
                          type: string
                          example: Queue1
                        drop-bytes:
                          type: number
                          example: 0
                        drop-pkts:
                          type: number
                          example: 0
                        lastupdated:
                          type: number
                          example: 1728710934571
                        local-color:
                          type: string
                          example: lte
                        local-system-ip:
                          type: string
                          example: 172.16.255.15
                        post-policy-bytes:
                          type: number
                          example: 0
                        post-policy-pkts:
                          type: number
                          example: 0
                        pre-policy-bytes:
                          type: number
                          example: 0
                        pre-policy-pkts:
                          type: number
                          example: 0
                        proto:
                          type: string
                          example: ipsec
                        remote-color:
                          type: string
                          example: lte
                        remote-system-ip:
                          type: string
                          example: 172.16.255.16
                        tunnel-endpoint:
                          type: string
                          example: 172.16.255.15_lte_172.16.255.16_lte_ipsec
                        vdevice-dataKey:
                          type: string
                          example: 172.16.255.15-172.16.255.15_lte_172.16.255.16_lte_ipsec-Queue1
                        vdevice-host-name:
                          type: string
                          example: vm5
                        vdevice-name:
                          type: string
                          example: 172.16.255.15
