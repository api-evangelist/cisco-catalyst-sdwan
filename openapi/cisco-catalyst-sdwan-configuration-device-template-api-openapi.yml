                      //system/system-ip: 172.16.255.11
                      //system/site-id: '100'
                      csv-templateId: 41f6a440-c5cc-4cc6-9ca1-af18e332a781
                      selected: 'true'
                    isEdited: false
                    isMasterEdited: false
                    isDraftDisabled: false
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Task Id:
                  description: Task Id
                  value: '"{"id":"push_feature_template_configuration-01232017T154359940"}"'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Template Deploy-write
