        description: Device template
        content:
          application/json:
            schema:
              type: object
            examples:
              Device template:
                description: Device template
                value:
                  deviceTemplateList:
                  - templateId: 41f6a440-c5cc-4cc6-9ca1-af18e332a781
                    device:
                    - csv-status: complete
                      csv-deviceId: 5e5f45e7-3062-44b2-b6f6-40c682149e05
                      csv-deviceIP: 172.16.255.11
                      csv-host-name: vm1
