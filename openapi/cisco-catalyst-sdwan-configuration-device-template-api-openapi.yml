      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Task Id:
                  description: Task Id
                  value:
                    id: push_file_template_configuration-d13a002a-0475-43bf-85db-ef9224112a52
