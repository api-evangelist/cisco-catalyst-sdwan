      operationId: getAppLogFlowCount
      parameters:
      - name: deviceId
        in: query
        description: Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                App log flows count:
                  description: App log flows count
                  value:
                    data:
                    - vdevice-name: 172.16.254.1
                      vdevice-host-name: vm2
                      vpn-id: '1'
                      count: '20'
                      vdevice-dataKey: 172.16.254.1
                      lastupdated: 1654066320000
