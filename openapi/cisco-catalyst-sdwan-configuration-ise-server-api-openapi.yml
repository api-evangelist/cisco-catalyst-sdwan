            application/json:
              schema:
                type: object
                properties:
                  VersionInfo:
                    type: object
                    properties:
                      currentServerVersion:
                        type: string
                        example: '1.2'
                      link:
                        type: object
                        properties:
                          href:
                            type: string
                            example: https://172.27.216.141:9060/ers/config/adminuser/versioninfo
                          rel:
                            type: string
                            example: self
                          type:
                            type: string
                            example: application/json
