        required: true
        schema:
          type: string
      - name: accountIds
        in: query
        description: Multicloud cloud gateway enabled
        schema:
          type: string
      - name: region
        in: query
        schema:
          maxLength: 1024
          minLength: 1
          pattern: ^[a-zA-Z0-9_./\-]+$
          type: string
      - name: untagged
        in: query
        description: Multicloud cloud gateway enabled
        schema:
          pattern: ^(true|false)$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  required:
                  - accountId
                  - cloudType
                  - hostVpcId
                  - region
                  - vnetId
                  type: object
                  properties:
                    accountId:
