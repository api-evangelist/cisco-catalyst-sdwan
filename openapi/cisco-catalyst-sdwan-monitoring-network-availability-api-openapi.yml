        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  required:
                  - health
                  - jitter
                  - latency
                  - loss
                  type: object
                  properties:
                    availability:
                      type: number
                      example: 0.9
                    health:
                      type: string
                      example: good
                      enum:
