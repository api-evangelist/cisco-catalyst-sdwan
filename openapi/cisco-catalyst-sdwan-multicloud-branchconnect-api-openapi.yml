paths:
  /multicloud/cloudgateway/{cloudGatewayName}/site:
    get:
      tags:
      - MultiCloud - BranchConnect
      description: Get sites attached to CGW
      operationId: getCgwAttachedSites
      parameters:
      - name: cloudGatewayName
        in: path
        description: Name of Cloud Gateway to attach site
        required: true
        schema:
          pattern: ^[\w.-]{1,128}$
          type: string
      - name: systemIp
        in: query
        description: System Ip of Branch Device
        schema:
          pattern: ^((([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])(%[\p{N}\p{L}]+)?)((\s)(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])(%[\p{N}\p{L}]+)?)?$
          type: string
      - name: siteId
        in: query
        description: Site Id
        schema:
          pattern: ^\d+$
          type: string
      - name: color
        in: query
        description: color
        schema:
          pattern: ^(default|mpls|metro-ethernet|biz-internet|public-internet|lte|3g|red|green|blue|gold|silver|bronze|custom1|custom2|custom3|private1|private2|private3|private4|private5|private6)$
          type: string
      - name: vpnTunnelStatus
        in: query
        description: Tunnel status of device
        schema:
          pattern: ^(true|false)$
          type: string
      - name: solution
        in: query
        description: Solution of branch device
        schema:
          pattern: ^(sdwan|sd-routing)$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  acceleratedVpn:
                    type: boolean
                  aggTunnelStatus:
                    type: string
                  attached:
                    type: boolean
                  color:
                    type: string
                  hostname:
                    type: string
                  interface:
                    type: string
                  preferredInterface:
                    type: boolean
                    example: true
                  privateIp:
                    type: string
                  publicIp:
                    type: string
                  siteId:
                    type: string
                  systemIp:
                    type: string
                  tunnelCount:
                    type: number
                  tunnels:
                    type: array
                    properties:
                      empty:
                        type: boolean
                    description: CGW details relevant to AWS/AWS_GOVCLOUD
                    items:
                      type: object
                      properties:
                        acceptedRouteCount:
                          type: integer
                          format: int32
                        lastStatusChangeTimestamp:
                          type: string
                        outerIpAddr:
                          type: string
                        status:
                          type: string
                        statusMessage:
                          type: string
                        tunnelId:
                          type: string
                        tunnelInnerIp:
                          type: array
                          items:
                            type: string
                      description: CGW details relevant to AWS/AWS_GOVCLOUD
                      $$ref: '#/components/schemas/TunnelsInner'
                  uuid:
                    type: string
                $$ref: '#/components/schemas/GetSitesResponse'
              examples:
                Sites:
                  description: Sites
                  value:
                    uuid: C8K-a165f574-e75e-11ec-8fea-0242ac120002
                    siteId: '10'
                    hostname: Branch-10
                    systemIp: 1.1.1.10
                    interface: GigabitEthernet2
                    color: red
                    privateIp: 10.11.2.248
                    publicIp: 3.109.26.54
                    attached: true
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    delete:
      tags:
      - MultiCloud - BranchConnect
      description: Detach sites from cloud gateway
      operationId: detachSites_MulticloudBranchconnect_4806
      parameters:
      - name: cloudGatewayName
        in: path
        description: Name of Cloud Gateway to attach site
        required: true
        schema:
          pattern: ^[\w.-]{1,128}$
          type: string
      requestBody:
        description: Site Information
        content:
          application/json:
            schema:
              type: array
              properties:
                empty:
                  type: boolean
              items:
                required:
                - siteId
                - systemIp
                type: object
                properties:
                  color:
