                      uuid:
                        type: string
                        example: C8K-b78a317a-0d6c-4023-9690-8559d6ac803d
                    $$ref: '#/components/schemas/TunnelScalingRequestPayloadBranchEndpoints'
                cloudType:
                  pattern: ^[a-zA-Z_]+$
