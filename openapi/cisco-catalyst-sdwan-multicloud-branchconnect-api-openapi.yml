        in: path
        description: Name of Cloud Gateway to attach site
        required: true
        schema:
          pattern: ^[\w.-]{1,128}$
          type: string
      requestBody:
        description: Site Information
        content:
          application/json:
            schema:
              type: array
              properties:
                empty:
                  type: boolean
              items:
                required:
                - color
                - siteId
                - solution
                - systemIp
                - tunnelCount
                type: object
                properties:
                  acceleratedVpn:
                    pattern: ^(true|false)$
                    type: string
                  color:
                    pattern: ^(default|mpls|metro-ethernet|biz-internet|public-internet|lte|3g|red|green|blue|gold|silver|bronze|custom1|custom2|custom3|private1|private2|private3|private4|private5|private6)$
                    type: string
                  interface:
                    type: string
                    example: GigabitEthernet1
                  preferredInterface:
                    pattern: ^[a-zA-Z0-9]*$
                    type: string
                    example: 'true'
                  publicIp:
                    pattern: ^((([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])(%[\p{N}\p{L}]+)?)((\s)(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])(%[\p{N}\p{L}]+)?)?$
                    type: string
                    example: 18.219.1.221
                  siteId:
                    pattern: ^\d+$
                    type: string
                  solution:
                    pattern: ^(sdwan|sd-routing)$
                    type: string
                    description: Multicloud Branch Connect Solution type
                    example: sd-routing
                  systemIp:
                    pattern: ^((([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])(%[\p{N}\p{L}]+)?)((\s)(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])(%[\p{N}\p{L}]+)?)?$
                    type: string
                  tunnelCount:
                    pattern: ^[1-8]$
                    type: string
                    example: '4'
                $$ref: '#/components/schemas/AttachSitesRequestPayloadInner'
              $$ref: '#/components/schemas/AttachSitesRequestPayload'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 6c723f65-9106-4f43-9d2b-a033a39353b3
                description: Task id for polling status
                $$ref: '#/components/schemas/Taskid'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    put:
