                    example: red
                  interface:
                    type: string
                    example: GigabitEthernet1
                  siteId:
                    pattern: ^\d+$
                    type: string
                    example: '578'
                  solution:
                    pattern: ^(sdwan|sd-routing)$
                    type: string
                    example: sd-routing
                  systemIp:
                    pattern: ^((([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])(%[\p{N}\p{L}]+)?)((\s)(([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])(%[\p{N}\p{L}]+)?)?$
                    type: string
                    example: 1.1.1.178
                $$ref: '#/components/schemas/DetachSitesRequestPayloadInner'
              $$ref: '#/components/schemas/DetachSitesRequestPayload'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 6c723f65-9106-4f43-9d2b-a033a39353b3
                description: Task id for polling status
                $$ref: '#/components/schemas/Taskid'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    post:
      tags:
      - MultiCloud - BranchConnect
      description: Attach sites to Cloud Gateway
      operationId: attachSites
      parameters:
