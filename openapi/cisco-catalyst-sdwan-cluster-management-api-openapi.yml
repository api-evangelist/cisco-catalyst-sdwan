      operationId: editVmanage
      requestBody:
        description: vManage cluster config
        content:
          application/json:
            schema:
              type: object
            examples:
              vManage cluster config:
                description: vManage cluster config
                value: "{\n   \"vmanageID\":\"0\",\n   \"deviceIP”:”10.0.1.38”,\n   \"username\":\"admin\",\n   \"password”:”password”,\n   \"persona\":\"COMPUTE_AND_DATA\",\n   \"services\":{\n      \"container-manager\":{\n         \"server\":false\n      }\n   }\n}"
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    post:
      tags:
      - Cluster Management
      description: Add vManage to cluster
      operationId: addVmanage
      requestBody:
        description: vManage cluster config
        content:
          application/json:
            schema:
              type: object
            examples:
              vManage cluster config:
                description: vManage cluster config
                value:
                  deviceIP: 10.0.1.200
                  username: admin
                  password: password
                  genCSR: false
                  persona: COMPUTE_AND_DATA
                  services:
                    container-manager:
                      server: false
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
