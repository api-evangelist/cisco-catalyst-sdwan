                    remote_system_ip: 172.16.255.21
                    local_system_ip: 172.16.255.15
                    proto: IPSEC
                    sent_qos: 72
                    state: UP
                    event_type: PERIODIC
                    event_subtype: NONE
                    hops:
                      hop:
                      - idx: 1
                        ip: 10.1.15.13
                        hostname: ''
                        rtt: 486
                        rtt_min: 480
                        rtt_max: 490
                        loss: 0
                        jitter: 0
                        recv_qos: 0
                        reply_qos: 0
                        lbl_info: 0
                      - idx: 2
                        ip: 10.0.5.21
                        hostname: ''
                        rtt: 487
                        rtt_min: 480
                        rtt_max: 490
                        loss: 0
                        jitter: 0
                        recv_qos: 0
                        reply_qos: 0
                        lbl_info: 0
                $$ref: '#/components/examples/ComViptelaVmanageServerTroubleshootingUmtsUmtsrestapiParameterExampleUmtssaverequest'
        required: true
      responses:
        '200':
          description: save result
          content:
            application/json:
              schema:
                type: string
              examples:
                save result sample:
                  description: save result sample
                  value: '{status: success}'
        '400':
          description: Bad Request
      x-roles-required: vmanage-http-stream
