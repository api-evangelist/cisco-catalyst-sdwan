        required: true
        schema:
          type: string
      requestBody:
        description: Stats query string
        content:
          application/json:
            schema:
              type: object
            examples:
              on-demand sample:
                description: on-demand sample
                value:
                  record:
                  - vip_idx: 493
                    vip_time: 1643400901398
                    remote_color: lte
