                          recv_qos: 0
                          reply_qos: 0
                          lbl_info: 0
                  $$ref: '#/components/examples/ComViptelaVmanageServerTroubleshootingUmtsUmtsrestapiResponseExampleUmtsEventdrivenResult'
        '400':
          description: Bad Request
  /stream/device/umts/{deviceUUID}/save:
    post:
