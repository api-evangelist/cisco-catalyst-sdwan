paths:
  /v1/securedeviceonboarding/fetchSdoToken:
    post:
      tags:
      - Secure Device OnBoarding - SDO Token
      description: POST for fetching Secure Device Onboarding Token needed for Secure Device Onboarding APIs for eSim
      operationId: fetchSdoToken
      requestBody:
        description: Fetch SDO Token
        content:
          application/json:
            schema:
              required:
              - sdoSessionId
              type: object
              properties:
                sdoSessionId:
                  pattern: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
                  type: string
                  description: Session ID generated by SDO Identity Service. Please use this GET API - '/v1/securedeviceonboarding/getUrlForSdoIdentityService'to get URL of this Secure Device Onboarding Identity Service.
                  example: e01c5b71-b056-4602-b140-42221ccc3fec
              $$ref: '#/components/schemas/DetailsForIdentityVerificationForSdoToken'
            examples:
              Request Payload Example for Fetching Secure Device Onboarding Token:
                description: Request Payload Example for Fetching Secure Device Onboarding Token
                value:
                  sdoSessionId: e01c5b71-b056-4602-b140-42221ccc3fec
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Secure Device Onboarding-write
  /v1/securedeviceonboarding/getUrlForSdoIdentityService:
    get:
      tags:
      - Secure Device OnBoarding - SDO Token
      description: Get URL for Secure Device Onboarding Identity Service that generates Session ID required for authentication to get Secure Device Onboarding token
      operationId: getUrlForSdoIdentityService
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
              examples:
                Get Secure Device Onboarding Identity Service Url Response Example:
                  description: Get Secure Device Onboarding Identity Service Url Response Example
                  value:
                    sdoIdentityServiceUrl: http://sdo.jasper.com
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Secure Device Onboarding-read
