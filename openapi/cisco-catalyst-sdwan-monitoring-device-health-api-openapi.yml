tags:
- name: Monitoring - Device Health
paths:
  /statistics/devicehealth/history:
    get:
      tags:
      - Monitoring - Device Health
      summary: Device health history data
      description: 'Get all device health history '
      operationId: getDeviceHealthHistory
      parameters:
      - name: last_n_hours
        in: query
        schema:
          maximum: 24
          minimum: 1
          type: integer
          format: int32
          default: 12
      - name: site
        in: query
        schema:
          pattern: ^[0-9]+$
          type: string
      - name: limit
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 30
      responses:
        '200':
          description: search results matching criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cpu_load:
                      type: number
                      format: double
                      example: 1.32
                    health:
                      type: string
                      example: good
                      enum:
                      - good
                      - fair
                      - poor
                      - n/a
                    health_score:
                      type: number
                      format: double
                      example: 10
                    history:
                      type: array
                      items:
                        type: object
                        properties:
                          data:
                            type: object
                            properties:
                              jitter:
                                type: number
                                format: double
                              latency:
                                type: number
                                format: double
                              loss_percentage:
                                type: number
                                format: double
                              rx_octets:
                                type: number
                              state:
                                type: string
                                enum:
                                - Up
                                - Down
                              tx_octets:
                                type: number
                              vqoe_score:
                                type: number
                                format: double
                            $$ref: '#/components/schemas/TunnelHealthData'
                          entry_time:
                            type: number
                            example: 1657780200000
                          health:
                            type: string
                            example: good
                            enum:
                            - good
                            - fair
                            - poor
                            - n/a
                          health_score:
                            type: number
                            format: double
                            example: 10
                        $$ref: '#/components/schemas/DeviceHealthEntryItem'
                    host_name:
                      type: string
                      example: vm11
                    memory_utilization:
                      type: number
                      format: double
                      example: 43.03
                    qoe:
                      type: number
                      format: double
                      example: 10
                    reachability:
                      type: string
                      example: reachable
                    site_id:
                      type: string
                      example: '600'
                    system_ip:
                      type: string
                      example: 172.16.255.21
                  $$ref: '#/components/schemas/DeviceHealthHistoryItem'
        '400':
          description: Bad Request
  /statistics/devicehealth/overview/{type}:
    get:
      tags:
      - Monitoring - Device Health
      summary: Device health overview data
      description: 'Get all device health overview '
      operationId: getDeviceHealthOverview
      parameters:
      - name: type
        in: path
        required: true
        schema:
          pattern: ^[a-zA-Z_-]+$
          type: string
      - name: last_n_hours
        in: query
        schema:
          maximum: 24
          minimum: 1
          type: integer
          format: int32
          default: 12
      - name: site
        in: query
        schema:
          pattern: ^[0-9]+$
          type: string
      - name: personality
        in: query
        schema:
          type: string
          enum:
          - vsmart
          - vbond
          - vmanage
          - vedge
          default: vedge
      - name: limit
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
          default: 30
      responses:
        '200':
          description: search results matching criteria
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      fair:
                        type: array
                        items:
                          required:
                          - cpu_load
                          - health
                          - health_score
                          - host_name
                          - memory_utilization
                          - qoe
                          - reachability
                          - site_id
                          - system_ip
                          type: object
                          properties:
                            cpu_load:
                              type: number
                              format: double
                              example: 1.32
                            health:
                              type: string
                              example: good
                              enum:
                              - good
                              - fair
                              - poor
                              - n/a
                            health_score:
                              type: number
                              format: double
                              example: 10
                            host_name:
                              type: string
                              example: vm11
                            memory_utilization:
                              type: number
                              format: double
                              example: 43.03
                            qoe:
                              type: number
                              format: double
                              example: 10
                            reachability:
                              type: string
                              example: reachable
                            site_id:
                              type: string
                              example: '600'
                            system_ip:
                              type: string
                              example: 172.16.255.21
                          $$ref: '#/components/schemas/DeviceHealthDetailItem'
                      good:
                        type: array
                        items:
                          required:
                          - cpu_load
                          - health
                          - health_score
                          - host_name
                          - memory_utilization
                          - qoe
                          - reachability
                          - site_id
                          - system_ip
                          type: object
                          properties:
                            cpu_load:
                              type: number
                              format: double
                              example: 1.32
                            health:
                              type: string
                              example: good
                              enum:
                              - good
                              - fair
                              - poor
                              - n/a
                            health_score:
                              type: number
                              format: double
                              example: 10
                            host_name:
                              type: string
                              example: vm11
                            memory_utilization:
                              type: number
                              format: double
                              example: 43.03
                            qoe:
                              type: number
                              format: double
                              example: 10
                            reachability:
                              type: string
                              example: reachable
                            site_id:
                              type: string
                              example: '600'
                            system_ip:
                              type: string
                              example: 172.16.255.21
                          $$ref: '#/components/schemas/DeviceHealthDetailItem'
                      poor:
                        type: array
                        items:
                          required:
                          - cpu_load
                          - health
                          - health_score
                          - host_name
                          - memory_utilization
                          - qoe
                          - reachability
                          - site_id
                          - system_ip
                          type: object
                          properties:
                            cpu_load:
                              type: number
                              format: double
                              example: 1.32
                            health:
                              type: string
                              example: good
                              enum:
                              - good
                              - fair
                              - poor
                              - n/a
                            health_score:
                              type: number
                              format: double
                              example: 10
                            host_name:
                              type: string
                              example: vm11
                            memory_utilization:
                              type: number
                              format: double
                              example: 43.03
                            qoe:
                              type: number
                              format: double
                              example: 10
                            reachability:
                              type: string
                              example: reachable
                            site_id:
                              type: string
                              example: '600'
                            system_ip:
                              type: string
                              example: 172.16.255.21
                          $$ref: '#/components/schemas/DeviceHealthDetailItem'
                    $$ref: '#/components/schemas/DeviceHealthOverviewDetail'
                  total:
                    type: object
                    properties:
                      fair:
                        type: number
                        example: 100
                      good:
                        type: number
                        example: 100
                      poor:
                        type: number
                        example: 100
                    $$ref: '#/components/schemas/DeviceHealthOverviewTotal'
                $$ref: '#/components/schemas/DeviceHealthOverview'
        '400':
          description: Bad Request
