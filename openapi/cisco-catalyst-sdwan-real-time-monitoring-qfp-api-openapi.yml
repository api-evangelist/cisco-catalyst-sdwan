tags:
- name: Real-Time Monitoring - QFP
paths:
  /device/qfp/cpustat:
    get:
      tags:
      - Real-Time Monitoring - QFP
      description: Get QFP cpu status
      operationId: cpustat
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  cpp-num:
                    type: string
                    example: '0'
                  dp-stats-load:
                    type: string
                    example: '1'
                  lastupdated:
                    type: integer
                    format: int32
                    example: 170151880
                  period:
                    type: string
                    example: cpp-period-1min
                  total-input-bytes:
                    type: string
                    example: '28992'
                  total-input-pkts:
                    type: string
                    example: '30'
                  total-output-bytes:
                    type: string
                    example: '48896'
                  total-output-pkts:
                    type: string
                    example: '25'
                  vdevice-dataKey:
                    type: string
                    example: 172.16.255.15-cpp-period-1min
                  vdevice-host-name:
                    type: string
                    example: vm5
                  vdevice-name:
                    type: string
                    example: 172.16.255.15
                $$ref: '#/components/schemas/QfpCpuState'
              examples:
                QFP cpu status:
                  description: QFP cpu status
                  value:
                  - total-input-bytes: '28992'
                    period: cpp-period-1min
                    vdevice-dataKey: 172.16.255.15-cpp-period-1min
                    cpp-num: '0'
                    vdevice-name: 172.16.255.15
                    total-output-pkts: '25'
                    total-output-bytes: '48896'
                    lastupdated: 1701518800889
                    total-input-pkts: '30'
                    dp-stats-load: '1'
                    vdevice-host-name: vm5
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Policy-read,Policy-write,System-read,System-write,Security-read,Security-write
  /device/qfp/memstat:
    get:
      tags:
      - Real-Time Monitoring - QFP
      description: Get QFP memory status
      operationId: memstat
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  dramFree:
                    type: integer
                    format: int32
                    example: 135600128
                  dramInUse:
                    type: integer
                    format: int32
                    example: 132835328
                  dramLowestFreeWaterMark:
                    type: integer
                    format: int32
                    example: 135600128
                  dramTotal:
                    type: integer
                    format: int32
                    example: 268435456
                  iramFree:
                    type: integer
                    format: int32
                    example: 1885184
                  iramInUse:
                    type: integer
                    format: int32
                    example: 211968
                  iramLowestFreeWaterMark:
                    type: integer
                    format: int32
                    example: 1885184
                  iramTotal:
                    type: integer
                    format: int32
                    example: 2097152
                  lastupdated:
                    type: integer
                    format: int32
                    example: 170151880
                  sramFree:
                    type: integer
                    format: int32
                    example: 0
                  sramInUse:
                    type: integer
                    format: int32
                    example: 0
                  sramLowestFreeWaterMark:
                    type: integer
                    format: int32
                    example: 0
                  sramTotal:
                    type: integer
                    format: int32
                    example: 0
                  vdevice-dataKey:
                    type: string
                    example: 172.16.255.15-cpp-period-1min
                  vdevice-host-name:
                    type: string
                    example: vm5
                  vdevice-name:
                    type: string
                    example: 172.16.255.15
                $$ref: '#/components/schemas/QfpMemoryState'
              examples:
                QFP memory status:
                  description: QFP memory status
                  value:
                  - iramInUse: 211968
                    sramFree: 0
                    vdevice-name: 172.16.255.15
                    dramFree: 135600128
                    iramTotal: 2097152
                    iramFree: 1885184
                    iramLowestFreeWaterMark: 1885184
                    dramLowestFreeWaterMark: 135600128
                    sramTotal: 0
                    vdevice-host-name: vm5
                    sramInUse: 0
                    sramLowestFreeWaterMark: 0
                    vdevice-dataKey: 172.16.255.15
                    lastupdated: 1701517192456
                    dramTotal: 268435456
                    dramInUse: 132835328
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: System-read,System-write
