paths:
  /device/cedgecflowd/app-fwd-cflowd-flows:
    get:
      tags:
      - Monitoring - Cedge Cflowd
      description: Get list of app fwd cflowd flows from device
      operationId: createAppFwdCflowdFlowsList
      parameters:
      - name: deviceId
        in: query
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
      - name: vpn-id
        in: query
        schema:
          maximum: 512
          minimum: 0
          type: integer
          format: int32
      - name: src-addr
        in: query
        schema:
          type: string
      - name: dst-addr
        in: query
        schema:
          type: string
      - name: app
        in: query
        schema:
          type: string
      - name: family
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
