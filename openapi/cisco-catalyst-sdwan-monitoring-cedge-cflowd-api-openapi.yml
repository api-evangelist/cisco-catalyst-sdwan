      - name: src-addr
        in: query
        schema:
          type: string
      - name: dst-addr
        in: query
        schema:
          type: string
      - name: app
        in: query
        schema:
          type: string
      - name: family
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
