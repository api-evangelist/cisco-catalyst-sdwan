  /device/redundancy-group/app-group:
    get:
      tags:
      - Monitoring - Cedge Cflowd
      description: Get Redundancy Group Information
      operationId: getRedundancyGroupAppGroup
      parameters:
      - name: deviceId
        in: query
        required: true
        schema:
          type: object
          properties:
            deviceIp:
              type: string
          description: This is the valid DeviceIP
          $$ref: '#/components/schemas/DeviceIP'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
