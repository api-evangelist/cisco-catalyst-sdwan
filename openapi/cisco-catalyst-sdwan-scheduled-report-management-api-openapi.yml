                    format: int64
                    example: 1655991420000
                  onVmanage:
                    type: string
                    description: vManage which scheduled report generating tasks
                    example: 10.1.1.100
                  reportConfig:
                    required:
                    - emailRecipient
                    - reportName
                    - scheduleConfig
                    type: object
                    properties:
                      analyticsReport:
                        type: boolean
                      analyticsScope:
                        type: string
                      analyticsTemplateName:
                        type: string
                      analyticsTemplateType:
                        type: string
                      businessHours:
                        required:
                        - endTime
