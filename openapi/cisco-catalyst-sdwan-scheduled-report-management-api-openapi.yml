paths:
  /v1/reports:
    get:
      tags:
      - Scheduled Report Management
      summary: Get all report templates information
      description: Get all reports information
      operationId: getAllReportTemplates
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                required:
                - reports
                type: object
                properties:
                  header:
                    type: object
                    additionalProperties:
                      type: object
                  reports:
                    type: array
                    description: Report List
                    items:
                      required:
                      - businessHours
                      - fileType
                      - hasTask
                      - nextRunTime
                      - onVmanage
                      - reportId
                      - reportName
                      - reportStatus
                      - schedule
                      - taskNum
                      - templateType
                      - timeFrame
                      type: object
                      properties:
                        businessHours:
                          type: string
                        emailRecipient:
                          type: array
                          description: Email address list to receive the report files
                          example:
                          - alice@cisco.com
                          - bob@google.com
                          items:
                            type: string
                            description: Email address list to receive the report files
                            example:
                            - alice@cisco.com
                            - bob@google.com
                        fileType:
                          type: string
                        hasTask:
                          type: boolean
                          description: If the report template has running task records or not
                          example: true
                        nextRunTime:
                          type: integer
                          description: Report next running timestamp
                          format: int64
                          example: 1655991420000
                        onVmanage:
                          type: string
                          description: vManage which scheduled report generating tasks
                          example: 10.1.1.100
                        reportId:
                          type: string
                          description: The report UUID for report template
                          format: uuid
                          example: 50671437-c88e-4514-aafa-103e58c4d9cc
                        reportName:
                          type: string
                          description: The report template name
                          example: Daily-report
                        reportStatus:
                          type: string
                          description: Report schedule status(not_scheduled/scheduled/in_progress/completed/failed))
                          example: in_progress
                          enum:
                          - not_scheduled
                          - scheduled
                          - in_progress
                          - completed
                          - failed
                        schedule:
                          type: string
                          description: Report schedule information
                          example: Daily
                        taskNum:
                          type: integer
                          description: The number of scheduled tasks for report template
                          format: int64
                          example: 10
                        templateType:
                          type: string
                        timeFrame:
                          type: string
                          description: Report time frame(7 Days/30 Days)
                          example: 7 Days
