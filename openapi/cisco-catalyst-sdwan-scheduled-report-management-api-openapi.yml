                          description: Report name for task
                          example: SJC site summary report-20220916-123123
                        schedule:
                          type: string
                          description: Report schedule information
                          example: Daily
                        startTime:
                          type: integer
                          description: Report task start timestamp
                          format: int64
                          example: 1656677463859
                        taskId:
                          type: string
                          description: Task UUID
                          format: uuid
                          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                        taskStatus:
                          type: string
