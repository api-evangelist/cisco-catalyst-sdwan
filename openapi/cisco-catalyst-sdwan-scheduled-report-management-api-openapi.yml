                        type: object
                        properties:
                          endTime:
                            pattern: ^(20|21|22|23|[0-1]?\d):[0-5]?\d:[0-5]?\d$
                            type: string
                          startTime:
                            pattern: ^(20|21|22|23|[0-1]?\d):[0-5]?\d:[0-5]?\d$
                            type: string
                        description: Report business hours for data generating
                        $$ref: '#/components/schemas/ReportBusinessHours'
                      emailRecipient:
                        maxItems: 5
                        minItems: 0
                        type: array
                        description: Email address list to receive the report files
                        example:
                        - alice@cisco.com
                        - bob@google.com
                        items:
                          type: string
                          description: Email address list to receive the report files
                          example:
                          - alice@cisco.com
                          - bob@google.com
                      fileType:
                        type: string
                        enum:
                        - pdf
                        - csv
                      reportName:
                        maxLength: 32
                        minLength: 1
                        pattern: (?=^.{1,32}$)[^&<>! "]+$
                        type: string
                        description: Report Name
                        example: ExecutiveSummaryReport
                      scheduleConfig:
                        required:
                        - scheduleType
                        type: object
                        properties:
                          scheduleType:
                            type: string
                            description: Schedule type
                            example: on_demand
                            enum:
                            - on_demand
                            - reoccur_onetime
                            - reoccur_daily
                            - reoccur_weekly
                            - reoccur_monthly
                        description: schedule config
                        discriminator:
                          propertyName: scheduleType
                        oneOf:
                        - $ref: '#/components/schemas/OnDemandSchedule'
                        - $ref: '#/components/schemas/OneTimeSchedule'
                        - $ref: '#/components/schemas/ReoccurDailySchedule'
                        - $ref: '#/components/schemas/ReoccurWeeklySchedule'
                        - $ref: '#/components/schemas/ReoccurMonthlySchedule'
                        $$ref: '#/components/schemas/ScheduleConfig'
                      siteIds:
                        type: array
                        description: Filtering by Site ID list is optional, if no site Id is included, all site ID will be used for report generating.
                        example:
                        - 100
                        - 200
                        items:
                          type: integer
                          format: int64
                      templateType:
                        type: string
                        enum:
                        - executive_summary
                        - site_availability
                        - link_availability
                        - link_utilization
                        - link_sla
                        - app_usage
                        - ips_events_collected
                        - firewall_enforcement
                        - malware_files_collected
                        - internet_browsing
                        - license_management
                        - cpu_memory_energy
                        - energy_management
                      timeRange:
                        type: string
                        description: Time range for report(one_week/one_month)
                        example: one_week
                        enum:
                        - one_day
                        - one_week
                        - one_month
                    description: Executive summary report template
                    $$ref: '#/components/schemas/ExecutiveSummaryReport'
                  reportId:
                    type: string
                    description: The report UUID for report template
                    format: uuid
                    example: 50671437-c88e-4514-aafa-103e58c4d9cc
                  reportStatus:
                    type: string
                    description: Report schedule status(not_scheduled/scheduled/in_progress/completed/failed))
                    example: in_progress
                    enum:
                    - not_scheduled
                    - scheduled
                    - in_progress
                    - completed
                    - failed
                  taskNum:
                    type: integer
                    format: int64
                  templateType:
                    type: string
                    enum:
                    - executive_summary
                    - site_availability
                    - link_availability
                    - link_utilization
                    - link_sla
                    - app_usage
                    - ips_events_collected
                    - firewall_enforcement
                    - malware_files_collected
                    - internet_browsing
                    - license_management
                    - cpu_memory_energy
                    - energy_management
                description: Report Template detail info
                $$ref: '#/components/schemas/ReportInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    required:
