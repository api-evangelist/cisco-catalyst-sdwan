                            example:
                            - alice@cisco.com
                        endTime:
                          type: integer
                          description: Report task end timestamp
                          format: int64
                          example: 1656677563859
                        fileType:
                          type: string
                          description: Report file type
                          example: pdf
                        followerVmanages:
                          type: array
                          description: In Cluster deployment, the follower vManage IP address which needs to replicate the report file from source vManage which generated the report file.
                          example:
                          - 10.0.105.38
                          - 10.0.105.39
                          items:
                            type: string
                            description: In Cluster deployment, the follower vManage IP address which needs to replicate the report file from source vManage which generated the report file.
                            example:
                            - 10.0.105.38
                            - 10.0.105.39
                        onVmanage:
                          type: string
                          description: IP address of the source vManage which is scheduled to generate report file. Default value is "localhost" for single node vManage deployment.
                          example: 10.0.105.32
