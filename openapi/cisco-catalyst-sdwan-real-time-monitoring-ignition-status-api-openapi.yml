paths:
  /device/ignition/status:
    get:
      tags:
      - Real-Time Monitoring - Ignition Status
      description: Get Ignition Status Information
      operationId: getIgnitionStatus
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                Ignition Status:
                  description: Ignition Status
                  value:
                    data:
                    - vdevice-name: 172.16.255.15
                      vdevice-host-name: pm5
                      lastupdated: 1717400936511
                      ignition-mgmt: Enabled
                      input-volt: 23.45 V
                      pwr-state: Bootloader
                      undervoltage: 16.45 V
                      overvoltage: 31.52 V
                      battery-type: 12v
                      sense: Enabled
                      shutdown-time: 14 s
                      undervoltage-time-delay: 14 s
                      overvoltage-time-delay: 14 s
                      ignition-off-time-delay: 14 s
                      sense-on-threshold: 31.52 V
                      sense-off-threshold: 31.52 V
                      vdevice-dataKey: 172.16.255.15-1
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: System-read,System-write
