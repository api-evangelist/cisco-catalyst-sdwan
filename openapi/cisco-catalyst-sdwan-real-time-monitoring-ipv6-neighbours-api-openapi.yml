paths:
  /device/ndv6:
    get:
      tags:
      - Real-Time Monitoring - IPv6 Neighbours
      description: Get IPv6 Neighbors from device (Real Time)
      operationId: getIpv6Interface
      parameters:
      - name: vpn-id
        in: query
        description: VPN Id
        schema:
          type: string
          enum:
          - '0'
          - '512'
      - name: if-name
        in: query
        description: Interface name
        schema:
          type: string
          enum:
          - ge0/0
          - ge0/1
          - ge0/2
          - ge0/3
          - ge0/4
          - ge0/5
          - ge0/6
          - ge0/7
          - system
          - eth0
      - name: mac
        in: query
        description: Mac address
        schema:
          type: string
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
