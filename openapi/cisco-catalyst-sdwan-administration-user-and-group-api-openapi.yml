                      $$ref: '#/components/schemas/ControlComponentAaaRadiusServer'
                  timeout:
                    maximum: 1000
                    minimum: 1
                    type: integer
                    description: Configure how long to wait for replies from the RADIUS server
                    format: int32
                    example: 5
                    default: 5
                description: Radius configuration
                $$ref: '#/components/schemas/Radius'
              examples:
