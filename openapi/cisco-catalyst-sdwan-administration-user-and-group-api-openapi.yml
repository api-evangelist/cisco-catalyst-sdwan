                          type: string
                          description: Set IP address of RADIUS server
                          example: 1.2.2.2
                        authPort:
                          maximum: 65535
                          minimum: 0
                          type: integer
                          description: Authentication Port
                          format: int32
                          example: 1812
                          default: 1812
                        priority:
                          maximum: 7
                          minimum: 0
                          type: integer
                          description: Priority
                          format: int32
                          example: 1
                          default: 0
                        secretKey:
                          pattern: ^(?:\$CRYPT\$.{17}|(?!(?:\$CRYPT\$)).{1,128})$
                          type: string
                          description: Secret key
                          example: password
                        tag:
                          maxLength: 16
                          minLength: 4
                          pattern: ^[a-zA-Z0-9\-_]*$
                          type: string
                          description: Reference tag/name for the server
                          example: radius-server1
                        vpn:
                          type: integer
                          description: VPN ID
                          format: int32
                          example: 0
                          enum:
                          - 0
                          - 512
                          default: 0
