                  value:
                    timeout: 5
                    retransmit: 3
                    server:
                    - address: 192.168.1.100
                      authPort: 1812
                      acctPort: 1813
                      sourceVpn: 0
                      vpn: 0
                      vpnIpSubnet: 192.168.1.0/24
                      key: radius-key
                      secretKey: shared-secret
