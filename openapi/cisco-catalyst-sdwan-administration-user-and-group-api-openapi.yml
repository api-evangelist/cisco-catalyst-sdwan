                authOrder:
                  maxItems: 3
                  minItems: 1
                  type: array
                  description: Ordered list of authentication methods to be used for user login (e.g., local, radius, tacacs). Minimum 1, maximum 3 authentication methods allowed.
                  items:
                    type: string
                    description: Ordered list of authentication methods to be used for user login (e.g., local, radius, tacacs). Minimum 1, maximum 3 authentication methods allowed.
