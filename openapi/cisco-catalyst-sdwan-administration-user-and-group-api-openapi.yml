                description: AAA Configuration Update
                value:
                  authOrder:
                  - radius
                  - tacacs
                  - local
                  authFallback: true
                  adminAuthOrder: true
                  auditDisable: false
                  accounting: true
        required: true
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
