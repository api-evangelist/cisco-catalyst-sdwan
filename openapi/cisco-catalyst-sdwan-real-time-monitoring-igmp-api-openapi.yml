  /device/igmp/groups:
    get:
      tags:
      - Real-Time Monitoring - IGMP
      description: Get IGMP neighbor list from device
      operationId: createIGMPGroupsList
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                IGMP neighbor:
                  description: IGMP neighbor
                  value:
                    data:
                    - if-name: ge0/0
                      v1-members-present: 'false'
                      vdevice-dataKey: 169.254.10.10
                      vdevice-name: 169.254.10.10
                      lastupdated: 1643076514019
                      state: members-present
                      vpn-id: '10'
                      event: init-event
                      vdevice-host-name: vm3
                      group: 225.225.0.1
