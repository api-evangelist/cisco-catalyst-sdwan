  /device/utd/dataplane-config:
    get:
      tags:
      - Real-Time Monitoring - UTD
      description: Get data plane config from Device
      operationId: getUTDDataplaneConfig
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                UTD data plane config:
                  description: UTD data plane config
                  value:
                    data:
                    - sn-redirect: fail-open
                      vdevice-name: 172.16.255.15
                      context-flag: '8847361'
                      defense-mode: IPS
                      context-id: '0'
                      redirect-type: divert
                      vdevice-host-name: vm5
                      vdevice-dataKey: 172.16.255.15-0
                      threat-inspection: enabled
                      engine: Standard
                      domain-filtering: not-enabled
                      url-filtering: not-enabled
                      lastupdated: 1659514008513
                      state: enabled
                      all-interface: enabled
                    - sn-redirect: fail-open
                      vdevice-name: 172.16.255.15
                      context-flag: '13041665'
                      defense-mode: IPS
                      context-id: '3'
                      redirect-type: divert
