paths:
  /statistics/cryptovpn/common:
    post:
      tags:
      - Monitoring - Crypto VPN
      summary: crypto vpn common data
      description: 'Get crypto vpn common data '
      operationId: getPostCryptoDataByQuery
      requestBody:
        description: Stats query string
        content:
          application/json:
            schema:
              type: object
            examples:
              crypto common query:
                description: crypto common query
                value:
                  aggregation:
                    field:
                    - property: host_name
                      sequence: 1
                    metrics:
                    - property: entry_time
                      type: top_hits
                      size: 1
                  query:
                    condition: AND
                    rules:
                    - value:
                      - '24'
                      field: entry_time
                      type: date
                      operator: last_n_hours
                $$ref: '#/components/examples/ComViptelaVmanageServerDeviceCryptoParameterExampleCrypto'
        required: true
      responses:
        '200':
          description: search results matching criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad Request
      x-roles-required: Device Monitoring-read,Device Monitoring-write
  /statistics/cryptovpn/dmvpn:
    post:
      tags:
      - Monitoring - Crypto VPN
      summary: crypto vpn dmvpn data
      description: 'Get crypto vpn dmvpn data '
      operationId: getPostCryptoDMVPNDataByQuery
      requestBody:
        description: Stats query string
        content:
          application/json:
            schema:
              type: object
            examples:
              crypto dmvpn query:
                description: crypto dmvpn query
                value:
                  aggregation:
                    field:
                    - property: idb
                      sequence: 1
                    - property: nhs_ip
                      sequence: 1
                    metrics:
                    - property: entry_time
                      type: top_hits
                      size: 1
                  query:
                    condition: AND
                    rules:
                    - value:
                      - '24'
                      field: entry_time
                      type: date
                      operator: last_n_hours
                    - value:
                      - vm1
                      field: host_name
                      type: string
                      operator: in
                $$ref: '#/components/examples/ComViptelaVmanageServerDeviceCryptoParameterExampleCryptodmvpn'
        required: true
      responses:
        '200':
          description: search results matching criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad Request
      x-roles-required: Device Monitoring-read,Device Monitoring-write
