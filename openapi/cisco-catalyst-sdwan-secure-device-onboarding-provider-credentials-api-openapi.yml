                    - authMethod
                    - commPlan
                    - pdnType
                    - ratePlan
                    type: object
                    properties:
                      apn:
                        maxLength: 2147483647
                        minLength: 1
                        type: string
                        description: Access Point Name
                        example: 103334b644
                      authMethod:
                        maxLength: 2147483647
                        minLength: 1
