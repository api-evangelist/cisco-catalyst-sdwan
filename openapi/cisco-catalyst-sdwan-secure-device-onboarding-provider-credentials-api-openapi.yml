                        minLength: 1
                        type: string
                        description: Name of the communication plan associated with default provider.
                        example: vm cp sms data shared
                      password:
                        type: string
                        description: Password of the user.
                        example: admin123
                      pdnType:
                        maxLength: 2147483647
                        minLength: 1
                        pattern: (^IPv4$|^IPv6$|^IPv4v6$)
                        type: string
                        description: Data packet protocol version
                        example: IPv4
                      ratePlan:
                        maxLength: 2147483647
                        minLength: 1
                        type: string
                        description: Name of the rate plan associated with default provider.
                        example: vm fixed pool rp
                      user:
                        type: string
                        description: User name.
                        example: admin
                    $$ref: '#/components/schemas/AccountData'
                  accountId:
                    type: string
                    description: ' ID  of the account associated with user using provider service.'
                    example: '100025578'
                  accountUserName:
                    maxLength: 2147483647
                    minLength: 1
                    type: string
                    description: Name of the user registered to  the service.
                    example: JaneDoe
                  apiKey:
                    maxLength: 2147483647
                    minLength: 1
                    type: string
                    description: API key for the provider service.
                    example: 1d6fa2f9-5a7d-4af8-8ab5-4056f631
                  carrierName:
                    maxLength: 2147483647
                    minLength: 1
                    type: string
                    description: Name of the service provider.
                    example: Singtel
                  isDefault:
                    type: boolean
                    description: Boolean value which indicates whether the provider is the default provider .
                $$ref: '#/components/schemas/ProviderAccountDetails'
