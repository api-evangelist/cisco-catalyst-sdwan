                  value: "[{\n    \"iccid\": \"8988216716970004975\",\n    \"carrierName\": \"Singtel\",\n    \"ratePlan\":\"hphlr rp1\" ,\n    \"communicationPlan\": \"vm cp sms data shared\",\n    \"ratePlanType\":\"Monthly - Pooled Subscriber\",\n    \"currentDataUsage\":\"10MB\",\n      \"ratePlanUsageLimit\": \"50MB\",\n      \"otherEsimsDataUsage\": \"20MB\",\n    }]"
