        description: Create Provider Credentials
        content:
          application/json:
            schema:
              type: object
            examples:
              Service  Provider Credentials:
                description: Service  Provider Credentials
                value:
                  carrierName: Singtel
                  accountId: '100023372'
                  accountUserName: testaa
                  apiKey: d6fa2f9-5a7d-4af8-8ab5-4056f631
