paths:
  /device/lacp/info:
    get:
      tags:
      - Real-Time Monitoring - Lacp
      description: Get device lacp port channel info list (Real Time)
      operationId: getLacpInterfaceList
      parameters:
      - name: channel-group
        in: query
        description: Channel-group
        schema:
          type: string
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                Device lacp info:
                  description: Device lacp info
                  value:
                    data:
                    - ayer-type: l3-etherchannel
                      vdevice-name: 10.0.0.121
                      channel-group: '1'
                      vdevice-host-name: ISR4451-X
                      total-no-of-links-bundled: 2
                      total-no-of-links-standby: 0
                      total-no-of-links-down: 0
                      vdevice-dataKey: 10.0.0.121-1
                      total-no-of-links: 2
                      port-channel-up: 'true'
                      lastupdated: 1650883014316
                      total-no-of-links-suspended: '0'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Interface-read,Interface-write
