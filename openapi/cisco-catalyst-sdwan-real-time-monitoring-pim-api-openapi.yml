paths:
  /device/pim/interface:
    get:
      tags:
      - Real-Time Monitoring - PIM
      description: Get PIM interface list from device
      operationId: createPIMInterfaceList
      parameters:
      - name: deviceId
        in: query
        description: deviceId - Device IP
        required: true
        schema:
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?).){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$
          type: string
          example: 169.254.10.10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                PIM interface list:
                  description: PIM interface list
                  value:
                    data:
                    - if-name: ge0/0
                      dr-address: 100.100.3.101
                      vdevice-dataKey: 169.254.10.10
                      vdevice-name: 169.254.10.10
                      if-addr: 100.100.3.101/24
                      neighbor-count: 0
                      hello-interval: 30
                      lastupdated: 1643258686605
                      join-prune-interval: 60
                      vpn-id: '10'
                      priority: 1
                      vdevice-host-name: vm3
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      x-roles-required: Routing-read,Routing-write
