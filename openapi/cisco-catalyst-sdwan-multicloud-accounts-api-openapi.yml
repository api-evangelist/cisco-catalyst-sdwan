    post:
      tags:
      - MultiCloud - Accounts
      description: Add Cloud Account
      operationId: validateAccountAdd
      requestBody:
        description: Payloads for updating Cloud Gateway based on CloudType
        content:
          application/json:
            schema:
              required:
              - accountName
              - azureCredentials
              - cloudType
              - gcpCredentials
              type: object
              properties:
                accountId:
                  type: string
                accountName:
                  maxLength: 255
                  minLength: 1
                  type: string
                awsIamCredentials:
                  required:
                  - externalId
                  - roleArn
                  type: object
                  properties:
                    externalId:
                      type: string
                    roleArn:
                      type: string
                  $$ref: '#/components/schemas/AwsIamCredentials'
                awsKeyCredentials:
                  required:
                  - apiKey
                  - secretKey
                  type: object
                  properties:
                    apiKey:
                      type: string
                    secretKey:
                      type: string
                  $$ref: '#/components/schemas/AwsKeyCredentials'
                azureCredentials:
                  required:
                  - clientId
                  - cloudTenantId
                  - secretKey
                  type: object
                  properties:
                    clientId:
                      pattern: ^[a-zA-Z0-9\-]*$
                      type: string
                    cloudTenantId:
                      pattern: ^[a-zA-Z0-9\-]*$
                      type: string
                    secretKey:
                      type: string
                    subscriptionId:
                      pattern: ^[a-zA-Z0-9\-]*$
                      type: string
                  $$ref: '#/components/schemas/AzureCredentials'
                cloudGatewayEnabled:
                  pattern: ^(true|false)$
                  type: string
                cloudType:
                  type: string
                description:
                  maxLength: 1024
                  minLength: 0
                  pattern: ^[a-zA-Z0-9_./\-\s]*$
                  type: string
                discoverAllVnetsInTenantEnabled:
                  pattern: ^(true|false)$
                  type: string
                gcpBillingId:
                  pattern: ^[a-zA-Z0-9_./\-\s]+$
                  type: string
                gcpCredentials:
                  required:
                  - auth_provider_x509_cert_url
                  - auth_uri
                  - client_email
                  - client_id
                  - client_x509_cert_url
                  - private_key
                  - private_key_id
                  - project_id
                  - token_uri
                  - type
                  type: object
                  properties:
                    auth_provider_x509_cert_url:
                      type: string
                    auth_uri:
                      type: string
                    client_email:
                      type: string
                    client_id:
                      type: string
                    client_x509_cert_url:
                      type: string
                    private_key:
                      type: string
                    private_key_id:
                      type: string
                    project_id:
                      type: string
                    token_uri:
                      type: string
                    type:
                      type: string
                  $$ref: '#/components/schemas/GcpCredentials'
                kubernetesDiscoveryEnabled:
                  pattern: ^(true|false)$
                  type: string
                serviceDiscoveryEnabled:
                  pattern: ^(true|false)$
                  type: string
              $$ref: '#/components/schemas/PostAccounts'
            examples:
              GCP Add Account request:
                description: GCP Add Account request
                value:
                - accountName: pp-gcp
                  cloudGatewayEnabled: true
                  cloudType: GCP
                  description: pp-test
                  gcpCredentials:
                    value:
                      auth_provider_x509_cert_url: https://www.googleapis.com/test
                      auth_uri: https://accounts.google.com/test
                      client_email: gcp-pp@gcp.com
                      client_id: '1234'
                      client_x509_cert_url: https://www.googleapis.com/test
                      private_key: REDACTED_PRIVATE_KEY_EXAMPLE
                      private_key_id: '45678'
                      project_id: gcp-ppp-21471
                      token_uri: https://oauth2.googleapis.com/test
                      type: service_account
                  serviceDiscoveryEnabled: false
              AWS Iam/AWS Iam GovCloud Add Account request:
                description: AWS Iam/AWS Iam GovCloud Add Account request
                value:
                - cloudType: AWS
                  accountName: aws_acct_102
                  description: aws_acct_102 desc
                  awsIamCredentials:
                    roleArn: arn101
                    externalId: ext101
              AWS key/AWS key GovCloud Add Account request:
                description: AWS key/AWS key GovCloud Add Account request
                value:
                - cloudType: AWS
                  accountName: aws_acct_102
                  description: aws_acct_102 desc
                  awsKeyCredentials:
                    apiKey: key102
                    secretKey: skey102
                  cloudGatewayEnabled: 'true'
              Azure/Azure GovCloud Add Account request:
                description: Azure/Azure GovCloud Add Account request
                value:
                - cloudType: AZURE
                  accountName: azure_acct_102
                  description: azure_acct_102 desc
                  azureCredentials:
                    subscriptionId: sub103
                    secretKey: skey103
                    clientId: clientid103
                    cloudTenantId: clienttenant103
                  cloudGatewayEnabled: 'true'
                  azO365Enabled: 'true'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                  accountName:
                    type: string
                  cloudType:
                    type: string
