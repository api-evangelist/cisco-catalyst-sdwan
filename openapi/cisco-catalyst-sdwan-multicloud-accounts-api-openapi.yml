          pattern: ^(true|false)$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    accountId:
                      type: string
                    accountName:
                      type: string
                    clientEmail:
                      type: string
                    cloudGatewayEnabled:
