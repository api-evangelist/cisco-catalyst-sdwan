- url: /dataservice
tags:
- name: Configuration - Configuration Group
paths:
  /v1/config-group:
    get:
      tags:
      - Configuration - Configuration Group
      description: Get a Configuration Group by Solution
      operationId: GetConfigGroupBySolution
      parameters:
      - name: solution
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          pattern: ^[^&<>! "]{1,128}$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  required:
                  - name
                  - solution
                  - state
                  - version
                  type: object
                  properties:
                    copyInfo:
                      type: string
                    createdBy:
                      type: string
                      description: User who last created this.
                      readOnly: true
                    createdOn:
                      type: integer
                      description: Timestamp of creation
                      format: int64
                      readOnly: true
                    description:
                      type: string
                      description: Description of the  Group.
                      example: group for west coast retail stores
                    devices:
                      uniqueItems: true
                      type: array
                      items:
                        type: string
                    fullConfigCli:
                      type: boolean
                    id:
                      type: string
                      description: System generated unique identifier of the  Group in UUID format.
                      example: 6fa14197-c25f-4a14-b81b-299de32ed2ca
                    iosConfigCli:
                      type: boolean
                    lastUpdatedBy:
                      type: string
                      description: User who last updated this.
                      readOnly: true
                    lastUpdatedOn:
                      type: integer
                      description: Timestamp of last update
                      format: int64
                      readOnly: true
                    name:
                      type: string
                      description: Name of the  Group. Must be unique.
                      example: West coast retail stores
                    numberOfDevices:
                      type: integer
                      format: int64
                    numberOfDevicesUpToDate:
                      type: integer
                      format: int64
                    origin:
                      type: string
                    originInfo:
                      type: object
                      additionalProperties:
                        type: string
                    profiles:
                      type: array
                      description: List of devices UUIDs associated with this group
                      example:
                      - id: 6fa14197-c25f-4a14-b81b-299de32ed2ca
                        name: system feature profile
                        solution: sdwan
                        type: system
                        description: Profile file description
                        lastUpdatedBy: admin
                        lastUpdatedOn: 1694179200000
                        createdBy: admin
                        createdOn: 1694092800000
                        profileParcelCount: 5
                        origin: internal
                      items:
                        required:
                        - name
                        - solution
                        - type
                        type: object
                        properties:
                          createdBy:
                            type: string
                            description: User who last created this.
                            readOnly: true
                          createdOn:
                            type: integer
                            description: Timestamp of creation
                            format: int64
                            readOnly: true
                          description:
                            type: string
                            description: Description of the feature Profile.
                            example: Profile file description
                          id:
                            type: string
                            description: System generated unique identifier of the feature profile in UUID format.
                            example: 6fa14197-c25f-4a14-b81b-299de32ed2ca
                          lastUpdatedBy:
                            type: string
                            description: User who last updated this.
                            readOnly: true
                          lastUpdatedOn:
                            type: integer
                            description: Timestamp of last update
                            format: int64
                            readOnly: true
                          name:
                            type: string
                            description: Name of the feature Profile. Must be unique.
                            example: system feature profile
                          origin:
                            type: string
                          profileParcelCount:
                            type: integer
                            description: Number of Parcels attached with Feature Profile
                            format: int64
                            readOnly: true
                          solution:
                            type: string
                            description: Solution of the feature Profile.
                            example: sdwan
                          type:
                            type: string
                            description: Type of the feature Profile.
                            example: system
