                  solution: mobility
                $$ref: '#/components/examples/ConfiggroupCommonPostRequest_AON-ConfigGroup1-SF'
              CEDGE-ConfigGroup2-DualDeviceSiteDeployment:
                value:
                  name: CEDGE-ConfigGroup2-DualDeviceSiteDeployment
