paths:
  /multicloud/audit:
    post:
      tags:
      - MultiCloud - General
      description: Call an audit
      operationId: audit
      requestBody:
        description: Audit
        content:
          application/json:
            schema:
              required:
              - cloudType
              type: object
              properties:
                cloudType:
                  pattern: ^[a-zA-Z_]+$
                  type: string
                issuesToSync:
                  maxItems: 2147483647
                  minItems: 1
                  type: array
                  items:
                    required:
                    - name
                    - region
                    - reportType
                    type: object
                    properties:
                      name:
                        type: string
                      region:
                        pattern: ^[a-zA-Z0-9_./\-]+$
                        type: string
                      reportType:
                        type: string
                    $$ref: '#/components/schemas/AuditFixIssuesToSync'
                region:
                  pattern: ^[a-zA-Z0-9_./\-]+$
                  type: string
              $$ref: '#/components/schemas/AuditFix'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 6c723f65-9106-4f43-9d2b-a033a39353b3
                description: Task id for polling status
                $$ref: '#/components/schemas/Taskid'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
    get:
      tags:
      - MultiCloud - General
      description: Call an audit with dry run
      operationId: auditDryRun
      parameters:
      - name: cloudType
        in: query
        required: true
        schema:
          type: string
          enum:
          - AWS
          - AWS_GOVCLOUD
          - AZURE
          - AZURE_GOVCLOUD
          - GCP
      - name: cloudRegion
        in: query
        schema:
          pattern: ^[a-zA-Z0-9_./\-]+$
          type: string
      - name: refresh
        in: query
        schema:
          pattern: ^(true|false)$
          type: string
          default: 'true'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
              examples:
                In Sync:
                  description: In Sync
                  value:
                    auditStatus: IN_SYNC
                    canFix: true
                    auditReport: []
                Out Of Sync:
                  description: Out Of Sync
                  value:
                    auditStatus: OUT_OF_SYNC
                    canFix: true
                    auditReport:
                    - status: IN_SYNC
                      reportType: GCR
                      region: us-west1
                      name: S2C_GCR
                      details: []
                    - status: IN_SYNC
                      reportType: GCR
                      region: us-west1
                      name: S2S_GCR
                      details: []
                    - status: IN_SYNC
                      reportType: CGW_ROUTER
                      region: global
                      details: []
                    - status: IN_SYNC
                      reportType: HOSTVPC
                      region: global
                      details: []
                    - status: IN_SYNC
                      reportType: NCC_HUB
                      region: global
                      name: s2c-hub
                      details: []
                    - status: OUT_OF_SYNC_DRY_RUN
                      reportType: NCC_HUB
                      region: global
                      name: s2s-hub
                      details:
                      - Spoke s2s-spoke in region us-west1 is missing.
                    - status: IN_SYNC
                      reportType: MAPPING
                      details: []
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
