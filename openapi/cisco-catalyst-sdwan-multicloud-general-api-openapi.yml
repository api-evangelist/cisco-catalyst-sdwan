  /multicloud/sshkeys:
    get:
      tags:
      - MultiCloud - General
      description: Get ssh keyList for cloud type
      operationId: getSshKeyList
      parameters:
      - name: cloudType
        in: query
        required: true
        schema:
          pattern: ^[a-zA-Z_]+$
          type: string
      - name: accountId
        in: query
        required: true
        schema:
          pattern: ^\d+$
          type: string
      - name: cloudRegion
        in: query
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_./\-]+$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sshKeyName:
                      type: string
                  $$ref: '#/components/schemas/SshKeyList'
