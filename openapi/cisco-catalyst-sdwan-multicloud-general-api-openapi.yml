                    cgwSitesStatus:
                      type: object
                      properties:
                        count:
                          type: number
                        name:
                          type: string
                        statusList:
                          type: array
                          items:
                            type: object
                            properties:
                              count:
                                type: number
                              message:
                                type: string
                              name:
                                type: string
                              status:
                                type: string
                            $$ref: '#/components/schemas/WidgetStatusStatusList'
                      $$ref: '#/components/schemas/WidgetStatus'
                    cgwStatus:
                      type: object
