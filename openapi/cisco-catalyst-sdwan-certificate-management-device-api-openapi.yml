paths:
  /certificate/autorenewal/allowed:
    get:
      tags:
      - Certificate Management - Device
      summary: Auto renewal allowed
      description: Auto renewal allowed
      operationId: getCertAutoRenewalAllowed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
              examples:
                Autorenewal Status:
                  description: Autorenewal Status
                  value:
                    data:
                    - deviceType: controller
                      certType: pki
                      auto-renew: true
                      reason: ''
                    - deviceType: hardwareEdge
                      certType: onbox
                      auto-renew: false
                      reason: not valid for onbox
                    - deviceType: softwareEdge
                      certType: pki
                      auto-renew: false
                      reason: pki server not reachable
                  $$ref: '#/components/examples/ComViptelaVmanageServerCertificateapiResponseExampleGetcertautorenewalallowedresponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
