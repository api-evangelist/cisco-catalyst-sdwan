  /certificate/csr/details:
    get:
      tags:
      - Certificate Management - Device
      summary: Get CSR detail view
      description: Get CSR detail view
      operationId: getCSRViewRightMenus
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
              examples:
                CSR Details:
                  description: CSR Details
                  value:
                    header: {}
                    data:
                    - name: View CSR
                      type: certificate
                      subtype: view
                      attributes: CSRDetail
                      newWindow: true
                      multiSelect: false
                    - name: View Certificate
                      type: certificate
                      subtype: viewCrt
                      attributes: certificate
                      newWindow: true
                      multiSelect: false
                    - name: Generate CSR
                      type: certificate
                      subtype: generate
                      attributes: deviceIP
                      newWindow: false
                      multiSelect: false
                      uri: dataservice/certificate/generate/csr
                    - name: Reset RSA
                      type: certificate
                      subtype: reset
                      attributes: deviceIP
                      newWindow: false
                      multiSelect: false
                      uri: dataservice/certificate/regenerate/csr
                    - name: Edit
                      type: certificate
                      subtype: edit
                      attributes: deviceIP,username,password
                      newWindow: false
                      multiSelect: false
                      uri: dataservice/certificate/configuration
                    - name: Invalid
                      type: certificate
                      subtype: delete
                      attributes: deviceIP
                      newWindow: false
                      multiSelect: false
                      uri: dataservice/certificate/configuration
                  $$ref: '#/components/examples/ComViptelaVmanageServerCertificateapiResponseExampleGetcsrdetailsresponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
