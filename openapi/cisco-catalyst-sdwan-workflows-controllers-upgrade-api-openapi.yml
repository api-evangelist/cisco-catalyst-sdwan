  /v1/controllers-upgrade/version-compliance-info:
    get:
      tags:
      - Workflows - Controllers Upgrade
      summary: Get version compliance across tenants.
      description: Returns compliance information for the specified version of Controllers upgrade across all tenants.
      operationId: getVersionComplianceInfo
      parameters:
      - name: version
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response with compliance information for the specified version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  minimumControllerCompatibleVersion:
                    type: string
                    description: Minimum compatible controller version
                  minimumDeviceCompatibleVersion:
                    type: string
                    description: Minimum compatible device version
                  minimumValidatorCompatibleVersion:
                    type: string
                    description: Minimum compatible validator version
                  nearNonCompliantDeviceCount:
                    type: integer
                    description: Count of devices approaching non-compliance
                    format: int32
                  nonCompliantControllersCount:
                    type: integer
                    description: Count of non-compliant controllers
                    format: int32
                  nonCompliantControllersCountLTSMinusOne:
                    type: integer
                    description: Count of non-compliant controllers at LTS minus one version
                    format: int32
                  nonCompliantControllersCountLTSMinusThree:
                    type: integer
                    description: Count of non-compliant controllers at LTS minus three or lower versions
                    format: int32
                  nonCompliantControllersCountLTSMinusTwo:
                    type: integer
                    description: Count of non-compliant controllers at LTS minus two versions
                    format: int32
                  nonCompliantControllersLTSMinusThree:
                    type: array
                    description: List of non-compliant controllers at LTS minus three or lower versions
                    items:
                      type: object
                      properties:
                        checkList:
                          type: array
                          items:
                            type: object
                            properties:
                              message:
                                type: string
                              status:
                                type: string
                              type:
                                type: string
                              upgradeCompatibilityStatus:
                                type: string
                            $$ref: '#/components/schemas/CheckList'
                        deviceDetails:
                          required:
                          - host
                          - password
                          - username
                          - wan
                          type: object
                          properties:
                            device_uuid:
                              type: string
                              description: device uuid/chassis number
                              example: C8K-4facbd05-855b-45f0-af2f-c844af179bd6
                            enable_password:
                              type: string
                              description: enable password
                              example: admin
                            host:
                              pattern: ((^\s*((([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5]))\s*$)|(^\s*((([0-9a-f]{1,4}:){7}([0-9a-f]{1,4}|:))|(([0-9a-f]{1,4}:){6}(:[0-9a-f]{1,4}|((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9a-f]{1,4}:){5}(((:[0-9a-f]{1,4}){1,2})|:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3})|:))|(([0-9a-f]{1,4}:){4}(((:[0-9a-f]{1,4}){1,3})|((:[0-9a-f]{1,4})?:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9a-f]{1,4}:){3}(((:[0-9a-f]{1,4}){1,4})|((:[0-9a-f]{1,4}){0,2}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9a-f]{1,4}:){2}(((:[0-9a-f]{1,4}){1,5})|((:[0-9a-f]{1,4}){0,3}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(([0-9a-f]{1,4}:){1}(((:[0-9a-f]{1,4}){1,6})|((:[0-9a-f]{1,4}){0,4}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:))|(:(((:[0-9a-f]{1,4}){1,7})|((:[0-9a-f]{1,4}){0,5}:((25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(\.(25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}))|:)))(%.+)?\s*$))
                              type: string
                              description: host ip
                              example: 1.1.1.1
                            local_file_name:
                              type: string
                              description: local file name
                              example: c8000v-universalk9.17.12.01.0.175851.SSA.bin
                            password:
                              type: string
                              description: ssh password
                              example: admin
                            remote_server_file_name:
                              type: string
                              description: remote server file name
                              example: c8000v-universalk9.17.12.01.0.175851.SSA.bin
                            remote_server_id:
                              type: string
                              description: remote server Id
                              example: 56a32849-aafb-4703-8887-ba64c0394835
                            username:
                              type: string
                              description: ssh username
                              example: admin
                            wan:
                              maxLength: 32
                              minLength: 3
                              pattern: (Cellular|Dialer|Ethernet|FastEthernet|FiftyGigabitEthernet|FiveGigabitEthernet|FortyGigabitEthernet|FourHundredGigE|GigabitEthernet|HundredGigE|Loopback|Multilink|Port-channel|Serial|TenGigabitEthernet|Tunnel|TwentyFiveGigE|TwentyFiveGigabitEthernet|TwoGigabitEthernet|TwoHundredGigE|Vlan|Wlan-GigabitEthernet)([0-9]*(. ?[1-9][0-9]*)*|[0-9/]+|[0-9]+/[0-9]+/[0-9]+:[0-9]+|[0-9]+/[0-9]+/[0-9]+|[0-9]+/[0-9]+|[0-9]+)
                              type: string
