tags:
- name: Workflows - Controllers Upgrade
paths:
  /v1/controllers-upgrade:
    post:
      tags:
      - Workflows - Controllers Upgrade
      summary: Trigger controllers upgrade.
      description: Trigger controllers upgrade.
      operationId: triggerControllersUpgrade
      requestBody:
        description: Request payload for controllers upgrade
        content:
          application/json:
            schema:
              required:
              - action
              - imageLocation
              - isScheduleNow
              - targetVersion
              type: object
              properties:
                action:
                  type: string
                  description: Action to perform
                  example: controllers_upgrade/controllers_patch_upgrade
                applicableControllerTypes:
                  type: array
                  description: List of controller types applicable for patch upgrade
                  example:
                  - Manager
                  - Controller
                  - Validator
                  items:
                    type: string
                    description: List of controller types applicable for patch upgrade
                    example:
                    - Manager
                    - Controller
                    - Validator
                imageLocation:
                  type: string
                  description: Image location
                  example: vmanage/cco
                isScheduleNow:
                  type: boolean
                  description: Flag to schedule the upgrade immediately
                  example: false
                schedule:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      actionStartDate:
                        type: string
                        description: Start date for the action
                        example: Sep 30 2026
                      actionStartTime:
                        type: string
                        description: Start time for the action
                        example: 12:00:00 AM
                      timeZone:
                        type: string
                        description: Timezone for the scheduled action
                        example: Asia/Kolkata
                    description: Scheduling details for a controller component
                    $$ref: '#/components/schemas/ComponentSchedule'
                  description: Scheduling details for different component types
                targetVersion:
                  type: string
                  description: Target version for upgrade
                  example: 20.18.1
              description: Request payload for controllers upgrade process
              $$ref: '#/components/schemas/ControllerUpgradeRequest'
            examples:
              Schedule Now Controllers Upgrade:
                description: Schedule Now Controllers Upgrade
                value:
                  action: controllers_upgrade
                  targetVersion: 20.18.1
                  imageLocation: vmanage/cco
                  isScheduleNow: true
              Schedule Later Controllers Upgrade:
                description: Schedule Later Controllers Upgrade
                value:
                  action: controllers_upgrade
                  targetVersion: 20.18.1
                  imageLocation: vmanage/cco
                  isScheduleNow: false
                  schedule:
                    Controller:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
                    Manager:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
                    Validator:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
              Schedule Now Patch Upgrade:
                description: Schedule Now Patch Upgrade
                value:
                  action: controllers_patch_upgrade
                  targetVersion: 20.18.1.0.0.1
                  imageLocation: vmanage/cco
                  isScheduleNow: true
                  applicableControllerTypes:
                  - Manager
                  - Controller
                  - Validator
              Schedule Later Patch Upgrade:
                description: Schedule Later Patch Upgrade
                value:
                  action: controllers_patch_upgrade
                  targetVersion: 20.18.1.0.0.1
                  imageLocation: vmanage/cco
                  isScheduleNow: false
                  applicableControllerTypes:
                  - Manager
                  - Controller
                  - Validator
                  schedule:
                    Controller:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
                    Manager:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
                    Validator:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
        required: true
      responses:
        '200':
          description: Successful response with the controllers upgrade process Id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique process Id of the Controllers upgrade.
                    example: controllers_upgrade-0ba19b6e-3b6c-4cd0-9669-dce7e148c623
                $$ref: '#/components/schemas/ControllersUpgradeResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /v1/controllers-upgrade/available-versions:
    get:
      tags:
      - Workflows - Controllers Upgrade
      summary: Retrieve available versions for Controllers upgrade.
      description: Returns a list of available versions for controller upgrades based on the specified image type.
      operationId: getAvailableVersions
      parameters:
      - name: imageType
        in: query
        required: true
        schema:
          type: string
          description: 'software: Supports vmanage/viptela images

            patch: Supports 6 tuple patch images'
          enum:
          - upgrade
          - patch
      responses:
        '200':
          description: Successful response with the list of available versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  availableVersions:
                    type: array
                    description: List of available versions for controller upgrades
                    items:
                      type: object
                      properties:
                        compatibleControllerTypes:
                          uniqueItems: true
                          type: array
                          description: Set of controller types compatible with this version
                          example:
                          - Manager
                          - Controller
                          - Validator
                          items:
                            type: string
                            description: Set of controller types compatible with this version
                            example:
                            - Manager
                            - Controller
                            - Validator
                        imageType:
                          uniqueItems: true
                          type: array
                          description: Set of supported controller types for this image
                          example:
                          - Manager
                          - Controller
                          - Validator
                          items:
                            type: string
                            description: Set of supported controller types for this image
                            example:
                            - Manager
                            - Controller
                            - Validator
                        location:
                          type: string
                          description: Location of the image
                          example: cco
                          enum:
                          - cco
                          - vmanage
                        tag:
                          type: string
                          description: Version tag indicating version status
                          example: recommended
                          enum:
                          - recommended
                          - latest
                          - custom
                        version:
                          type: string
                          description: Software version number
                      description: Version information for controllers upgrade
                      $$ref: '#/components/schemas/VersionInfo'
                description: Response containing available controller software versions
                $$ref: '#/components/schemas/AvailableVersionsResponse'
              examples:
                ExampleUpgradePayload:
                  description: ExampleUpgradePayload
                  value: "{\n\"availableVersions\": [\n  {\n    \"version\": \"20.15.2\",\n    \"imageType\": [\"Manager\",\"Controller\",\"Validator\"],\n    \"location\": \"cco\",\n    \"tag\": \"recommended\",\n    \"compatibleControllerTypes\": [\"Manager\",\"Controller\",\"Validator\"]\n  },\n  {\n    \"version\": \"20.17.1\",\n    \"imageType\": [\"Manager\",\"Controller\",\"Validator\"],\n    \"location\": \"cco\",\n    \"tag\": \"latest\",\n    \"compatibleControllerTypes\": [\"Manager\",\"Controller\",\"Validator\"]\n  },\n  {\n    \"version\": \"20.17.1\",\n    \"imageType\": [\"Controller\",\"Validator\"],\n    \"location\": \"vmanage\",\n    \"tag\": \"custom\",\n    \"compatibleControllerTypes\": [\"Controller\",\"Validator\"],\n  },\n  {\n    \"version\": \"20.17.2\",\n    \"imageType\": [\"Manager\"],\n    \"location\": \"vmanage\",\n    \"tag\": \"custom\",\n    \"compatibleControllerTypes\":  [\"Manager\"],\n  },\n  {\n    \"version\": \"20.17.3\",\n    \"imageType\": [\"Manager\",\"Controller\",\"Validator\"],\n    \"location\": \"vmanage\",\n    \"tag\": \"custom\",\n    \"compatibleControllerTypes\": [\"Manager\",\"Controller\",\"Validator\"],\n  }\n]\n}"
                ExamplePatchPayload:
                  description: ExamplePatchPayload
                  value: "{\n\"availableVersions\": [\n  {\n    \"version\": \"20.17.2.1.2.3\",\n    \"imageType\": [\"Manager\",\"Controller\",\"Validator\"],\n    \"location\": \"cco\",\n    \"tag\": \"recommended\",\n    \"compatibleControllerTypes\": [\"Manager\",\"Controller\",\"Validator\"],\n  },\n  {\n    \"version\": \"20.17.1.0.0.1\",\n    \"imageType\": [\"Manager\",\"Controller\",\"Validator\"],\n    \"location\": \"cco\",\n    \"tag\": \"latest\",\n    \"compatibleControllerTypes\": [\"Controller\",\"Validator\"],\n  },\n  {\n    \"version\": \"20.17.1.1.0.0\",\n    \"imageType\": [\"Controller\",\"Validator\"],\n    \"location\": \"vmanage\",\n    \"tag\": \"custom\",\n    \"compatibleControllerTypes\": [\"Validator\"],\n  },\n  {\n    \"version\": \"20.17.2.0.1.0\",\n    \"imageType\": [\"Manager\"],\n    \"location\": \"vmanage\",\n    \"tag\": \"custom\",\n    \"compatibleControllerTypes\": [\"Manager\"],\n  },\n  {\n    \"version\": \"20.17.3.1.1.1\",\n    \"imageType\": [\"Manager\",\"Controller\",\"Validator\"],\n    \"location\": \"vmanage\",\n    \"tag\": \"custom\",\n    \"compatibleControllerTypes\":  [\"Manager\",\"Controller\",\"Validator\"],\n  }\n]\n}"
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /v1/controllers-upgrade/cancel:
    put:
      tags:
      - Workflows - Controllers Upgrade
      summary: Cancel controllers upgrade process.
      description: Cancel the upgrade process for controllers, managers, and validators.
      operationId: cancelUpgrade
      requestBody:
        description: Request payload for controllers upgrade
        content:
          application/json:
            schema:
              required:
              - processId
              type: object
              properties:
                processId:
                  type: string
                  description: Unique ID of the upgrade process to cancel
                  example: controllers_upgrade-61fe5fb4-81d2-4ff0-8294-e23c17b0d79e
              description: Request payload for cancelling controller upgrade process
              $$ref: '#/components/schemas/ControllerUpgradeCancelRequest'
            examples:
              Request Payload:
                description: Request Payload
                value:
                  processId: controllers_upgrade-61fe5fb4-81d2-4ff0-8294-e23c17b0d79e
        required: true
      responses:
        '200':
          description: Successfully cancelled the upgrade process
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the operation (Cancel/Reschedule)
                  statusDetail:
                    type: string
                    description: Detailed description of the operation (Cancel/Reschedule) result
                $$ref: '#/components/schemas/ControllersOperationResponse'
              examples:
                Response Payload:
                  description: Response Payload
                  value:
                    status: Success
                    statusDetail: Upgrade process successfully cancelled
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /v1/controllers-upgrade/reschedule:
    put:
      tags:
      - Workflows - Controllers Upgrade
      summary: Reschedule controllers upgrade process.
      description: Reschedule the upgrade process for managers, validators, and controllers by providing new execution timestamps.
      operationId: rescheduleUpgrade
      requestBody:
        description: Request payload for controllers upgrade
        content:
          application/json:
            schema:
              required:
              - isScheduleNow
              - processId
              type: object
              properties:
                isScheduleNow:
                  type: boolean
                  description: Flag to schedule the upgrade immediately
                  example: false
                processId:
                  type: string
                  description: Unique ID of the upgrade process
                  example: controllers_upgrade-61fe5fb4-81d2-4ff0-8294-e23c17b0d79e
                schedule:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      actionStartDate:
                        type: string
                        description: Start date for the action
                        example: Sep 30 2026
                      actionStartTime:
                        type: string
                        description: Start time for the action
                        example: 12:00:00 AM
                      timeZone:
                        type: string
                        description: Timezone for the scheduled action
                        example: Asia/Kolkata
                    description: Scheduling details for a controller component
                    $$ref: '#/components/schemas/ComponentSchedule'
                  description: Scheduling details for different component types
              description: Request payload for rescheduling controller upgrade process
              $$ref: '#/components/schemas/ControllerUpgradeRescheduleRequest'
            examples:
              Request Payload - Controllers:
                description: Request Payload - Controllers
                value:
                  processId: controllers_upgrade-61fe5fb4-81d2-4ff0-8294-e23c17b0d79e
                  isScheduleNow: false
                  schedule:
                    Controller:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
                    Manager:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
                    Validator:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
              Request Payload - Patch:
                description: Request Payload - Patch
                value:
                  processId: controllers_patch_upgrade-61fe5fb4-81d2-4ff0-8294-e23c17b0d79e
                  isScheduleNow: false
                  schedule:
                    Validator:
                      actionStartDate: Sep 30 2026
                      actionStartTime: 12:00:00 AM
                      timeZone: Asia/Kolkata
              Request Payload - Schedule Now:
                description: Request Payload - Schedule Now
                value:
                  processId: controllers_upgrade-61fe5fb4-81d2-4ff0-8294-e23c17b0d79e
                  isScheduleNow: true
        required: true
      responses:
        '200':
          description: Successfully rescheduled the upgrade process
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the operation (Cancel/Reschedule)
                  statusDetail:
                    type: string
                    description: Detailed description of the operation (Cancel/Reschedule) result
                $$ref: '#/components/schemas/ControllersOperationResponse'
              examples:
                Response Payload:
                  description: Response Payload
                  value:
                    status: Success
                    statusDetail: Upgrade process successfully rescheduled
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
