openapi: 3.2.0
info:
  title: Monitoring and Troubleshooting Monitoring - Device Details API
  description: "Includes API operations for the following:\n  Real-time monitoring\n  Accessing statistics APIs and statistics bulk APIs\n  Retrieving device state\n  Managing alarms and events"
  contact:
    email: vmanage@cisco.com
  license:
    name: Commercial License
    url: https://www.cisco.com/c/en/us/solutions/enterprise-networks/sd-wan/index.html
  version: 26.1.0+2026-01-06
  x-provenance:
    method: harvested
    authored_by: Cisco Catalyst SD-WAN
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
    first_party: true
    provider_published: true
    source_host: pubhub.devnetcloud.com
    note: 4,138 operations across 2,841 paths, published by Cisco as self-contained per-operation OpenAPI 3.1.0 fragments on the DevNet CDN and consolidated here into 13 documents. Ownership verified from info.contact vmanage@cisco.com and the Cisco license URL rather than from the fetch host.
  x-evidence:
  - type: source
    url: https://pubhub.devnetcloud.com/media/cisco-catalyst-sd-wan-26-1-api-guide/docs/
  - type: source
    url: https://developer.cisco.com/docs/sdwan/
servers:
- url: /dataservice
tags:
- name: Monitoring - Device Details
paths:
  /data/device/state/{state_data_type}:
    get:
      tags:
      - Monitoring - Device Details
      description: Get device state data
      operationId: generateDeviceStateData
      parameters:
      - name: state_data_type
        in: path
        required: true
        schema:
          type: string
      - name: startId
        in: query
        schema:
          type: string
      - name: count
        in: query
        schema:
          type: integer
          format: int32
          default: 1000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        '@rid':
                          type: integer
                          format: int32
                          example: 3413
                        auto-downstream-bandwidth:
                          type: string
                          example: '0'
                        auto-upstream-bandwidth:
                          type: string
                          example: '0'
                        bia-address:
                          type: string
                          example: 00:50:56:00:01:0e
                        createTimeStamp:
                          type: string
                          example: '1681732399130'
                        description:
                          type: string
                          example: Service Management VPN Interface Ethernet
                        hwaddr:
                          type: string
                          example: 00:50:56:00:01:0e
                        if-admin-status:
                          type: string
                          example: if-state-up
                        if-oper-status:
                          type: string
                          example: if-oper-state-ready
                        ifindex:
                          type: string
                          example: '1'
                        ifname:
                          type: string
                          example: GigabitEthernet1
                        interface-type:
                          type: string
                          example: iana-iftype-ethernet-csmacd
                        ip-address:
                          type: string
                          example: 10.0.1.14
                        ipv4-subnet-mask:
                          type: string
                          example: 255.255.255.0
                        ipv4-tcp-adjust-mss:
                          type: string
                          example: '0'
                        ipv6-tcp-adjust-mss:
                          type: string
                          example: '0'
                        lastupdated:
                          type: integer
                          format: int32
                          example: 168232232
                        mtu:
                          type: string
                          example: '1500'
                        recordId:
                          type: string
                          example: 0:CEdgeInterfaceNode:1681732387143:3340
                        rx-drops:
                          type: integer
                          format: int32
                          example: 0
                        rx-errors:
                          type: integer
                          format: int32
                          example: 1
                        rx-octets:
                          type: integer
                          format: int32
                          example: 22625972
                        rx-packets:
                          type: string
                          example: '367109'
                        speed-mbps:
                          type: string
                          example: '1000'
                        tx-drops:
                          type: integer
                          format: int32
                          example: 0
                        tx-errors:
                          type: integer
                          format: int32
                          example: 0
                        tx-octets:
                          type: integer
                          format: int32
                          example: 12993252
                        tx-packets:
                          type: integer
                          format: int32
                          example: 38282
                        vdevice-dataKey:
                          type: string
                          example: 172.16.255.14-512-GigabitEthernet1-10.0.1.14-00:50:56:00:01:0e
                        vdevice-host-name:
                          type: string
                          example: vm4
                        vdevice-name:
                          type: string
                          example: 172.16.255.14
                        vmanage-system-ip:
                          type: string
                          example: 172.16.255.14
                        vpn-id:
                          type: string
                          example: '512'
                      $$ref: '#/components/schemas/GenerateDeviceStateDataData'
                $$ref: '#/components/schemas/GenerateDeviceStateData'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /data/device/state/{state_data_type}/fields:
    get:
      tags:
      - Monitoring - Device Details
      description: Get device state data fileds
      operationId: generateDeviceStateDataFields
      parameters:
      - name: state_data_type
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                properties:
                  empty:
                    type: boolean
                items:
                  type: object
                  properties:
                    dataType:
                      type: string
                    display:
                      type: string
                    property:
                      type: string
                  $$ref: '#/components/schemas/GenerateDeviceStateDataFieldsInner'
                $$ref: '#/components/schemas/GenerateDeviceStateDataFields'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
