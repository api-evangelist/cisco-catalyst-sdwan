                        hwaddr:
                          type: string
                          example: 00:50:56:00:01:0e
                        if-admin-status:
                          type: string
                          example: if-state-up
                        if-oper-status:
                          type: string
                          example: if-oper-state-ready
                        ifindex:
                          type: string
                          example: '1'
                        ifname:
                          type: string
                          example: GigabitEthernet1
                        interface-type:
                          type: string
                          example: iana-iftype-ethernet-csmacd
                        ip-address:
                          type: string
                          example: 10.0.1.14
                        ipv4-subnet-mask:
                          type: string
                          example: 255.255.255.0
                        ipv4-tcp-adjust-mss:
                          type: string
                          example: '0'
                        ipv6-tcp-adjust-mss:
                          type: string
                          example: '0'
                        lastupdated:
                          type: integer
                          format: int32
                          example: 168232232
                        mtu:
                          type: string
                          example: '1500'
                        recordId:
                          type: string
                          example: 0:CEdgeInterfaceNode:1681732387143:3340
                        rx-drops:
                          type: integer
                          format: int32
                          example: 0
                        rx-errors:
                          type: integer
                          format: int32
                          example: 1
                        rx-octets:
                          type: integer
                          format: int32
                          example: 22625972
                        rx-packets:
                          type: string
                          example: '367109'
                        speed-mbps:
                          type: string
                          example: '1000'
                        tx-drops:
                          type: integer
                          format: int32
                          example: 0
                        tx-errors:
                          type: integer
                          format: int32
                          example: 0
                        tx-octets:
                          type: integer
                          format: int32
                          example: 12993252
                        tx-packets:
                          type: integer
                          format: int32
                          example: 38282
                        vdevice-dataKey:
                          type: string
                          example: 172.16.255.14-512-GigabitEthernet1-10.0.1.14-00:50:56:00:01:0e
                        vdevice-host-name:
                          type: string
                          example: vm4
                        vdevice-name:
                          type: string
                          example: 172.16.255.14
                        vmanage-system-ip:
                          type: string
                          example: 172.16.255.14
                        vpn-id:
                          type: string
                          example: '512'
                      $$ref: '#/components/schemas/GenerateDeviceStateDataData'
                $$ref: '#/components/schemas/GenerateDeviceStateDataWithQueryString'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /device:
    get:
      tags:
      - Monitoring - Device Details
      description: List all devices
      operationId: listAllDevices
      parameters:
      - name: site-id
        in: query
        schema:
          pattern: ^[0-9]+$
          type: string
      - name: includeTenantvSmart
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  board-serial:
                    type: string
                    example: '12345704'
                  certificate-validity:
                    type: string
                    example: Valid
                  connectedVManages:
                    type: array
                    items:
                      type: string
                  controlConnections:
                    type: string
                    example: '9'
                  device-groups:
                    type: array
                    items:
                      type: string
                  device-model:
                    type: string
                    example: vmanage
                  device-os:
                    type: string
                    example: device-os
                  device-type:
                    type: string
                    example: vmanage
                  deviceId:
                    type: string
                    example: 169.254.10.1
                  domain-id:
                    type: string
                    example: '0'
                  host-name:
                    type: string
                    example: 169.254.10.1
                  isDeviceGeoData:
                    type: boolean
                    example: false
                  lastupdated:
                    type: string
                    example: '1634627015139'
                  latitude:
                    type: string
                    example: '37.666684'
                  layoutLevel:
                    type: integer
                    format: int32
                    example: 1
                  local-system-ip:
                    type: string
                    example: 172.16.255.200
                  longitude:
                    type: string
                    example: '-122.777023'
                  max-controllers:
                    type: string
                    example: '0'
                  model_sku:
                    type: string
                    example: None
                  personality:
                    type: string
                    example: vmanage
                  platform:
                    type: string
                    example: x86_64
                  reachability:
                    type: string
                    example: reachable
                  site-id:
                    type: string
                    example: '200'
                  state:
                    type: string
                    example: green
                  state_description:
                    type: string
                    example: All daemons up
                  status:
                    type: string
                    example: normal
                  statusOrder:
                    type: string
                    example: '4'
                  system-ip:
                    type: string
                    example: 169.254.10.1
                  testbed_mode:
                    type: boolean
                    example: true
                  timezone:
                    type: string
                    example: UTC
                  total_cpu_count:
                    type: string
                    example: '8'
                  uptime-date:
                    type: string
                    example: '1634626320000'
                  uuid:
                    type: string
                    example: 96af574a-eadd-4b6a-97bf-d5c1e98f40f2
                  validity:
                    type: string
                    example: valid
                  version:
                    type: string
                    example: '9'
                $$ref: '#/components/schemas/DeviceData'
              examples:
                Devices List:
                  description: Devices List
                  value:
                  - deviceId: 169.254.10.1
                    system-ip: 169.254.10.1
                    host-name: vm200
                    reachability: reachable
                    status: normal
                    personality: vmanage
                    device-type: vmanage
                    timezone: UTC
                    device-groups:
                    - No groups
                    lastupdated: 1634627015139
                    domain-id: '0'
                    board-serial: '12345704'
                    certificate-validity: Valid
                    max-controllers: '0'
                    uuid: 96af574a-eadd-4b6a-97bf-d5c1e98f40f2
                    controlConnections: '9'
                    device-model: vmanage
                    version: 20.8.999-1397
                    connectedVManages:
                    - 169.254.10.1
                    site-id: '200'
                    latitude: '37.666684'
                    longitude: -122.777023
                    isDeviceGeoData: false
                    platform: x86_64
                    uptime-date: 1634626320000
                    statusOrder: 4
                    device-os: next
                    validity: valid
                    state: green
                    state_description: All daemons up
                    model_sku: None
                    local-system-ip: 172.16.255.200
                    total_cpu_count: '8'
                    testbed_mode: true
                    layoutLevel: 1
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /device/blockSync:
    post:
      tags:
      - Monitoring - Device Details
      description: Set collection manager block set flag
      operationId: setBlockSync
      parameters:
      - name: blockSync
        in: query
        description: Block sync flag
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /device/config:
    get:
      tags:
      - Monitoring - Device Details
      description: Get device running configuration
      operationId: getDeviceRunningConfig
      parameters:
      - name: deviceId
        in: query
        description: Device Id list
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: string
              examples:
                Device running configuration:
                  description: Device running configuration
            text/xml:
              schema:
                type: string
              examples:
                Device running configuration:
                  description: Device running configuration
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /device/config/html:
    get:
      tags:
      - Monitoring - Device Details
      description: Get device running configuration in HTML format
      operationId: getDeviceRunningConfigHTML
      parameters:
      - name: deviceId
        in: query
        description: Device Id list
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            text/html:
              schema:
                type: string
              examples:
                Device running configuration:
                  description: Device running configuration
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
      deprecated: true
  /device/counters:
    get:
      tags:
      - Monitoring - Device Details
      description: Get device counters
      operationId: getDeviceCounters
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        crashCount:
                          type: integer
                          format: int32
                          example: 0
                        expectedControlConnections:
                          type: integer
                          format: int32
                          example: 3
                        number-vsmart-control-connections:
                          type: integer
                          format: int32
                          example: 3
                        rebootCount:
                          type: integer
                          format: int32
                          example: 2
                        system-ip:
                          type: string
                      $$ref: '#/components/schemas/DeviceCountersData'
                  header:
                    type: object
                    properties:
                      generatedOn:
                        type: integer
                        format: int64
                        example: 1635224742597
                    $$ref: '#/components/schemas/DeviceResponseHeader'
                $$ref: '#/components/schemas/DeviceCountersResponse'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /device/devicestatus:
    get:
      tags:
      - Monitoring - Device Details
      description: Get devices status per type
      operationId: getDeviceOnlyStatus
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    format: int32
                    example: 0
                  detailsURL:
                    type: string
                    example: /dataservice/device?personality=vbond&status=error
                  image:
                    type: string
                    example: images/vsmart.png
                  name:
                    type: string
                    example: vSmart
                  statusList:
                    type: array
                    items:
                      type: array
                      properties:
                        empty:
                          type: boolean
                      items:
                        type: object
                        properties:
                          count:
                            type: integer
                            format: int64
                          message:
                            type: string
                          name:
                            type: string
                          status:
                            type: string
                        $$ref: '#/components/schemas/StatusObject'
                      $$ref: '#/components/schemas/StatusList'
                  type:
                    type: string
                    example: vSmart
                $$ref: '#/components/schemas/DeviceStatusData'
              examples:
                Device Status:
                  description: Device Status
                  value: "[\n  {\n    \"type\": \"vSmart\",\n    \"name\": \"vSmart\",\n    \"image\": \"images/vsmart.png\",\n    \"count\": 3,\n    \"detailView\": \"dialog\",\n    \"detailsURL\": \"/dataservice/device?personality=vsmart\",\n    \"statusList\": [\n      {\n        \"status\": \"error\",\n        \"name\": \"Error\",\n        \"detailView\": \"dialog\",\n        \"detailsURL\": \"/dataservice/device?personality=vsmart&status=error\",\n        \"color\": \"fa7c7d\",\n        \"icon\": \"images/device/device-error.png\",\n        \"count\": 0\n      },\n      {\n        \"status\": \"warning\",\n        \"name\": \"Warning\",\n        \"detailView\": \"dialog\",\n        \"detailsURL\": \"/dataservice/device?personality=vsmart&status=warning\",\n        \"color\": \"f2ce60\",\n        \"icon\": \"images/device/device-warning.png\",\n        \"count\": 0\n      },\n      {\n        \"status\": \"normal\",\n        \"name\": \"Normal\",\n        \"detailView\": \"dialog\",\n        \"detailsURL\": \"/dataservice/device?personality=vsmart&status=normal\",\n        \"color\": \"b0e276\",\n        \"icon\": \"images/device/device-normal.png\",\n        \"count\": 3\n      },\n      {\n        \"status\": \"new\",\n        \"name\": \"Discovered device\",\n        \"detailView\": \"dialog\",\n        \"detailsURL\": \"/dataservice/device?personality=vsmart&status=new\",\n        \"color\": \"7c8afa\",\n        \"icon\": \"images/device/device-new.png\",\n        \"count\": 0\n      }\n    ]"
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /device/enableSDAVC/{deviceIP}/{enable}:
    post:
      tags:
      - Monitoring - Device Details
      description: Enable/Disable SDAVC on device
      operationId: enableSDAVCOnDevice
      parameters:
      - name: deviceIP
        in: path
        description: Device IP
        required: true
        schema:
          type: string
      - name: enable
        in: path
        description: Enable/Disable flag
        required: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /device/featuresupport:
    get:
      tags:
      - Monitoring - Device Details
      description: Get device feature support summary info
      operationId: getDeviceFeatureSupport
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  cellular:
                    type: boolean
                    example: true
                  sdrouting:
                    type: boolean
                    example: true
                $$ref: '#/components/schemas/DeviceFeatureSupportData'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /device/hardwarehealth/detail:
    get:
      tags:
      - Monitoring - Device Details
      description: Get hardware health details for device
      operationId: getHardwareHealthDetails
      parameters:
      - name: deviceId
        in: query
        description: Device Id
        schema:
          type: string
      - name: state
        in: query
        description: Device state
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bfdSessions:
                      type: string
                      example: '3'
                    board-serial:
                      type: string
                      example: '12346568'
                    controlConnections:
                      type: string
                      example: '3'
                    cpuLoadDisplay:
                      type: string
                      example: '39.27'
                    device-model:
                      type: string
                      example: vedge-cloud
                    device-type:
                      type: string
                      example: vedge
                    hardwareState:
                      type: string
                      example: normal
                    host-name:
                      type: string
                      example: vm11
                    lastupdated:
                      type: integer
                      format: int64
                      example: 1635371851165
                    local-system-ip:
                      type: string
                      example: 172.16.255.21
                    memUsageDisplay:
                      type: string
                      example: '52.0'
                    number-vsmart-peers:
                      type: integer
                      format: int32
                      example: 2
                    ompPeers:
                      type: string
                      example: '2'
                    reachability:
                      type: string
                      example: reachable
                    site-id:
                      type: string
                      example: '100'
                    system-ip:
                      type: string
                      example: 172.16.255.21
                    uptime-date:
                      type: integer
                      format: int64
                      example: 1635324240000
                    uuid:
                      type: string
                      example: 63e8518c-e76f-4d5f-a4c7-28ffb669526b
                    version:
                      type: string
                      example: 20.7.999-1133
                  $$ref: '#/components/schemas/DeviceHardwareHealthDetail'
              examples:
                Device hardware health details:
                  description: Device hardware health details
                  value:
                    data:
                    - bfdSessions: '3'
                      memUsageDisplay: '52.0'
                      site-id: '100'
                      device-type: vedge
                      version: 20.7.999-1133
                      hardwareState: normal
                      uptime-date: 1635324240000
                      uuid: 63e8518c-e76f-4d5f-a4c7-28ffb669526b
                      lastupdated: 1635371851165
                      reachability: reachable
                      device-model: vedge-cloud
                      host-name: vm11
                      local-system-ip: 172.16.255.21
                      cpuLoadDisplay: '39.27'
                      controlConnections: '3'
                      board-serial: '12346568'
                      number-vsmart-peers: 2
                      system-ip: 172.16.255.21
                      ompPeers: '2'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /device/hardwarehealth/summary:
    get:
      tags:
      - Monitoring - Device Details
      description: Get hardware health summary for device
      operationId: getHardwareHealthSummary
      parameters:
      - name: isCached
        in: query
        description: Status cached
        schema:
          type: boolean
          default: false
      - name: vpnId
        in: query
        description: VPN Id
        required: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
              examples:
                Device hardware health:
                  description: Device hardware health
                  value:
                    data:
                    - count: 5
                      status: error
                      statusList:
                      - status: up
                        count: 5
                        message: 5 {normal=5, warning=0, error=0}
