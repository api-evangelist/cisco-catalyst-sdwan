tags:
- name: Monitoring - SDRA
paths:
  /statistics/sdra/headends:
    get:
      tags:
      - Monitoring - SDRA
      description: Get SD-WAN Remote Access Head-end summary
      operationId: getSdraHeadendSummary
      parameters:
      - name: site
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ipsec_enabled:
                    type: integer
                    format: int64
                  sslvpn_enabled:
                    type: integer
                    format: int64
                $$ref: '#/components/schemas/SdraHeadendSummary'
              examples:
                SDRA Head-end Summary:
                  description: SDRA Head-end Summary
                  value: "{\n  \"ipsec_enabled\": 5,\n  \"sslvpn_enabled\": 2,\n}"
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
  /statistics/sdra/sessions:
    get:
      tags:
      - Monitoring - SDRA
      description: Get SD-WAN Remote Access session summary
      operationId: getSdraSessionSummary
      parameters:
      - name: site
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  top:
                    type: array
                    items:
                      type: object
                      properties:
                        host_name:
                          type: string
                        ipsec_anyconnect:
                          type: integer
                          format: int64
                        ipsec_soho:
                          type: integer
                          format: int64
                        ipsec_unknown:
                          type: integer
                          format: int64
                        site_id:
                          type: integer
                          format: int64
                        sslvpn_anyconnect:
                          type: integer
                          format: int64
                        system_ip:
                          type: string
                      $$ref: '#/components/schemas/SdraDeviceStatsShort'
                  total:
                    type: object
                    properties:
                      ipsec_anyconnect:
                        type: integer
                        format: int64
                      ipsec_soho:
                        type: integer
                        format: int64
                      ipsec_unknown:
                        type: integer
                        format: int64
                      sslvpn_anyconnect:
                        type: integer
                        format: int64
                    $$ref: '#/components/schemas/SdraSessionCount'
                $$ref: '#/components/schemas/SdraSessionSummary'
              examples:
                SDRA Session Summary:
                  description: SDRA Session Summary
                  value: "{\n  \"total\": {\n      \"ipsec_anyconnect\": 50,\n      \"ipsec_soho\": 20,\n      \"ipsec_unknown\": 25,\n      \"sslvpn_anyconnect\": 200,\n  }, \"top\": [\n      {\n          \"system_ip\": \"1.1.1.1\",\n          \"site_id\": 10,\n          \"host_name\": vm10,\n          \"ipsec_anyconnect\": 3,\n          \"ipsec_soho\": 5,\n          \"ipsec_unknown\": 11,\n          \"sslvpn_anyconnect\": 0,\n      },\n      {\n          \"system_ip\": \"2.2.2.2\",\n          \"site_id\": 20,\n          \"host_name\": vm20,\n          \"ipsec_anyconnect\": 0,\n          \"ipsec_soho\": 0,\n          \"ipsec_unknown\": 0,\n          \"sslvpn_anyconnect\": 85,\n      }\n  ]\n}"
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
